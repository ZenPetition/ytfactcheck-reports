<script id="data" type="application/json">{"meta": {"id": "JLAbWBYF5OA", "title": "I’m (Politely) Begging You to Ignore These 6 Pieces of Advice Before It’s Too Late", "description": "Join my free newsletter → https://sandeepswadia.beehiiv.com/\n\nTake us on your morning run or commute, follow us on Spotify: https://open.spotify.com/show/033nSSACs3S4g5NUIrXnHx\n\nEvery day, we're inundated with generic self-help clichés. Catchphrases like \"never give up,\" \"follow your passion,\" or \"look out for number one\" look great on social media, but following them can quietly derail your life and your goals.\n\nThe problem isn't that this advice is entirely wrong; it’s that it only tells half the story. In this episode, I break down the hidden traps inside 6 pieces of conventional wisdom that every ambitious person hears, uncovering the missing half you need before advice that sounds right leads you to the wrong decision.\n\n\"Never Give Up\": Why persistence and stubbornness look identical from the inside.\n\n\"Look Out for Yourself, No One Else Will\": Why life is rarely a zero-sum game, and how investing in others is actually the best way to look out for yourself.\n\n\"Follow Your Passion\": The three essential questions to answer before quitting your day job.\n\n\"Money Can’t Buy Happiness\": How money actually changes your life by buying freedom, safety, and options.\n\n\"Find Your Soulmate\": Why dreaming of an effortless soulmate blinds us to the daily reality of being with someone you love.\n\n\"You Are Who You Are\":  Why shedding outdated identities is essential to navigating a rapidly changing world shaped by AI.\n\nYou can be grateful for what once carried you across the river without forcing yourself to carry it for the rest of your journey.\n\nThank you, and I love you.\n\n0:00 Introduction\n0:59 The myth of 'never give up'\n3:46 The myth of 'look out for #1'\n7:09 The myth of 'following your passion'\n10:34 The myth that 'money can buy happiness'\n12:50 The myth of 'finding your soulmate'\n14:52 The myth that 'you are who you are'\n16:50 The traveller and the River", "channel": "Sandeep Swadia", "channel_url": "https://www.youtube.com/channel/UC4ZVkG3RQPzvZk7alIVjcCg", "upload_date": "20261002", "duration": 1075, "webpage_url": "https://www.youtube.com/watch?v=JLAbWBYF5OA", "thumbnail": "https://i.ytimg.com/vi/JLAbWBYF5OA/maxresdefault.jpg", "chapters": [{"title": "Introduction", "start": 0, "end": 59}, {"title": "The myth of 'never give up'", "start": 59, "end": 226}, {"title": "The myth of 'look out for #1'", "start": 226, "end": 429}, {"title": "The myth of 'following your passion'", "start": 429, "end": 634}, {"title": "The myth that 'money can buy happiness'", "start": 634, "end": 770}, {"title": "The myth of 'finding your soulmate'", "start": 770, "end": 892}, {"title": "The myth that 'you are who you are'", "start": 892, "end": 1010}, {"title": "The traveller and the River", "start": 1010, "end": 1075}]}, "sections": [{"title": "Introduction", "start": 0, "end": 59}, {"title": "The myth of 'never give up'", "start": 59, "end": 226}, {"title": "The myth of 'look out for #1'", "start": 226, "end": 429}, {"title": "The myth of 'following your passion'", "start": 429, "end": 634}, {"title": "The myth that 'money can buy happiness'", "start": 634, "end": 770}, {"title": "The myth of 'finding your soulmate'", "start": 770, "end": 892}, {"title": "The myth that 'you are who you are'", "start": 892, "end": 1010}, {"title": "The traveller and the River", "start": 1010, "end": 1075}], "items": [{"claim": "The speaker was a homeless teenager in Mumbai.", "quote": "I was a homeless teenager in Mumbai,", "start": 19.67, "end": 21.62, "category": "Biography", "section": "Introduction", "id": 1, "llm_start": 19.7, "llm_end": 21.6, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The claim that Sandeep Swadia was a homeless teenager in Mumbai appears only in sources he controls or that recycle atch": false, "verdict": "True", "explanation": "Independent reporting confirms Sandeep Swadia served as CEO of White Ops (later HUMAN Security), a cybersecurity and digital advertising-fraud technology company, from about 2017 to 2019 before joining The Trade Desk. Business Insider and other business profiles describe him as a former CEO of that startup, not only his own site.", "sources": [{"title": "Sandeep Swadia — Grokipedia", "url": "https://grokipedia.com/page/Sandeep_Swadia"}, {"title": "Sandeep Swadia - Crunchbase Person Profile", "url": "https://www.crunchbase.com/person/sandeep-swadia"}, {"title": "Sandeep Swadia: Visionary Leader Driving Innovation in Digital ...", "url": "https://bionewsly.com/sandeep-swadia/"}, {"title": "The Trade Desk Hired a Former CEO As Its Chief Data and Trust Officer ...", "url": "https://www.businessinsider.com/the-trade-desk-hired-former-ceo-chief-data-trust-officer-2019-10?op=1"}, {"title": "$8.6 billion Trade Desk just brought in a cybersecurity CEO to serve as ...", "url": "https://www.latestnigeriannews.com/news/7808941/86-billion-trade-desk-just-brought-in-a-cybersecurity-ceo-to-serve-as-data-chief.html"}], "t": 29, "clip": "clips/claim_006_27520_34220.mp4"}, {"claim": "A company called Tiny Speck released an online game called Glitch.", "quote": "A company called Tiny Speck released an online game called Glitch.", "start": 69.55, "end": 74.68, "category": "Technology", "section": "The myth of 'never give up'", "id": 7, "llm_start": 68.9, "llm_end": 76.5, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Wikipedia states that Glitch was a browser-based massively multiplayer online game created by Tiny Speck and officially launched on September 27, 2011. That matches the claim that Tiny Speck released an online game called Glitch.", "sources": [{"title": "Glitch (video game) - Wikipedia", "url": "https://en.wikipedia.org/wiki/Glitch_(video_game)"}], "t": 69, "clip": "clips/claim_007_67550_76680.mp4"}, {"claim": "In 2012, Glitch's CEO said the game needed to be closed.", "quote": "In 2012, the CEO said, “We need to close the game.", "start": 74.68, "end": 79.9, "category": "History", "section": "The myth of 'never give up'", "id": 8, "llm_start": 76.5, "llm_end": 79.9, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "Stewart Butterfield, CEO of Tiny Speck, did announce in November 2012 that Glitch would close because it lacked a large enough audience to sustain itself and a buyer could not be found. However, none of the sources record him saying the exact words “We need to close the game”; the public statements used more detailed language about audience size, costs, and Flash’s decline.", "sources": [{"title": "What Happened to Glitch, the Social MMO Game? - Failory", "url": "https://www.failory.com/cemetery/glitch"}, {"title": "Stylish social MMO Glitch to close its online world on Dec. 9 ... - Polygon", "url": "https://www.polygon.com/2012/11/14/3647584/stylish-social-mmo-glitch-to-close-its-online-world-on-dec-9-tiny/"}, {"title": "The story of Glitch : Why this odd MMO is shutting downStylish social MMO Glitch to close its online world ... - PolygonStewart Butterfield's Glitch Is Closing - Business Insider", "url": "https://www.gamedeveloper.com/business/the-story-of-i-glitch-i-why-this-odd-mmo-is-shutting-down"}], "t": 74, "clip": "clips/claim_008_72680_81900.mp4"}, {"claim": "Tiny Speck had 40 employees who were asked to abandon the Glitch project.", "quote": "all 40 employees were asked to give up their dream.", "start": 85.27, "end": 90.31, "category": "History", "section": "The myth of 'never give up'", "id": 9, "llm_start": 85.6, "llm_end": 92.4, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "Contemporary reporting said Tiny Speck had roughly 45 employees when Glitch closed and laid off about 30, keeping a small core team that pivoted to Slack. No source states that the company had exactly 40 employees or that all of them were asked to abandon the project or “give up their dream.”", "sources": [{"title": "Stewart Butterfield's Glitch Is Closing - Business InsiderHow Slack Emerged from a Failed Game - startupshortcut.comWhat Happened to Glitch, the Social MMO Game? - FailoryHow a failed game became a billion-dollar office platform ...Slack Technologies - WikipediaHow Stewart Butterfield Pivoted a Failed Video Game Into Slack", "url": "https://www.businessinsider.com/stewart-butterfield-tiny-speck-glitch-closing-2012-11"}, {"title": "How Stewart Butterfield Pivoted a Failed Video Game Into Slack", "url": "https://hustlerslibrary.com/how-stewart-butterfield-pivoted-a-failed-video-game-into-slack/"}, {"title": "POSTMORTEM: He Burned $17M on a Failed Game. Then Built a ...From Failure to Fortune: How Slack Pivoted from a Failed Game ...", "url": "https://www.youtube.com/watch?v=tfnPwGqAvRo"}], "t": 85, "clip": "clips/claim_009_83270_92310.mp4"}, {"claim": "The Glitch team created an internal messaging and file-sharing tool.", "quote": "the team created an internal messaging, file sharing tool,", "start": 93.3, "end": 97.93, "category": "Technology", "section": "The myth of 'never give up'", "id": 10, "llm_start": 92.4, "llm_end": 98.2, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Multiple sources confirm that Tiny Speck, the team developing the game Glitch, built an internal communication system for its distributed staff. Wikipedia states that these tools, initially based on IRC, included scripts to automate and organize file exchanges. Other accounts describe the same homegrown layer as supporting messaging, searchable history, and file sharing, which later became Slack.", "sources": [{"title": "Slack (software) - Wikipedia", "url": "https://en.wikipedia.org/wiki/Slack_(software)"}, {"title": "Slack and the Pivot from Glitch — Fact Finder | ONL", "url": "https://onl.li/tools/fact-finder-449/technology-and-inventions/slac   <div class="ctext">${esc(i.claim)}</div>${i.quote?`<div class="quote">“${esc(i.quote)}”</div>`:''}
  <div>${esc(i.explanation)}</div>
  ${(i.sources||[]).length?`<ol class="src">${i.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a></li>`).join('')}</ol>`:'<div class="src" style="color:var(--muted)">No sources retrieved.</div>'}
  </div><div class="media">${media(i)}</div></div>`;
}
function group(arr,k){const m=new Map();arr.forEach(i=>{if(!m.has(i[k]))m.set(i[k],[]);m.get(i[k]).push(i)});return m}
const secOrder=t=>{const i=D.sections.findIndex(s=>s.title===t);return i<0?1e9:i};
function draw(){
  const q=document.getElementById('q').value.toLowerCase(),cat=document.getElementById('cat').value,g=document.getElementById('grp').value;
  const f=D.items.filter(i=>active.has(i.verdict)&&(!cat||i.category===cat)&&(!q||[i.claim,i.quote,i.explanation,i.section,i.category].join(' ').toLowerCase().includes(q)));
  const L=document.getElementById('list');
  if(!f.length){L.innerHTML='<div class="empty">No claims match the current filters.</div>';return}
  if(g==='time'){L.innerHTML=f.map(card).join('');return}
  const [k1,k2]=g==='cat'?['category','section']:['section','category'];
  const keys1=[...group(f,k1).entries()].sort((a,b)=>k1==='section'?secOrder(a[0])-secOrder(b[0]):a[0].localeCompare(b[0]));
  L.innerHTML=keys1.map(([a,arr])=>`<h2>${esc(a)} <span style="color:var(--muted);font-size:14px">(${arr.length})</span></h2>`+
    [...group(arr,k2).entries()].sort((x,y)=>k2==='section'?secOrder(x[0])-secOrder(y[0]):x[0].localeCompare(y[0]))
    .map(([b,arr2])=>`<h3>${esc(b)}</h3>`+arr2.map(card).join('')).join('')).join('');
}
document.querySelectorAll('.stat[data-v]').forEach(el=>el.onclick=()=>{const v=el.dataset.v;active.has(v)?active.delete(v):active.add(v);el.classList.toggle('off');draw()});
['q','cat','grp'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
document.getElementById('list').addEventListener('click',e=>{const p=e.target.closest('.ph');if(!p)return;
  p.outerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${M.id}?start=${p.dataset.t}&autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`});
draw();
</script></body></html>
