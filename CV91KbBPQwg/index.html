im_362_5714720_5720430.mp4"}, {"claim": "A woman placing a price tag on her body is described as charging $180 per month.", "quote": "and it's $180 a month", "start": 5731.57, "end": 5733.17, "category": "Economics", "section": "Intro", "id": 363, "llm_start": 5731.6, "llm_end": 5733.2, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "None of the provided sources contains the Jubilee video transcript, the quoted line, or any information about a woman described as charging $180 per month. The sources are unrelated statistics pages and references, so they cannot confirm or refute the claim.", "sources": [], "t": 5731, "clip": "clips/claim_363_5729570_5735170.mp4"}, {"claim": "The standard of calling monetization degrading is not applied to other types of employment.", "quote": "when we don't apply that standard to other types of employment.", "start": 5752.89, "end": 5755.41, "category": "Other", "section": "Intro", "id": 364, "llm_start": 5752.9, "llm_end": 5755.4, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The claim is a broad comparative judgment about how society applies the label \"degrading\" to monetization across employment types, not a discrete measurable fact. The provided sources define monetization, discuss degrading or stigmatized work, and describe non-standard employment, but none directly tests whether this specific standard is applied unequally. The evidence is therefore insufficient to confirm or refute the statement.", "sources": [{"title": "Monetization - Wikipedia", "url": "https://en.wikipedia.org/wiki/Monetization"}, {"title": "The Struggle of Degrading Jobs: How Society Fails its Most ...", "url": "https://blog.imodstyle.com/the-struggle-of-degrading-jobs-how-society-fails-its-most-vulnerable-workers/"}, {"title": "Stigmatized Work and Stigmatized Workers - Annual Reviews", "url": "https://www.annualreviews.org/content/journals/10.1146/annurev-orgpsych-012420-091423"}], "t": 5752, "clip": "clips/claim_364_5750890_5757410.mp4"}, {"claim": "In other careers/industries, intimacy is not the thing being sold.", "quote": "and intimacy isn't the thing that's being sold", "start": 5804.81, "end": 5807.81, "category": "Economics", "section": "Intro", "id": 365, "llm_start": 5804.8, "llm_end": 5807.8, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The claim overgeneralizes: multiple sources document paid intimacy services outside sex work, including professional cuddling and non-sexual physical intimacy [2], commercial services offering conversation, cuddling, dating practice, and social accompaniment [4], and markets from professional cuddling to commercialized dating that commodify intimate life [7]. So intimacy itself is sold in some other careers/industries, even if not in most.", "sources": [{"title": "Decoupling touch from sex: gender (ed) representations of ... - Frontiers", "url": "https://www.frontiersin.org/journals/sociology/articles/10.3389/fsoc.2023.998037/full"}, {"title": "Understanding the Complexity of Commercial Intimacy Services", "url": "https://thesemajmindspa.com/2026/09/17/sex-for-sale-cultural-universal-or-essential-service/"}, {"title": "Commodification of Intimacy and Sexuality - Wiley Online Library", "url": "https://onlinelibrary.wiley.com/doi/10.1002/9781119315049.ch14"}], "t": 5804, "clip": "clips/claim_365_5802810_5809810.mp4"}, {"claim": "In sex work, sex is the thing being sold.", "quote": "sex is the thing being sold", "start": 5818.55, "end": 5820.05, "category": "Economics", "section": "Intro", "id": 366, "llm_start": 5817.1, "llm_end": 5820.1, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Definitions of sex work describe it as the exchange of sexual services, performances, or sex acts for money or material compensation, so the claim is broadly accurate as a shorthand. However, it is somewhat oversimplified because sex work can include indirect sexual services, performances, or content rather than literal sex acts in every case.", "sources": [{"title": "Sex work - Wikipedia", "url": "https://en.wikipedia.org/wiki/Sex_work"}, {"title": "Sex Work: Meaning, Consent, Rights, and Safety", "url": "https://sexopedia.co/sex-work/"}, {"title": "SEX WORK Definition & Meaning - Merriam-Webster", "url": "https://www.merriam-webster.com/dictionary/sex+work"}, {"title": "Sex Work Overview - National Harm Reduction Coalition", "url": "https://harmreduction.org/issues/sex-work/overview/"}, {"title": "PDF HIV and sex work Human rights fact sheet series 2024 - UNAIDS", "url": "https://www.unaids.org/sites/default/files/media_asset/05-hiv-human-rights-factsheet-sex-work_en.pdf"}], "t": 5818, "clip": "clips/claim_366_5816550_5822050.mp4"}, {"claim": "In sex work, a person's worth is based on outward appearance rather than who they are as a person or their skills.", "quote": "the worth itself is inherently based off of your outward appearance, right? It's not based off of who you are as a person, how good you cook, anything like that.", "start": 5839.04, "end": 5847.37, "category": "Other", "section": "Intro", "id": 367, "llm_start": 5840.1, "llm_end": 5847.4, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The absolute claim overgeneralizes. Source 2 supports that in commercial sexual exploitation survivors’ value and price are often tied to appearance, but source 1 finds sex workers report diverse appearance/body-size norms and positive body image, while sources 3 and 8 stress that sex work is a heterogeneous spectrum. Appearance can matter in sex work, but saying worth is inherently based on looks rather than personhood or skills is misleading as a blanket statement.", "sources": [{"title": "\"I Cannot Think of Something More Complimentary\": Body Image Among Sex ...", "url": "https://link.springer.com/article/10.1007/s12119-025-10419-z"}, {"title": "Your Worth Is Not Determined By Your Appearance — Organization for ...", "url": "https://www.seattleops.org/lets-talk-about/self-worth-as-a-survivor-of-cse"}, {"title": "Sex Work in Social, Legal, and Health Perspectives", "url": "https://link.springer.com/article/10.1007/s12119-026-10536-3"}, {"title": "Understanding the Diversity of People in Sex Work: Views from ... - MDPI", "url": "https://www.mdpi.com/2076-0760/12/3/191"}], "t": 5839, "clip": "clips/claim_367_5837040_5849370.mp4"}, {"claim": "In sex work, women are graded based on their appearance.", "quote": "we are literally grading women off of their appearance", "start": 5848.77, "end": 5851.09, "category": "Other", "section": "Intro", "id": 368, "llm_start": 5848.8, "llm_end": 5851.1, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Academic research on sex workers in Ecuador and Mexico finds that higher attractiveness is associated with 10–15% higher earnings, supporting the idea that appearance affects how sex workers are valued economically. However, the sources do not show a universal or formal “grading” system, and one qualitative study notes diverse appearance and body-size norms within sex-work subcultures. The claim is therefore broadly supported as a generalization, but not as an absolute rule.", "sources": [{"title": "The Prostitute’s Allure: The Return to Beauty in Commercial ...", "url": "https://gspp.berkeley.edu/research-and-impact/publications/the-prostitutes-allure-the-return-to-beauty-in-commercial-sex-work"}, {"title": "\"I Cannot Think of Something More Complimentary\": Body Image Among Sex ...", "url": "https://link.springer.com/article/10.1007/s12119-025-10419-z"}], "t": 5848, "clip": "clips/claim_368_5846770_5853090.mp4"}, {"claim": "People in cooking, painting, or athletics are not judged solely on their appearance.", "quote": "if I'm doing cooking or painting or being an athlete, I'm not being judged singularly on my appearance", "start": 5903.02, "end": 5907.81, "category": "Other", "section": "Intro", "id": 369, "llm_start": 5902.8, "llm_end": 5907.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Cooking competitions use standardized criteria such as taste, execution, presentation, technical skill, and hygiene, so they are not scored solely on a person’s appearance [2][4]. Sports performance judgments are studied as performance evaluations subject to bias, not as appearance-only assessments [9][16], and painting is generally judged by the artwork. Appearance can still influence impressions and evaluations [12][14], but the claim only says it is not the sole basis, which is broadly accurate.", "sources": [{"title": "Worldchefs Judging Standards Overview", "url": "https://parkcityculinaryinstitute.com/blog/worldchefs-judging-standards-overview/"}, {"title": "Judging by the EAT Methodology - UCBJ - Upper Cumberland Business Journal", "url": "https://www.ucbjournal.com/judging-by-the-eat-methodology/"}, {"title": "Sports Performance Judgments - An Update From a Social Cognitive ...", "url": "https://www.sciencedirect.com/science/article/pii/S2667239123000023"}, {"title": "Appearance and Social Inequalities: Physical Attractiveness as a Part ...", "url": "https://journals.sagepub.com/doi/10.1177/00380385241249038"}, {"title": "The Halo Effect: How Beauty Bias Shapes Our Judgments", "url": "https://humans.sciencearray.com/halo-effect-beauty-bias-shapes-judgments"}, {"title": "Performance Evaluation: Subjectivity, Bias and Judgment Style in Sport", "url": "https://www.researchgate.net/publication/341217736_Performance_Evaluation_Subjectivity_Bias_and_Judgment_Style_in_Sport"}], "t": 5903, "clip": "clips/claim_369_5901020_5909810.mp4"}, {"claim": "Women have been the ones who created boundaries in relationships with men.", "quote": "women have really been the ones who created the boundaries in relationships with men", "start": 5979.26, "end": 5984.55, "category": "Other", "section": "Intro", "id": 370, "llm_start": 5978.4, "llm_end": 5984.6, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The claim is a broad historical/gender generalization, and none of the provided sources directly substantiate that women as a group created relationship boundaries with men. One source notes that boundary-setting varies more by individual and attachment style than by sex [2], while historical scholarship on separate spheres describes boundaries expected to be observed by women rather than created by them [4]. The evidence is therefore insufficient to confirm the statement.", "sources": [{"title": "The Psychology of Healthy Boundaries in Relationships", "url": "https://menwomenpsychology.com/insights/the-psychology-of-healthy-boundaries-in-relationships/"}, {"title": "Separate Spheres, Female Worlds, Woman's Place: The Rhetoric of Women's ...", "url": "https://www.jstor.org/stable/1889653"}], "t": 5979, "clip": "clips/claim_370_5977260_5986550.mp4"}, {"claim": "Women have forced men to consider women's needs.", "quote": "forced them to consider women's needs", "start": 5985.83, "end": 5988.4, "category": "Other", "section": "Intro", "id": 371, "llm_start": 5984.6, "llm_end": 5988.8, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The claim is a broad historical/causal generalization about women collectively forcing men to consider their needs, and the provided sources do not directly test or document that. The sources discuss gender inequality, male entitlement, sexual coercion, and men’s attitudes toward gender equality, but none establishes the specific causal claim. This is therefore insufficiently supported and partly reads as an opinion rather than a discrete factual assertion.", "sources": [{"title": "Why Men Oppress Women - Psychology Today", "url": "https://www.psychologytoday.com/us/blog/out-of-the-darkness/201208/why-men-oppress-women"}, {"title": "Men's Support for Gender Equality in the Era of the Stalled Revolution", "url": "https://academiccommons.columbia.edu/doi/10.7916/k7hn-mr72"}, {"title": "Twenty years of gender equality research: A scoping review based on a ...", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC8454943/"}, {"title": "Feminist or Paternalistic: Understanding Men's Motivations to Confront ...", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6978718/"}], "t": 5985, "clip": "clips/claim_371_5983830_5990400.mp4"}, {"claim": "Women setting boundaries helps men grow in character and compete with other men.", "quote": "that helps men to grow in character and to go out in the world and compete with other men", "start": 6005.47, "end": 6010.07, "category": "Other", "section": "Intro", "id": 372, "llm_start": 6005.2, "llm_end": 6010.1, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The sources discuss healthy boundaries as generally supporting relationships, autonomy, and well-being [1][2], and one discusses boundaries and character growth for men [11]. None establishes the specific causal claim that women setting boundaries helps men grow in character and compete with other men. This is a broad psychological/social generalization with insufficient evidence in the provided sources.", "sources": [{"title": "The Psychology of Healthy Boundaries | Men Women Psychology", "url": "https://menwomenpsychology.com/topics/boundaries/"}, {"title": "The Psychology of Healthy Boundaries in Love - Men Women Psychology", "url": "https://menwomenpsychology.com/insights/the-psychology-of-healthy-boundaries-in-relationships/"}, {"title": "Character Growth for Men with Boundaries - by Dr. Paul", "url": "https://menspsychology.substack.com/p/character-growth-for-men-with-boundaries"}], "t": 6005, "clip": "clips/claim_372_6003470_6012070.mp4"}, {"claim": "During the period leading up to sexual activity, the body has adrenaline and the heart is pumping.", "quote": "there's adrenaline, there's excitement, your heart's pumping", "start": 6026.63, "end": 6029.29, "category": "Health", "section": "Intro", "id": 373, "llm_start": 6025.1, "llm_end": 6030.6, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The claim is broadly accurate: sexual anticipation and arousal activate sympathetic responses that raise heart rate and blood pressure [1][5], and studies of sexual arousal have measured plasma adrenaline [2][16]. The statement that “your heart’s pumping” is basic physiology, and the general role of adrenaline/excitement during anticipation is supported.", "sources": [{"title": "Heart Rate During Sex: What Happens to Your Heart?", "url": "https://www.thesexxeducation.com/sex-the-body/heart-rate-during-sex"}, {"title": "Neuroendocrine and Cardiovascular Response to Sexual Arousal and Orgasm ...", "url": "https://www.sciencedirect.com/science/article/pii/S0306453098000079"}, {"title": "Sexual anticipation: the physiological changes that increase heart rate ...", "url": "https://zeroopposite.com/en/sexual-anticipation-the-physiological-changes-that-increase-heart-rate-and-adapt-to-prepare-for-sex-184306"}, {"title": "Neuroendocrine response to film-induced sexual arousal in men and women", "url": "https://www.sciencedirect.com/science/article/abs/pii/S0306453099000499"}], "t": 6026, "clip": "clips/claim_373_6024630_6031290.mp4"}, {"claim": "After orgasm, the body's restorative response kicks in.", "quote": "on the other side of that, your restoration part of your body kicks in", "start": 6034.4, "end": 6037.95, "category": "Health", "section": "Intro", "id": 374, "llm_start": 6034.2, "llm_end": 6037.9, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Sources describe a post-orgasm “resolution phase” in which the body returns to its resting state and recuperates, including relaxing after the physical exertion of orgasm. This supports the claim that a restorative response begins after orgasm, though the wording is informal rather than a precise medical term.", "sources": [{"title": "Life after orgasm: What happens to the body and mind after reaching ...", "url": "https://english.elpais.com/lifestyle/2024-04-30/life-after-orgasm-what-happens-to-the-body-and-mind-after-reaching-climax.html"}, {"title": "After orgasm - Scarleteen", "url": "https://www.scarleteen.com/read/sex-sexuality/after-orgasm"}], "t": 6034, "clip": "clips/claim_374_6032400_6039950.mp4"}, {"claim": "The body's restorative response is the calming, relaxing, and healing part of the body.", "quote": "that's the calming, relaxing and healing part of your body kicks in", "start": 6038.51, "end": 6042.43, "category": "Health", "section": "Intro", "id": 375, "llm_start": 6037.9, "llm_end": 6042.4, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The parasympathetic nervous system is medically described as promoting “rest and digest,” relaxing the body after stress, conserving energy, and restoring homeostasis. Cleveland Clinic notes it relaxes or reduces body activities and helps return systems to baseline. “Healing” is an informal, broad term rather than a precise physiological description, so the claim is mostly true but not exact.", "sources": [{"title": "Parasympathetic nervous system - Wikipedia", "url": "https://en.wikipedia.org/wiki/Parasympathetic_nervous_system"}, {"title": "Parasympathetic Nervous System (PSNS): What It Is & Function", "url": "https://my.clevelandclinic.org/health/body/23266-parasympathetic-nervous-system-psns"}, {"title": "Neuroanatomy, Parasympathetic Nervous System - PubMed", "url": "https://pubmed.ncbi.nlm.nih.gov/31985934/"}], "t": 6038, "clip": "clips/claim_375_6036510_6044430.mp4"}, {"claim": "Skin-to-skin contact is part of the human physiological need to be close to somebody.", "quote": "it's a part of the human physiological need is to be close to somebody", "start": 6048.63, "end": 6053.71, "category": "Health", "section": "Intro", "id": 376, "llm_start": 6047.4, "llm_end": 6053.7, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The sources support the broader idea that physical contact and closeness have biological/physiological effects: skin-to-skin contact regulates stress and oxytocin/cortisol responses, and close maternal contact is described as evolutionarily important. However, the exact phrasing that skin-to-skin contact is part of a general 'human physiological need to be close to somebody' is broader than what the sources directly establish.", "sources": [{"title": "Parent-Infant Skin-to-Skin Contact and Stress Regulation: A Systematic ...", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC8124223/"}, {"title": "How Physical Contact Affects the Brain, Stress, and Emotional Recovery", "url": "https://www.thebrf.org/how-physical-contact-affects-the-brain-stress-and-emotional-recovery/"}, {"title": "Early skin-to-skin contact for mothers and their healthy newborn ...", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3979156/"}, {"title": "Frontiers | Oxytocin release patterns and effects, with a focus on ...", "url": "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.1771799/full"}], "t": 6048, "clip": "clips/claim_376_6046630_6055710.mp4"}, {"claim": "Skin-to-skin contact with a partner causes the body to heal itself, restore itself, and release oxytocin.", "quote": "you're in skint to skin contact with your partner, your body is healing itself, it's restoring, it's releasing oxytocin", "start": 6055.21, "end": 6060.66, "category": "Health", "section": "Intro", "id": 377, "llm_start": 6055.0, "llm_end": 6062.6, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The sources support that skin-to-skin contact can stimulate oxytocin release and help regulate stress, mainly in parent-infant contexts, and oxytocin is linked to touch and close physical contact [1,3,6,8]. However, the claim overstates this by saying contact with a partner causes the body to 'heal itself' and 'restore itself'; the cited evidence does not establish such broad healing or restorative effects for adult partners.", "sources": [{"title": "Oxytocin and early parent-infant interactions: A systematic review", "url": "https://www.sciencedirect.com/science/article/pii/S2352013219303229"}, {"title": "Parent-Infant Skin-to-Skin Contact and Stress Regulation: A Systematic ...", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC8124223/"}, {"title": "Mother-Infant Skin-to-Skin Contact: Short‐ and Long ... - Frontiers", "url": "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2020.01921/full"}, {"title": "Oxytocin release patterns and effects, with a focus on ... - Frontiers", "url": "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.1771799/full"}], "t": 6055, "clip": "clips/claim_377_6053210_6062660.mp4"}, {"claim": "Oxytocin helps a person sleep better.", "quote": "oxytocin, which helps you to sleep better", "start": 6060.33, "end": 6062.63, "category": "Health", "section": "Intro", "id": 378, "llm_start": 6059.7, "llm_end": 6062.6, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Evidence supports a link: oxytocin can reduce stress and cortisol, interact with sleep-related systems, and some reviews suggest oxytocin-based interventions may improve sleep quality, especially in couples [1][4][7]. However, systematic-review evidence notes that research on oxytocin and sleep-wake behavior is still limited and early [2], so the claim is broadly supported but not a settled universal effect.", "sources": [{"title": "Oxytocin and Sleep: The Hormone's Role in Rest and Bonding", "url": "https://neurolaunch.com/oxytocin-sleep/"}, {"title": "The influence of oxytocin-based interventions on sleep-wake and sleep ...", "url": "https://www.sciencedirect.com/science/article/pii/S0149763421004589"}, {"title": "A narrative review on oxytocin at the intersection of sleep, stress ...", "url": "https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2026.1745281/full"}, {"title": "A bench-to-bedside narrative review of the sleep-social-oxytocin nexus ...", "url": "https://www.sciencedirect.com/science/article/pii/S1087079225000309"}], "t": 6060, "clip": "clips/claim_378_6058330_6064630.mp4"}, {"claim": "Oxytocin lowers the risk of cardiovascular disease.", "quote": "It lowers the risk of cardiovascular disease.", "start": 6062.67, "end": 6065.75, "category": "Health", "section": "Intro", "id": 379, "llm_start": 6062.7, "llm_end": 6065.8, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The cited literature describes oxytocin as having cardioprotective effects in experimental models and as a potential therapeutic strategy to mitigate cardiovascular risk, not as an established factor that lowers cardiovascular disease risk in people. Source [2] frames it as “potential,” while [1] and [3] discuss mechanisms of cardioprotection and possible treatment of cardiovascular pathologies. Source [4] explicitly calls it a hypothesis. The claim overstates the evidence by presenting a potential, largely preclinical effect as a confirmed risk reduction.", "sources": [{"title": "The Role of Oxytocin in Cardiovascular Protection - PMC", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC7477297/"}, {"title": "Oxytocin: Potential to mitigate cardiovascular risk - ScienceDirect", "url": "https://www.sciencedirect.com/science/article/pii/S0196978119300610"}, {"title": "The Role of Oxytocin in Cardiovascular Protection - Frontiers", "url": "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2020.02139/full"}, {"title": "Oxytocin may have a therapeutical potential against cardiovascular ...", "url": "https://www.sciencedirect.com/science/article/pii/S0306987719312575"}], "t": 6062, "clip": "clips/claim_379_6060670_6067750.mp4"}, {"claim": "Pornography does not give women the physiological benefits that come with sexual contact or orgasm.", "quote": "in pornography, it doesn't give women any of those benefits", "start": 6068.92, "end": 6072.75, "category": "Health", "section": "Intro", "id": 380, "llm_start": 6068.5, "llm_end": 6072.8, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The blanket claim that pornography gives women “none” of the benefits associated with sexual contact or orgasm is overstated. Research links women’s pornography consumption to increased arousal, better sexual functioning, and more frequent or easier orgasms, though viewing porn alone is not equivalent to sexual contact or orgasm.", "sources": [{"title": "Pornography has been linked to easier, better orgasms in women", "url": "https://bigthink.com/neuropsych/benefits-of-porn-female-orgasm/"}, {"title": "Relationship Between Sexual Function and Pornography ... - Springer", "url": "https://link.springer.com/article/10.1007/s11930-025-00407-7"}, {"title": "Pornography—Is It Good for Sexual Health? A Systematic Review", "url": "https://journals.sagepub.com/doi/pdf/10.1177/26318318221088949"}], "t": 6068, "clip": "clips/claim_380_6066920_6074750.mp4"}, {"claim": "The average man does less housework while in a relationship than he did when single.", "quote": "The average man does less housework in a relationship than when he was single.", "start": 6142.91, "end": 6146.51, "category": "Statistics", "section": "Intro", "id": 381, "llm_start": 6142.9, "llm_end": 6146.5, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "Source 2 reports that married men do about the same amount of housework as single men, not less, which directly contradicts the claim. Source 5 only says married men do less housework than live-in boyfriends; it does not establish that men do less housework than when single.", "sources": [{"title": "Men think they're doing their share of housework. They're not.", "url": "https://theweek.com/culture-life/men-women-housework-unequal"}, {"title": "Married Men Really Do Do Less Housework Than Live-in Boyfriends", "url": "https://www.sciencedaily.com/releases/2007/08/070827174300.htm"}], "t": 6142, "clip": "clips/claim_381_6140910_6148510.mp4"}, {"claim": "A husband watches pornography 70% of the time.", "quote": "with a man who's 70% of the time when he's your husband is watching pornography.", "start": 6149.47, "end": 6153.39, "category": "Statistics", "section": "Intro", "id": 382, "llm_start": 6149.5, "llm_end": 6153.4, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The 70% figure is not evidence that a husband watches pornography “70% of the time.” The Wheatley survey reports that about three-quarters of married men report some current pornography use, but only about one-third report frequent weekly or daily use, so the statement conflates prevalence with time spent or frequency.", "sources": [{"title": "National Couples and Pornography Survey 2021 - Wheatley Institute", "url": "https://wheatley.byu.edu/national-couples-and-pornography-survey-2021"}, {"title": "Porn Gap: Difference in Men and Women Pornography Patterns", "url": "https://wheatley.byu.edu/family/porn-gap-difference-in-men-and-women-pornography-patterns"}], "t": 6149, "clip": "clips/claim_382_6147470_6155390.mp4"}, {"claim": "Wives consider it cheating 50% of the time when their husband watches pornography.", "quote": "Even though 50% of the time, wives consider it cheating.", "start": 6153.39, "end": 6155.87, "category": "Statistics", "section": "Intro", "id": 383, "llm_start": 6153.4, "llm_end": 6155.9, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The exact claim that 50% of wives consider a husband’s pornography viewing to be cheating is not supported by the sources. Source [12] reports that nearly one-third of engaged and married women consider porn a form of marital infidelity, while source [2] gives a broader, differently framed statistic—54% of Americans and 67% of women consider undisclosed porn use cheating. The claim appears to conflate disapproval of pornography or undisclosed use with wives calling all husband pornography viewing cheating.", "sources": [{"title": "Is watching porn cheating in a relationship? What science says about ...", "url": "https://quitumapp.com/en/blog/couples/is-watching-porn-cheating-in-a-relationship-what-science-says-about-digital-infi"}, {"title": "The Truth Hurts Less: Pornography Use Disclosure vs. Deception", "url": "https://ifstudies.org/blog/the-truth-hurts-less-pornography-use-disclosure-vs-deception"}], "t": 6153, "clip": "clips/claim_383_6151390_6157870.mp4"}, {"claim": "A man sexually fantasizes about another woman 98% of the time in a two-month period.", "quote": "who 98% of the time is sexually fantasized around another woman in the past two months.", "start": 6157.71, "end": 6161.15, "category": "Statistics", "section": "Intro", "id": 384, "llm_start": 6157.7, "llm_end": 6161.1, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The 98% figure refers to the percentage of men who reported having at least one sexual fantasy about someone other than their partner during a two-month period, not the percentage of time they fantasized about another woman. The same research found that among men, about 54% of fantasies involved someone other than their partner, versus 46% involving their partner. Thus the claim misstates the statistic.", "sources": [{"title": "Sex Question Friday: Is It Normal To Fantasize About Someone Other Than ...", "url": "https://www.sexandpsychology.com/blog/2013/11/15/sex-question-friday-is-it-normal-to-fantasize-about-someone-other-than-your-partner/"}, {"title": "Fantasies of Other Lovers? Relax, Almost Everyone Has Them", "url": "https://www.psychologytoday.com/us/blog/all-about-sex/201708/fantasies-other-lovers-relax-almost-everyone-has-them"}, {"title": "Sexual fantasies about one's partner versus someone else: Gender ...", "url": "https://psycnet.apa.org/record/2001-01128-005"}, {"title": "Sexual Fantasies about One's Partner versus Someone Else ... - JSTOR", "url": "https://www.jstor.org/stable/3813261"}], "t": 6157, "clip": "clips/claim_384_6155710_6163150.mp4"}, {"claim": "Divorce is statistically likely to be caused by adultery, emotional abuse, or emotional neglect.", "quote": "with a man who you're statistically likely going to divorce because of either adultery, emotional abuse, or some sort of emotional neglect when you voice a problem.", "start": 6166.59, "end": 6173.55, "category": "Statistics", "section": "Intro", "id": 385, "llm_start": 6166.6, "llm_end": 6173.6, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The sources show adultery/infidelity and emotional abuse are cited in divorce, but they do not establish that divorce is generally “statistically likely” to be caused by adultery, emotional abuse, or emotional neglect. Infidelity is often listed as a major factor, but estimates for it being the primary cause are much lower (roughly 20–25% in some sources), while emotional abuse is cited at lower rates and emotional neglect is not clearly quantified. Divorce is usually multi-causal, with communication, conflict, finances, and commitment also ranking as major factors.", "sources": [{"title": "Causes For Divorce Statistics | Fact-Checked 2026", "url": "https://worldmetrics.org/causes-for-divorce-statistics/"}, {"title": "Main Reasons For Divorce Statistics 2026 - worldmetrics.org", "url": "https://worldmetrics.org/main-reasons-for-divorce-statistics/"}, {"title": "Causes For Divorce Statistics | Fact-Checked 2026", "url": "https://wifitalents.com/causes-for-divorce-statistics/"}, {"title": "Divorce Causes Statistics | 2026 Edition - Axiobench", "url": "https://axiobench.com/divorce-causes-statistics/"}, {"title": "90+ Reasons For Divorce Statistics (2026 Report) - zipdo.co", "url": "https://zipdo.co/reasons-for-divorce-statistics/"}], "t": 6166, "clip": "clips/claim_385_6164590_6175550.mp4"}, {"claim": "A man will physically abuse, stalk, or destroy something important to his partner 34% of the time.", "quote": "who 34% of the time is either gonna physically abuse you, stalk you, or destroy something important to you.", "start": 6179.79, "end": 6184.59, "category": "Statistics", "section": "Intro", "id": 386, "llm_start": 6179.8, "llm_end": 6184.6, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The 34% figure comes from CDC survey data showing that about 34% of U.S. women have experienced contact sexual violence, physical violence, and/or stalking by an intimate partner during their lifetime [10][11]; the MSD Manual similarly reports more than 34% of women experience stalking, physical violence, and/or sexual violence by an intimate partner [2]. It is not a 34% “per time” or per-man probability, and the claim omits sexual violence while adding property destruction, so it distorts the statistic.", "sources": [{"title": "Intimate Partner Violence - Special Subjects - MSD Manual ...", "url": "https://www.msdmanuals.com/home/special-subjects/intimate-partner-violence-and-sexual-assault/intimate-partner-violence"}, {"title": "CDC Releases the National Intimate Partner and Sexual violence Survey ...", "url": "https://www.safestates.org/news/722022/CDC-Releases-the-National-Intimate-Partner-and-Sexual-violence-Survey.htm"}, {"title": "CDC Releases the National Intimate Partner and Sexual violence Survey ...", "url": "https://www.safestates.org/news/news.asp?id=722022"}], "t": 6179, "clip": "clips/claim_386_6177790_6186590.mp4"}, {"claim": "Sex done for money is not necessarily trafficking.", "quote": "And oftentimes, sex done for money is not necessarily trafficking either.", "start": 6193.91, "end": 6198.03, "category": "Other", "section": "Intro", "id": 387, "llm_start": 6193.9, "llm_end": 6198.0, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Multiple independent sources distinguish consensual sex work—the exchange of sexual services for money or goods—from human trafficking, which involves force, fraud, coercion, or exploitation. Source [1] states sex work refers to voluntary transactions and does not refer to trafficking or coerced transactions, while [2], [3], [5], [7], and [8] similarly explain that sex for money is not inherently trafficking. The claim’s “not necessarily” wording is accurate because trafficking can also involve commercial sexual exploitation, but payment alone does not establish trafficking.", "sources": [{"title": "Sex work - Wikipedia", "url": "https://en.wikipedia.org/wiki/Sex_work"}, {"title": "Sex Work and Trafficking: How They Are Different and Why It Matters", "url": "https://humantraffickingsearch.org/resource/sex-work-and-trafficking-how-they-are-different-and-why-it-matters/"}, {"title": "PDF Issue brief: sex work vs trafficking - Yale Law School", "url": "https://law.yale.edu/sites/default/files/area/center/ghjp/documents/issue_brief_sex_work_vs_trafficking_v2.pdf"}, {"title": "Sex Work and Sex Trafficking, and Why the Differences Matter", "url": "https://ourbodiesourselves.org/where-we-stand/where-we-stand-sex-work-and-sex-trafficking-and-why-the-differences-matter"}, {"title": "Sex Workers Are Not Victims of Trafficking and Exploitation — Woodhull ...", "url": "https://www.woodhullfoundation.org/fact-checked/sex-workers-are-exploited-and-victims-of-trafficking/"}, {"title": "Factsheet: Sex Work Versus 'Sex Trafficking' and Understanding the ...", "url": "https://cmiconsortium.org/publications/factsheet-sex-work-versus-sex-trafficking-and-understanding-the-difference/"}], "t": 6193, "clip": "clips/claim_387_6191910_6200030.mp4"}, {"claim": "The average relationship will end in divorce because of the woman.", "quote": "when the average relationship will end in divorce because of her.", "start": 6202.34, "end": 6206.07, "category": "Statistics", "section": "Intro", "id": 388, "llm_start": 6201.6, "llm_end": 6206.1, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The claim overstates divorce statistics: only about 40–45% of marriages are projected to end in divorce, and most unmarried relationships do not end in divorce at all. While data indicate women initiate divorce more often, initiation is not the same as proving the divorce is “because of the woman,” and the sources do not support that causal generalization.", "sources": [{"title": "Breakup Statistics 2026: When, Why, and How Couples Split", "url": "https://www.connectedcouples.app/blog/breakup-statistics"}, {"title": "60+ Relationship Breakup Statistics: 2026 Verified Report - GITNUX", "url": "https://gitnux.org/relationship-breakup-statistics/"}, {"title": "Who Initiates Divorce: Men or Women? 2026 Statistics & Top Causes", "url": "https://iusw.org/who-initiates-divorce-statistics/"}], "t": 6202, "clip": "clips/claim_388_6200340_6208070.mp4"}, {"claim": "Women are the ones who file for divorce.", "quote": "She's gonna be filing for divorce.", "start": 6206.07, "end": 6207.75, "category": "Statistics", "section": "Intro", "id": 389, "llm_start": 6206.1, "llm_end": 6207.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Multiple sources indicate women initiate or file for divorce more often than men, with a commonly cited U.S. figure of about 69%. However, this is a majority pattern rather than an absolute rule, and one source notes the estimate has methodological limits and that the female share may be falling in court-record data. Thus the general claim is supported but overstated if taken literally as 'women are the ones' in every case.", "sources": [{"title": "Divorce Initiation Statistics (2026): Latest Research", "url": "https://worldmetrics.org/divorce-initiation-statistics/"}, {"title": "Women More Likely Than Men to Initiate Divorces, But Not Non-Marital ...", "url": "https://www.asanet.org/women-more-likely-men-initiate-divorces-not-non-marital-breakups/"}, {"title": "Exploring the Gender Disparity in Divorce Rates: A Statistical Analysi", "url": "https://erinschaden.com/blogs/divorce-separation/exploring-the-gender-disparity-in-divorce-rates-a-statistical-analysis"}, {"title": "Who Initiates Divorce? 69%, and the Share Is Falling", "url": "https://marriagescience.com/who-initiates-divorce/"}], "t": 6206, "clip": "clips/claim_389_6204070_6209750.mp4"}, {"claim": "Two-thirds of the time, divorce involves the husband cuckolding his wife with women he sees online.", "quote": "It will, two thirds of the time, involve him cuckolding her with women he sees online.", "start": 6207.79, "end": 6212.71, "category": "Statistics", "section": "Intro", "id": 390, "llm_start": 6207.8, "llm_end": 6212.7, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "No source supports the claim that two-thirds of divorces involve a husband cuckolding his wife with women he meets online. The available data instead indicate that infidelity is a factor in roughly 20%–40% of divorces, online infidelity occurs in about one-quarter of marriages, and social media appears in about 33% of divorce filings. The claim also adds a specific gendered and online-only pattern that the evidence does not establish.", "sources": [{"title": "Infidelity Statistics in 2026: What the Research Actually Shows", "url": "https://www.connectedcouples.app/blog/infidelity-statistics"}, {"title": "Digital Infidelity Report [2026] - discreetinvestigations.ca", "url": "https://discreetinvestigations.ca/research/online-infidelity-statistics/"}, {"title": "Cheating Spouse Statistics | Fact-Checked 2026", "url": "https://wifitalents.com/cheating-spouse-statistics/"}], "t": 6207, "clip": "clips/claim_390_6205790_6214710.mp4"}, {"claim": "Young boys are watching pornography at a very young age.", "quote": "like young boys who are watching pornography with a very, very young age,", "start": 6245.75, "end": 6250.35, "category": "Health", "section": "Intro", "id": 391, "llm_start": 6245.8, "llm_end": 6250.4, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Independent research indicates that pornography exposure among boys and teens is common, with average first exposure around age 12–13 and many reporting starting younger. The claim is broadly supported, though “very, very young age” is vague and somewhat imprecise.", "sources": [{"title": "What we know—and don't know—about pornography and boys and men", "url": "https://aibm.org/research/what-we-know-and-dont-know-about-pornography-and-boys-and-men/"}, {"title": "PDF Young people and pornography January 2023 - Children's Commissioner for ...", "url": "https://www.childrenscommissioner.gov.uk/wp-content/uploads/2023/02/cc-a-lot-of-it-is-actually-just-abuse-young-people-and-pornography-updated.pdf"}, {"title": "New Report Finds Most Teens Watch Online Pornography", "url": "https://www.psychologytoday.com/us/blog/raising-kind-kids/202305/new-report-finds-most-teens-watch-online-pornography"}], "t": 6245, "clip": "clips/claim_391_6243750_6252350.mp4"}, {"claim": "People emulate what is said on screen.", "quote": "because people will emulate what they say on screen.", "start": 6269.91, "end": 6272.03, "category": "Science", "section": "Intro", "id": 392, "llm_start": 6269.9, "llm_end": 6272.0, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The provided sources document unconscious mimicry of gestures, speech patterns, and attitudes in direct social interaction, but they do not specifically establish that people emulate what is said on screen. The screen-media claim is broader than the cited evidence and lacks independent confirmation here.", "sources": [{"title": "Mirroring - Wikipedia", "url": "https://en.wikipedia.org/wiki/Mirroring"}, {"title": "The Psychology of Mimicking Behavior: Why We Copy", "url": "https://neurolaunch.com/mimicking-behavior-psychology/"}, {"title": "The Science and Impact of Human Imitative Behavior", "url": "https://neurolaunch.com/imitative-behavior/"}, {"title": "Humans Unconsciously Copy Speech Patterns to Bond: The Hidden ...", "url": "https://shivanshisrivastava.com/2026/02/13/humans-unconsciously-copy-speech-patterns-to-bond-the-hidden-psychology-of-mirroring-and-social-connection/"}], "t": 6269, "clip": "clips/claim_392_6267910_6274030.mp4"}, {"claim": "The UK banned strangulation content this year.", "quote": "Because the UK ban strangulation content this year, as well as 10 other categories that they considered degrading.", "start": 6283.23, "end": 6288.75, "category": "Politics", "section": "Intro", "id": 393, "llm_start": 6283.2, "llm_end": 6288.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Sources confirm that the UK government created new offences in the Crime and Policing Act 2026 criminalising possession and publication of pornographic images depicting strangulation or suffocation, effective 6 November 2026. However, the law applies to England and Wales rather than the whole UK, and it targets pornographic images specifically, not all 'strangulation content.' The claim is therefore broadly accurate but imprecise.", "sources": [{"title": "Crime and Policing Act 2026: pornography factsheet - GOV.UK", "url": "https://www.gov.uk/government/publications/crime-and-policing-act-2026-factsheets/crime-and-policing-act-2026-pornography-factsheet"}, {"title": "Crime and Policing Act 2026: Offences relating to pornography", "url": "https://www.gov.uk/guidance/crime-and-policing-act-2026-offences-relating-to-pornography"}, {"title": "Porn showing choking or incest to be banned from early ... - BBC", "url": "https://www.bbc.co.uk/news/articles/cmpqgepejr2ro"}], "t": 6283, "clip": "clips/claim_393_6281230_6290750.mp4"}, {"claim": "OnlyFans went anti-sexual for several months.", "quote": "Only fans, yes, only fans, for instance, one, went anti-sexual for like several months.", "start": 6293.43, "end": 6298.39, "category": "Technology", "section": "Intro", "id": 394, "llm_start": 6293.4, "llm_end": 6298.4, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "OnlyFans announced a planned ban on sexually explicit content on August 19, 2021, but reversed it six days later on August 25, before the October 1 effective date. The proposed policy never took effect, so the claim that OnlyFans went anti-sexual “for like several months” is inaccurate.", "sources": [{"title": "Did OnlyFans Ban Explicit Content? The 2021 U-Turn", "url": "https://onlystack.com/blog/did-onlyfans-ban-explicit-content"}, {"title": "OnlyFans Explicit Content Ban: What Happened in 2021", "url": "https://everything-pr.com/onlyfans-explicit-content-ban"}, {"title": "OnlyFans' 2021 Explicit-Content Ban: What Happened", "url": "https://www.peepstune.com/onlyfans-2021-ban-on-sexually-explicit-content-was-reversed-before-it-took-effect/"}, {"title": "OnlyFans reverses ban on posting 'sexually explicit' content", "url": "https://www.reuters.com/business/onlyfans-reverses-ban-showing-sexually-explicit-content-2021-08-25/"}, {"title": "OnlyFans reverses decision to ban sexually explicit content after backlash", "url": "https://www.nbcnews.com/news/us-news/onlyfans-reverses-decision-ban-sexually-explicit-content-after-backlash-n1277595"}], "t": 6293, "clip": "clips/claim_394_6291430_6300390.mp4"}, {"claim": "OnlyFans prohibits knife content.", "quote": "You can't have any knife content.", "start": 6300.91, "end": 6302.27, "category": "Technology", "section": "Intro", "id": 395, "llm_start": 6300.9, "llm_end": 6302.3, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The claim is overbroad. Third-party guidelines list knives among violence/weapon themes that OnlyFans restricts ([1],[8]), and the platform bans violent or dangerous use of objects ([2]). But an official OnlyFans blog post describes a knife scene ([11]) and creator pages advertise knives/axes ([12]), so there is no support for a blanket ban on “any knife content” as opposed to violent or weapon-play content.", "sources": [{"title": "What is Banned on OnlyFans? 2026 Guidelines & Full List", "url": "https://branditscan.com/what-is-banned-on-onlyfans"}, {"title": "OnlyFans Terms of Service: What You Can and Can't Do", "url": "https://social-rise.com/blog/onlyfans-terms-of-service"}, {"title": "OnlyFans Policies: Content Rules & How to Avoid Bans", "url": "https://maho-management.com/en/blog-entry/onlyfans-policies"}, {"title": "This Is Fire Season 3 Recap", "url": "https://blog.onlyfans.com/oftvs-this-is-fire-season-three/"}, {"title": "iMeagan", "url": "https://onlyfans.com/accidentallydelicious"}], "t": 6300, "clip": "clips/claim_395_6298910_6304270.mp4"}, {"claim": "OnlyFans disallows most of the content categories that Pornhub allows.", "quote": "You can't have most of the categories that would be allowed on the hub.", "start": 6302.27, "end": 6305.19, "category": "Technology", "section": "Intro", "id": 396, "llm_start": 6302.3, "llm_end": 6305.2, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The available sources describe OnlyFans’ prohibited-content rules but do not enumerate Pornhub’s allowed categories or compare the two platforms category-by-category. Source [3] says OnlyFans permits most consensual adult content between verified adults while banning specific categories, so the claim that OnlyFans disallows “most” Pornhub-allowed categories is unsupported rather than confirmed.", "sources": [{"title": "OnlyFans Content Rules in 2026: What Is Not Allowed on the ...", "url": "https://fanchecked.com/blog/onlyfans-content-rules-what-is-not-allowed"}, {"title": "OnlyFans Policies: Content Rules & How to Avoid Bans", "url": "https://maho-management.com/en/blog-entry/onlyfans-policies"}], "t": 6302, "clip": "clips/claim_396_6300270_6307190.mp4"}, {"claim": "Content cannot be imported onto OnlyFans.", "quote": "You cannot import onto only fans.", "start": 6305.19, "end": 6307.11, "category": "Technology", "section": "Intro", "id": 397, "llm_start": 6305.2, "llm_end": 6307.1, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "OnlyFans creators can add media to the platform; source [5] provides a step-by-step guide to uploading photos, videos, and vault content. So the quoted blanket claim that “you cannot import onto OnlyFans” is inaccurate if it means content cannot be uploaded at all. A narrower claim about the lack of an automatic import/migration tool from other platforms is not established by the provided sources.", "sources": [{"title": "How to Upload Photos & Videos on OnlyFans (Fix Upload Errors)", "url": "https://www.enforcity.com/onlyfans-success/how-to-add-media-on-onlyfans-guide"}], "t": 6305, "clip": "clips/claim_397_6303190_6309110.mp4"}, {"claim": "Pornhub was highly susceptible to outside pressure.", "quote": "Well, and Pornhub was extremely liable to outside pressure.", "start": 6309.83, "end": 6312.79, "category": "Technology", "section": "Intro", "id": 398, "llm_start": 6309.8, "llm_end": 6312.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The sources document that a single New York Times exposé triggered immediate, sweeping outside pressure: Mastercard and Visa halted payment processing on Pornhub within days, followed by Discover. That Pornhub was forced to respond to this external pressure (payment processors cutting ties) supports the claim that it was highly susceptible to outside pressure, though the statement is a characterization rather than a precise factual measurement.", "sources": [{"title": "Mastercard, Visa halt payments on Pornhub over allegations of child sex ...", "url": "https://www.reuters.com/business/mastercard-visa-halt-payments-pornhub-over-allegations-child-sex-abuse-content-2020-12-11/"}, {"title": "Mastercard, Visa halt payments on sychologytoday.com/us/blog/why-bad-looks-good/201911/forced-intimacy-within-long-term-relationships"}], "t": 6581, "clip": "clips/claim_429_6579270_6586510.mp4"}, {"claim": "In the legal system, a divorced person is entitled to half of the other person's money.", "quote": "So we have a legal system where if you have, if you get divorced, you're entitled to half of the person's money.", "start": 6586.31, "end": 6592.19, "category": "Politics", "section": "Intro", "id": 430, "llm_start": 6586.3, "llm_end": 6592.2, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The statement overgeneralizes divorce law: there is no general entitlement to half of a spouse’s “money” everywhere. In the U.S., only nine community-property states generally presume a 50/50 split of marital property, while most states use equitable distribution, which is fair but not necessarily equal; separate property is generally excluded. Even in community-property states, the rule applies to marital assets, not all of the other person’s money.", "sources": [{"title": "In Divorce, Will I Really Lose Half of Everything I Own?", "url": "https://www.findlaw.com/legalblogs/law-and-life/in-divorce-will-i-really-lose-half-of-everything-i-own/"}, {"title": "Does a Spouse Always Get Half in Divorce? | Answers", "url": "https://www.arfamilylaw.com/post/does-a-spouse-always-get-half-in-a-divorce"}, {"title": "Are Assets Divided 50/50 in Divorce? - Nolo", "url": "https://www.nolo.com/legal-encyclopedia/dividing-property-during-divorce-30024.html"}, {"title": "Divorce Asset Split 2026: How Property Division Is Calculated", "url": "https://thelegalcalc.com/guides/divorce-asset-split-guide-2026"}, {"title": "Property Division in Divorce: US & Canada Laws Explained (2026)", "url": "https://divorce.law/learn/property-division/"}], "t": 6586, "clip": "clips/claim_430_6584310_6594190.mp4"}, {"claim": "A woman on OnlyFans is not legally entitled to any of a subscriber's money.", "quote": "Li <script>
const D=JSON.parse(document.getElementById('data').textContent),M=D.meta,C=D.colors;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const verdicts=Object.keys(C),active=new Set(verdicts);
const cats=[...new Set(D.items.map(i=>i.category))].sort();
const app=document.getElementById('app');
app.innerHTML=`${D.banner?`<div class="banner">${esc(D.banner)}</div>`:''}
<h1>${esc(M.title)}</h1><div class="chan">${esc(M.channel||'')} · <a href="${esc(M.webpage_url||('https://www.youtube.com/watch?v='+M.id))}" target="_blank" rel="noopener">Watch on YouTube</a>${M.duration?' · '+fmt(M.duration):''}</div>
<details class="desc"><summary>Video description</summary><pre>${esc(M.description||'(none)')}</pre></details>
<div class="summary">${verdicts.map(v=>`<div class="stat" data-v="${esc(v)}" style="border-top:4px solid ${C[v]}"><b>${D.items.filter(i=>i.verdict===v).length}</b>${esc(v)}</div>`).join('')}
<div class="stat" style="cursor:default"><b>${D.items.length}</b>Total claims</div></div>
<div class="controls"><input type="search" id="q" placeholder="Search claims, quotes, explanations…">
<select id="cat"><option value="">All categories</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
<select id="grp"><option value="cat">Group: category → section</option><option value="sec">Group: section → category</option><option value="time">Chronological</option></select></div>
<div id="list"></div><div class="foot">Verdicts are machine-generated (LLM + web search) and may be wrong. Check sources yourself.</div>`;
function media(i){
  if(i.clip)return `<video controls preload="metadata" src="${esc(i.clip)}"></video>`;
  const th=M.id?`https://i.ytimg.com/vi/${M.id}/hqdefault.jpg`:'';
  return `<div class="ph" data-t="${i.t}" style="background-image:url('${th}')"><span>▶ Play from ${fmt(i.t)}</span></div>`;
}
function card(i){
  const url=`https://www.youtube.com/watch?v=${M.id}&t=${i.t}s`;
  return `<div class="claim" style="--vc:${C[i.verdict]||'#94a3b8'}"><div>
  <span class="badge">${esc(i.verdict)}</span><a class="ts" href="${url}" target="_blank" rel="noopener">⏱ ${fmt(i.start)}–${fmt(i.end)}</a>
  <span class="ts" style="color:var(--muted)"> · ${esc(i.category)} · ${esc(i.section)}</span>
  <div class="ctext">${esc(i.claim)}</div>${i.quote?`<div class="quote">“${esc(i.quote)}”</div>`:''}
  <div>${esc(i.explanation)}</div>
  ${(i.sources||[]).length?`<ol class="src">${i.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a></li>`).join('')}</ol>`:'<div class="src" style="color:var(--muted)">No sources retrieved.</div>'}
  </div><div class="media">${media(i)}</div></div>`;
}
function group(arr,k){const m=new Map();arr.forEach(i=>{if(!m.has(i[k]))m.set(i[k],[]);m.get(i[k]).push(i)});return m}
const secOrder=t=>{const i=D.sections.findIndex(s=>s.title===t);return i<0?1e9:i};
function draw(){
  const q=document.getElementById('q').value.toLowerCase(),cat=document.getElementById('cat').value,g=document.getElementById('grp').value;
  const f=D.items.filter(i=>active.has(i.verdict)&&(!cat||i.category===cat)&&(!q||[i.claim,i.quote,i.explanation,i.section,i.category].join(' ').toLowerCase().includes(q)));
  const L=document.getElementById('list');
  if(!f.length){L.innerHTML='<div class="empty">No claims match the current filters.</div>';return}
  if(g==='time'){L.innerHTML=f.map(card).join('');return}
  const [k1,k2]=g==='cat'?['category','section']:['section','category'];
  const keys1=[...group(f,k1).entries()].sort((a,b)=>k1==='section'?secOrder(a[0])-secOrder(b[0]):a[0].localeCompare(b[0]));
  L.innerHTML=keys1.map(([a,arr])=>`<h2>${esc(a)} <span style="color:var(--muted);font-size:14px">(${arr.length})</span></h2>`+
    [...group(arr,k2).entries()].sort((x,y)=>k2==='section'?secOrder(x[0])-secOrder(y[0]):x[0].localeCompare(y[0]))
    .map(([b,arr2])=>`<h3>${esc(b)}</h3>`+arr2.map(card).join('')).join('')).join('');
}
document.querySelectorAll('.stat[data-v]').forEach(el=>el.onclick=()=>{const v=el.dataset.v;active.has(v)?active.delete(v):active.add(v);el.classList.toggle('off');draw()});
['q','cat','grp'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
document.getElementById('list').addEventListener('click',e=>{const p=e.target.closest('.ph');if(!p)return;
  p.outerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${M.id}?start=${p.dataset.t}&autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`});
draw();
</script></body></html>
