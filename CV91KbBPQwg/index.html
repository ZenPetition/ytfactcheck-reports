.org/wiki/Objectification"}, {"title": "Feminist Perspectives on Objectification (Stanford ...", "url": "https://plato.stanford.edu/entries/feminism-objectification/"}, {"title": "Degrade vs. Objectify - What's the Difference? | This vs. That", "url": "https://thisvsthat.io/degrade-vs-objectify"}], "t": 2577, "clip": "clips/claim_189_2575400_2586180.mp4"}, {"claim": "Women have opposed pornography and pushed against it for decades.", "quote": "women have been opposed to pornography for decades and have been pushing against it", "start": 2660.92, "end": 2665.7, "category": "History", "section": "Intro", "id": 190, "llm_start": 2660.6, "llm_end": 2666.7, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The sources document a longstanding feminist anti-pornography movement: Women Against Pornography was influential in the late 1970s and 1980s, and feminist anti-porn activism emerged in the late 1970s. Source [1] also notes that from 1975 to 2012 the gender gap in pornography opposition widened, with more women increasingly opposed. The claim is broadly supported, though it should be read as referring to many women and organized feminist movements, not all women.", "sources": [{"title": "Opposition to pornography - Wikipedia", "url": "https://en.wikipedia.org/wiki/Opposition_to_pornography"}, {"title": "Women Against Pornography - Wikipedia", "url": "https://en.wikipedia.org/wiki/Women_Against_Pornography"}, {"title": "Anti-pornography movement in the United States — Grokipedia", "url": "https://grokipedia.com/page/Anti-pornography_movement_in_the_United_States"}], "t": 2660, "clip": "clips/claim_190_2658920_2667700.mp4"}, {"claim": "One reason women oppose pornography is that it promotes violence against women.", "quote": "a lot of the reasons that women don't like pornography because it promotes violence against women", "start": 2666.91, "end": 2672.17, "category": "Other", "section": "Intro", "id": 191, "llm_start": 2666.7, "llm_end": 2672.2 f Videos From Unverified Users", "url": "https://www.buzzfeednews.com/article/otilliasteadman/pornhub-removes-videos"}, {"title": "Pornhub Purges 80% Of User-Uploaded Videos After Allegations ...", "url": "https://www.tubefilter.com/2020/12/16/pornhub-purges-ugc-child-exploitation/"}, {"title": "Pornhub Removes 10 Million Videos in Response to ... - NY1", "url": "https://ny1.com/nyc/all-boroughs/entertainment/2020/12/15/pornhub-removes-10-million-videos-in-response-to-allegations-about-content"}, {"title": "Pornhub deletes 80% of videos after child abuse claims ...", "url": "https://metro.co.uk/2020/12/16/pornhub-deletes-80-of-videos-after-claims-site-is-infested-with-child-abuse-13759151/"}, {"title": "Pornhub Deleted Nearly 80% Of Its Videos -- Here's Why!", "url": "https://perezhilton.com/pornhub-removes-videos-unverified-content/"}], "t": 2868, "clip": "clips/claim_220_2866310_2872900.mp4"}, {"claim": "Pornhub had asphyxiation content of women being suffocated with plastic bags.", "quote": "They had asphyxiation content of women being suffocated with plastic bags", "start": 2871.11, "end": 2874.47, "category": "Other", "section": "Intro", "id": 221, "llm_start": 2871.1, "llm_end": 2874.5, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Pornhub’s own search pages show listings/headings for “plastic bag asphyxia porn” and “plastic bag breathplay,” supporting the core claim that such content existed on the platform [1][2]. However, the supplied Pornhub snippets do not independently document the specific detail that the videos depicted women being suffocated, and the explicit clip describing a woman suffocated with a plastic bag is from ThisVid, not Pornhub [3].", "sources": [{"title": "Plastic Bag Asphyxia Porn Porn Videos | Pornhub.com", "url": "https://www.pornhub.com/video/search?search=plastic+bag+asphyxia+porn"}, {"title": "Plastic Bag Breathplay Porn Videos | Pornhub.com", "url": "https://www.pornhub.com/video/search?search=plastic+bag+breathplay"}, {"title": "Breathplay/...: Woman Suffocates in Plastic Bag - ThisVid.com", "url": "https://thisvid.com/playlist/306409/video/woman-suffocates-in-plastic-bag/"}], "t": 2871, "clip": "clips/claim_221_2869110_2876470.mp4"}, {"claim": "OnlyFans has the least amount of trafficking content compared with what has been seen before.", "quote": "It has the least amount of trafficking content we've ever seen", "start": 2884.27, "end": 2887.71, "category": "Statistics", "section": "Intro", "id": 222, "llm_start": 2884.3, "llm_end": 2886.9, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "No source provides comparative data measuring the amount of trafficking content on OnlyFans versus other platforms or earlier periods, so the absolute \"least ever\" claim cannot be confirmed. Independent sources instead document OnlyFans as a significant vector for trafficking and exploitation, including trafficker-managed accounts and reported cases [1][3][5]. That evidence undermines the claim's implication but does not establish a precise comparative ranking.", "sources": [{"title": "Human Trafficking and the Dark Side to OnlyFans - i2 Group", "url": "https://i2group.com/articles/human-trafficking-and-the-dark-side-to-onlyfans"}, {"title": "Reports Show Sex Traffickers Use OnlyFans as New Business ...", "url": "https://endsexualexploitation.org/articles/reports-show-sex-traffickers-use-onlyfans-as-new-business-model-ncose-urges-investigation/"}, {"title": "“It can never be ethical”: Sexual exploitation on OnlyFans", "url": "https://www.collectiveshout.org/exploitation-on-onlyfans"}], "t": 2884, "clip": "clips/claim_222_2882270_2889710.mp4"}, {"claim": "OnlyFans has been around for 11 years.", "quote": "it's only been around for 11 years now", "start": 2888.21, "end": 2890.23, "category": "Statistics", "section": "Intro", "id": 223, "llm_start": 2887.7, "llm_end": 2890.2, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "OnlyFans was founded in November 2016 by Tim Stokely, so the available 2026 sources put its age at roughly 9–10 years, not 11. Multiple timelines describe 2016 as the launch year and refer to the period as its first decade. The quoted “11 years” is therefore off by about a year.", "sources": [{"title": "OnlyFans - Wikipedia", "url": "https://en.wikipedia.org/wiki/OnlyFans"}, {"title": "Tim Stokely - Wikipedia", "url": "https://en.wikipedia.org/wiki/Tim_Stokely"}, {"title": "OnlyFans History: From 2016 Founding to 2026", "url": "https://onlyfansstatistics.com/history"}, {"title": "Full History Of OnlyFans In Timeline From 2016 - Popular Timelines", "url": "https://populartimelines.com/timeline/OnlyFans/full"}], "t": 2888, "clip": "clips/claim_223_2886210_2892230.mp4"}, {"claim": "OnlyFans has strict identification standards.", "quote": "it has really strict standards on identification and things like that", "start": 2893.61, "end": 2897.31, "category": "Technology", "section": "Intro", "id": 224, "llm_start": 2892.8, "llm_end": 2897.3, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "OnlyFans does require creators to submit government-issued photo ID and a selfie, and its official transparency page says it has a dedicated team reviewing age and identity information. Independent guides describe the creator verification process as strict. However, the claim is overbroad because subscriber/fan verification has historically been less strict, with some sources saying fans need only a payment method unless state law requires more.", "sources": [{"title": "Age & Identity Verification — OnlyFans", "url": "https://onlyfans.com/transparency-center/verification"}, {"title": "OnlyFans Creator Requirements: Eligibility, Verification, and Rules ...", "url": "https://www.enforcity.com/onlyfans-success/onlyfans-creator-requirements"}, {"title": "OnlyFans Verification: A Data-Backed Guide for Creators and Fans", "url": "https://www.pseudoface.com/guides/platforms-account-ops/onlyfans-ops/onlyfans-verification-faq"}, {"title": "OnlyFans Age Verification: What Creators & Subscribers Need (2026 ...", "url": "https://www.onlyseeka.com/blog/onlyfans-age-verification-guide-v2"}], "t": 2893, "clip": "clips/claim_224_2891610_2899310.mp4"}, {"claim": "A lot of the sex work industry is trafficking.", "quote": "I think a lot of the sex work industry, like you pointed out, is trafficking, right?", "start": 2900.47, "end": 2903.99, "category": "Statistics", "section": "Intro", "id": 225, "llm_start": 2900.5, "llm_end": 2904.0, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The sources show that sexual exploitation and forced prostitution are major categories of trafficking, including the statistic that 79% of detected trafficking victims are exploited for sexual exploitation and that forced prostitution accounts for 21% of trafficking cases. However, they do not provide a reliable estimate of what proportion of the overall sex-work industry is trafficking, and 'a lot' is undefined. The claim is therefore too broad and insufficiently supported to verify.", "sources": [{"title": "Human Trafficking And Prostitution Statistics 2026", "url": "https://worldmetrics.org/human-trafficking-and-prostitution-statistics/"}, {"title": "Human Trafficking Prostitution: 2026 Verified Stats & Trends", "url": "https://gitnux.org/human-trafficking-prostitution-statistics/"}], "t": 2900, "clip": "clips/claim_225_2898470_2905990.mp4"}, {"claim": "Over 90% of street walkers, or women in street prostitution, report that they would leave the industry if they could.", "quote": "over 90% of street walkers, like women who do street prostitution, all report that they would leave the industry if they could", "start": 2904.4, "end": 2910.75, "category": "Statistics", "section": "Intro", "id": 226, "llm_start": 2904.0, "llm_end": 2910.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Research broadly supports a very high share of women in prostitution wanting to leave: source [4] reports 92% of women in a 1998 survey wanted to leave but lacked services, source [1] cites Ruhama saying about 90% want to exit at some point, and source [3] reports 89% had tried to leave without success. However, the sources do not specifically isolate “street walkers,” and the exact “over 90%” figure is not consistently confirmed for that subgroup.", "sources": [{"title": "Report finds 90% of sex workers want to leave trade but ...", "url": "https://www.irishexaminer.com/news/arid-30978567.html"}, {"title": "Over 90% of women in prostitution see it as their only means ...", "url": "https://www.uoc.edu/en/news/2025/study-90-percent-women-prostitution-only-option-survival"}, {"title": "Why can’t women in prostitution just leave when they want to?", "url": "https://www.womenslaw.org/about-abuse/forms-abuse/sexual-abuse-and-exploitation/forced-prostitution/leaving-prostitution/why"}], "t": 2904, "clip": "clips/claim_226_2902400_2912750.mp4"}, {"claim": "A raid of California massage parlors that sell sexual services found that over 70% of the women there were being trafficked.", "quote": "A rate of California massage parlors, which sell sexual services, found that over 70% of the women there were being trafficked.", "start": 2910.75, "end": 2916.07, "category": "Statistics", "section": "Intro", "id": 227, "llm_start": 2910.8, "llm_end": 2916.1, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "No listed source reports a California massage-parlor raid finding that over 70% of the women were trafficked; the sources only document thousands of illicit massage businesses and general trafficking risk ([1],[3],[4]). Polaris states that it is not known exactly how many women working in massage parlors are trafficked ([2]), and California has not conducted a comprehensive trafficking prevalence study ([10]). The specific raid statistic is therefore unsupported by the available evidence.", "sources": [{"title": "Human trafficking in California - Wikipedia", "url": "https://en.wikipedia.org/wiki/Human_trafficking_in_California"}, {"title": "How Can You Tell if a Massage Business is a Front for Human Trafficking?", "url": "https://fightthenewdrug.org/study-finds-9000-massage-businesses-america-actually-brothels/"}, {"title": "Human Trafficking in California: Complete Prevention Guide", "url": "https://humantraffickingfront.org/human-trafficking-in-california-complete-prevention-guide/"}, {"title": "PDF Hidden in Plain Sight - Polaris Project", "url": "https://polarisproject.org/wp-content/uploads/2018/04/How-Corporate-Secrecy-Facilitates-Human-Trafficking-in-Illicit-Massage-Parlors.pdf"}, {"title": "HUMAN TRAFFICKING PREVALENCE STUDY", "url": "https://www.lls.edu/media/loyolalawschool/academics/clinicsexperientiallearning/sji/publicationsandreports/data/Human+Trafficking+Prevalence+Study+Fact+Sheet.pdf"}], "t": 2910, "clip": "clips/claim_227_2908750_2918070.mp4"}, {"claim": "A raid of Vancouver massage parlors found that 100% of the workers there, when asked if they wanted to speak to a victim's rescue unit and told they would be safe and not punished, said yes.", "quote": "A rate of Vancouver massage parlors found that 100% of the workers there would ask if they'd like to speak to a victim's rescue unit, all when told, you'll be safe, you're not gonna be punished, this isn't a trap. All said yes, right?", "start": 2916.07, "end": 2927.19, "category": "Statistics", "section": "Intro", "id": 228, "llm_start": 2916.1, "llm_end": 2927.2, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The cited sources describe Richmond massage-parlour inspections and advocacy criticisms, but none reports a survey in which 100% of Vancouver massage-parlour workers said they wanted to speak with a victim's rescue unit under assurances of safety. Source [3] says inspections of six Richmond body-rub studios found some bylaw violations but no criminal activity. Because the specific statistic and the described question are not documented, the claim cannot be verified.", "sources": [{"title": "Raids putting Richmond massage parlour workers at risk ...", "url": "https://vancouver.citynews.ca/2024/02/09/richmond-massage-parlour-raids-sex-workers/"}, {"title": "Massage parlour inspections push sex workers underground ...Protection or police harassment? Impacts of punitive policing ...Sex Worker Safety - Vancouver Police DepartmentProtection or police harassment? Impacts of punitive policing ...", "url": "https://www.richmond-news.com/local-news/inspections-drive-richmond-sex-work-into-dangerous-locations-advocacy-group-8285853"}, {"title": "Protection or police harassment? Impacts of punitive policing ...", "url": "https://www.sciencedirect.com/science/article/pii/S2667321522000105"}], "t": 2916, "clip": "clips/claim_228_2914070_2929190.mp4"}, {"claim": "15 million women globally are being forced into marriage, including child brides.", "quote": "15 million women globally are being forced into marriage and then includes child brides", "start": 2956.09, "end": 2961.67, "category": "Statistics", "section": "Intro", "id": 229, "llm_start": 2955.3, "llm_end": 2961.7, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Global estimates commonly put about 14.9 million women and girls in forced marriages at any given time, often rounded to 15 million, and child brides can be included because child marriage is frequently a form of forced marriage. The main caveat is that this is a stock estimate of people currently in forced marriages, not 15 million new cases each year. The provided sources support the forced/child marriage overlap but do not themselves show the exact 15 million figure.", "sources": [{"title": "Understanding forced and child marriage - Walk Free", "url": "https://www.walkfree.org/global-slavery-index/findings/spotlights/understanding-forced-and-child-marriage/"}, {"title": "The Child Marriage Data Portal", "url": "https://childmarriagedata.org/"}], "t": 2956, "clip": "clips/claim_229_2954090_2963670.mp4"}, {"claim": "Two million children are being trafficked on the Ivory Coast to farm chocolate.", "quote": "two million kids are being trafficked on the Ivory Coast to farm chocolate", "start": 2983.83, "end": 2987.61, "category": "Statistics", "section": "Intro", "id": 230, "llm_start": 2983.6, "llm_end": 2987.9, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The roughly two million figure refers to children working in cocoa production across Ivory Coast and Ghana, not two million children trafficked in Ivory Coast alone. Trafficking is a real but much smaller subset: one estimate says at least 16,000 children were forced to work on West African cocoa farms by people other than their parents. Thus the claim conflates child labour with trafficking and overstates the geographic scope.", "sources": [{"title": "Exclusive: U.S. investigates child labour in Ivory Coast cocoa supply ...", "url": "https://www.reuters.com/article/world/exclusive-us-investigates-child-labour-in-ivory-coast-cocoa-supply-chains-idUSKBN21H0RT/"}, {"title": "The dark side of chocolate: child labour in the cocoa industry", "url": "https://www.humanium.org/en/the-dark-side-of-chocolate-child-labour-in-the-cocoa-industry/"}], "t": 2983, "clip": "clips/claim_230_2981830_2989610.mp4"}, {"claim": "Women over the course of history have fought hard not to be objectified without regard for their wellbeing.", "quote": "women over the course of history have fought really hard to not be objectified without regard to our wellbeing", "start": 3003.86, "end": 3011.95, "category": "History", "section": "Intro", "id": 231, "llm_start": 3003.2, "llm_end": 3011.9, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Historical accounts describe women’s rights movements as sustained, deliberate efforts to improve women’s lives and secure dignity and civil rights (2,3). Feminist scholarship also treats sexual objectification as a harm to women’s humanity and wellbeing and as a central target of feminist critique (12,13,15). The statement is a broad generalization rather than a precise empirical claim, but its core is supported.", "sources": [{"title": "Feminism and Women's Rights Movements - Gender Matters", "url": "https://www.coe.int/en/web/gender-matters/feminism-and-women-s-rights-movements"}, {"title": "History of the Women's Rights Movement", "url": "https://nationalwomenshistoryalliance.org/history-of-the-womens-rights-movement/"}, {"title": "A Feminist Investigation: Objectification and Well-being", "url": "https://ecclectica.brandonu.ca/issues/2006/1/Article-28.html"}, {"title": "Feminist Perspectives on Objectification", "url": "https://plato.stanford.edu/archives/win2016/entries/feminism-objectification/"}, {"title": "A Systematic Literature Review Exploring Objectification ...", "url": "https://www.researchgate.net/publication/343919468_A_Systematic_Literature_Review_Exploring_Objectification_and_Motherhood"}], "t": 3003, "clip": "clips/claim_231_3001860_3013950.mp4"}, {"claim": "Women fought for the right to vote.", "quote": "we fought for the right to vote", "start": 3071.22, "end": 3073.15, "category": "History", "section": "Intro", "id": 232, "llm_start": 3070.9, "llm_end": 3073.2, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The statement is historically accurate as a general claim: women suffragists organized, lectured, marched, lobbied, and engaged in civil disobedience over decades to secure voting rights. The 19th Amendment, ratified in 1920, guaranteed American women the right to vote, though the movement involved many women and also some male allies.", "sources": [{"title": "Women's suffrage in the United States - Wikipedia", "url": "https://en.wikipedia.org/wiki/Women's_suffrage_in_the_United_States"}, {"title": "Suffrage - National Archives", "url": "https://www.archives.gov/women/suffrage"}, {"title": "Woman Suffrage and the 19th Amendment | National Archives", "url": "https://www.archives.gov/education/lessons/woman-suffrage"}], "t": 3071, "clip": "clips/claim_232_3069220_3075150.mp4"}, {"claim": "Many women are fighting against female genital mutilation.", "quote": "there are a ton of women who are fighting against this female genital mutilation", "start": 3074.31, "end": 3078.43, "category": "Health", "section": "Intro", "id": 233, "llm_start": 3074.3, "llm_end": 3078.4, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Independent sources confirm that numerous women campaign against female genital mutilation, including Waris Dirie and Shamsa Araweelo. Global Citizen also describes multiple activists as “among the many fighting against” FGM and profiles additional women leading the effort. The claim is broad but well supported by these sources.", "sources": [{"title": "Waris Dirie - Wikipedia", "url": "https://en.wikipedia.org/wiki/Waris_Dirie"}, {"title": "Shamsa Araweelo - Wikipedia", "url": "https://en.wikipedia.org/wiki/Shamsa_Araweelo"}, {"title": "6 Activists to Follow to Learn More About FGM - Global Citizen", "url": "https://www.globalcitizen.org/en/content/activists-to-follow-learn-more-fgm/"}, {"title": "5 Activists Leading the Fight Against Female Genital Mutilation in Africa", "url": "https://www.globalcitizen.org/en/content/5-activists-fighting-fgm-in-africa/"}], "t": 3074, "clip": "clips/claim_233_3072310_3080430.mp4"}, {"claim": "Among people in Las Vegas who enter sex work, 45% aged out of foster care.", "quote": "the percentage of people in Las Vegas that enter into sex work, there's 45% of them aged out of foster care", "start": 3108.3, "end": 3118.71, "category": "Statistics", "section": "Intro", "id": 234, "llm_start": 3107.7, "llm_end": 3118.7, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "None of the provided sources reports that 45% of people entering sex work in Las Vegas aged out of foster care; the only 45% figure in the sources is for sex workers reporting physical violence [1]. Sources [4] and [7] support a general link between foster-care transition and trafficking vulnerability, but they do not quantify this Las Vegas-specific population. The claim is therefore unverifiable rather than confirmed.", "sources": [{"title": "2026 Las Vegas Prostitution Statistics | 120+ Verified Facts", "url": "https://wifitalents.com/las-vegas-prostitution-statistics/"}, {"title": "Foster Care Youths at Risk for Child Sex Trafficking", "url": "https://www.socialworktoday.com/news/enews_1118_1.shtml"}, {"title": "PDF Comparing Outcomes 20 Years Apart: Transitioning Out of Foster Care for ...", "url": "https://www.irp.wisc.edu/wp/wp-content/uploads/2023/06/Focus-on-Poverty-39-1d.pdf"}], "t": 3108, "clip": "clips/claim_234_3106300_3120710.mp4"}, {"claim": "Among people in Las Vegas who enter sex work, 53% entered sex work while they were homeless.", "quote": "53% of them entered sex work but while they were homeless, right?", "start": 3118.71, "end": 3124.23, "category": "Statistics", "section": "Intro", "id": 235, "llm_start": 3118.7, "llm_end": 3124.2, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The 53% figure appears in source [1], but that is a secondary statistics aggregator and the excerpt does not identify a primary Las Vegas study or official dataset behind the number. Source [6] supports a general link between youth homelessness and earlier entry into prostitution, but it does not establish the 53% prevalence. No independent or primary source confirms the exact claim, so it is unverifiable.", "sources": [{"title": "120+ Las Vegas Prostitution Statistics | 2026 Data Report", "url": "https://gitnux.org/las-vegas-prostitution-statistics/"}, {"title": "Entering Prostitution in Adolescence: History of Youth ...", "url": "https://www.researchgate.net/publication/309047017_Entering_Prostitution_in_Adolescence_History_of_Youth_Homelessness_Predicts_Earlier_Entry"}], "t": 3118, "clip": "clips/claim_235_3116710_3126230.mp4"}, {"claim": "If a man already has misogynistic preconceptions, watching sexual content of women will reinforce his beliefs.", "quote": "if a guy already has misogynistic preconceptions, yeah, watching sexual content of women is going to reinforce his beliefs", "start": 3176.03, "end": 3181.11, "category": "Science", "section": "Intro", "id": 236, "llm_start": 3176.0, "llm_end": 3181.1, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Research generally supports that exposure to sexualized or misogynistic media can strengthen sexist attitudes, especially in men: an experimental account reports that female centerfold images increased sexist beliefs [1], and a meta-analysis found misogynous media increases hostility toward women [7]. An APA release also reports that pornography viewing has a real impact on heterosexual men's views about sex roles [2]. However, the evidence is probabilistic and mixed—some research finds pornography's impact on rape-myth acceptance is limited [5]—so the absolute wording 'will reinforce' overstates certainty.", "sources": [{"title": "Studies linking porn use to \"un-egalitarian attitudes\" toward ...", "url": "https://www.yourbrainonporn.com/relevant-research-and-articles-about-the-studies/porn-use-sex-addiction-studies/studies-linking-porn-use-to-un-egalitarian-attitudes-toward-women/"}, {"title": "Age of First Exposure to Pornography Shapes Men's ...", "url": "https://www.newswise.com/articles/age-of-first-exposure-to-pornography-shapes-men-s-attitudes-toward-women"}, {"title": "Understanding Rape Myth Acceptance Through the Lens ...", "url": "https://www.researchgate.net/publication/387789545_Understanding_Rape_Myth_Acceptance_Through_the_Lens_of_Sexual_Objectification_Theory_The_Role_of_Pornography_Consumption_Purchase_of_Sexual_Services_and_Masculinity"}, {"title": "Misogynous Messages in the Media Increase Hostility to ...", "url": "https://www.researchgate.net/publication/402812250_Misogynous_messages_in_the_media_increase_hostility_to_women_Evidence_from_a_meta-analysis_of_257_experimental_and_nonexperimental_studies"}], "t": 3176, "clip": "clips/claim_236_3174030_3183110.mp4"}, {"claim": "If a man does not have misogynistic preconceptions, watching porn will not reinforce them.", "quote": "If he doesn't have that preconception, watching porn will not reinforce it.", "start": 3181.15, "end": 3184.19, "category": "Science", "section": "Intro", "id": 237, "llm_start": 3181.2, "llm_end": 3184.2, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The claim is an absolute causal assertion that is not supported by the sources. Source [4] states that boys can learn misogyny through porn, and source [3] proposes that problematic pornography use can lead to hostile attitudes toward women via dependency and resentment, rather than merely reinforcing pre-existing misogyny. Source [2] also reports associations between pornography-related measures and sexism/rape myth acceptance, so the idea that porn cannot reinforce or cultivate misogynistic attitudes absent prior preconceptions is too strong.", "sources": [{"title": "Exploring the Interplay of problematic pornography use ...", "url": "https://www.sciencedirect.com/science/article/pii/S2405844024090121"}, {"title": "On Men’s Problematic Pornography Use and Hostile Attitudes ...", "url": "https://link.springer.com/article/10.1007/s12119-025-10424-2"}, {"title": "Digital Misogyny - Psychology Today", "url": "https://www.psychologytoday.com/us/blog/love-and-sex-in-the-digital-age/202506/digital-misogyny"}], "t": 3181, "clip": "clips/claim_237_3179150_3186190.mp4"}, {"claim": "Economic collapse is the biggest global driver of sex trafficking.", "quote": "So for  "People model behaviors they see digitally in the real world.", "quote": "people model the sorts of behaviors that they see digitally in the real world.", "start": 4227.28, "end": 4230.56, "category": "Science", "section": "Intro", "id": 283, "llm_start": 4227.3, "llm_end": 4230.6, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Social learning research supports the idea that people learn and reproduce behaviors through observation, including from media and online symbolic models, especially when those behaviors appear rewarded. Studies and reviews also describe media and online activity shaping norms and offline behavior. The claim is broadly supported, though modeling is not automatic or universal and depends on attention, motivation, and context.", "sources": [{"title": "How Social Learning Theory Works - Verywell Mind", "url": "https://www.verywellmind.com/social-learning-theory-2795074"}, {"title": "Behavior Modeling: Shaping Actions Through Observation", "url": "https://neurolaunch.com/modeling-behavior/"}, {"title": "Social Learning through Media: Observational Learning and ...", "url": "https://journalism.university/media-and-communication-theories/social-learning-media-observational-beyond/"}, {"title": "9 Ways Media Shapes Norms and Behavior - Psychology Today", "url": "https://www.psychologytoday.com/us/blog/emotional-behavior-behavioral-emotions/202501/9-ways-media-shapes-norms-and-behavior"}, {"title": "Linking online activity to offline behavior: A meta-review of ...", "url": "https://www.sciencedirect.com/science/article/pii/S2667118224000138"}], "t": 4227, "clip": "clips/claim_283_4225280_4232560.mp4"}, {"claim": "Young people do not have fully developed frontal lobes.", "quote": "if they don't have that frontal lobe fully developed", "start": 4230.74, "end": 4232.32, "category": "Science", "section": "Intro", "id": 284, "llm_start": 4230.6, "llm_end": 4232.3, "match_score": 1.0, "low_match": false, "verdict": "Most s. The provided sources only give general national statistics on interracial marriage and acceptance (e.g., rising intermarriage rates), which cannot confirm or refute what specific friends' parents would do. Because the claim rests on private, self-reported personal experience, it is unverifiable rather than true or false.", "sources": [{"title": "Intermarriage - Research and data from Pew Research Center", "url": "https://www.pewresearch.org/topic/family-relationships/marriage-divorce/intermarriage/"}, {"title": "Intermarriage in the U.S. 50 Years After Loving v. VirginiaInterracial Marriage Statistics 2026: TrendsInterracial Relationships: Statistics and Data (2026)Interracial Relationship Statistics | Fact-Checked 2026Interracial Statistics | 2026 Sourced ReportGeographic Variations in Black-White Interracial Marital and ...", "url": "https://www.pewresearch.org/social-trends/2017/05/18/intermarriage-in-the-u-s-50-years-after-loving-v-virginia/"}, {"title": "Interracial Relationship Statistics | Fact-Checked 2026", "url": "https://worldmetrics.org/interracial-relationship-statistics/"}], "t": 4532, "clip": "clips/claim_310_4530520_4539520.mp4"}, {"claim": "The speaker's final Surrounded claim was that sex work is not inherently degrading to women.", "quote": "My final surrounded claim is that sex work is not inherently degrading to women.", "start": 4558.84, "end": 4563.0, "category": "Other", "section": "Intro", "id": 311, "llm_start": 4558.8, "llm_end": 4563.0, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The supplied quote directly states that the speaker's final Surrounded claim was that sex work is not inherently degrading to women, so the report of what the speaker claimed is accurate. The underlying proposition is contested in feminist debate—some argue sex work is inherently degrading or exploitative [5][8], while feminist views vary [1]—but that does not change that this was the speaker's stated claim.", "sources": [{"title": "Feminist perspectives on sex work - Wikipedia", "url": "https://en.wikipedia.org/wiki/Feminist_perspectives_on_sex_work"}, {"title": "Feminist Perspectives on Sex Work - numberanalytics.com", "url": "https://www.numberanalytics.com/blog/feminist-perspectives-on-sex-work"}, {"title": "Feminist Perspectives on Sex Markets - Stanford Encyclopedia of Philosophy", "url": "https://plato.stanford.edu/entries/feminist-sex-markets/"}], "t": 4558, "clip": "clips/claim_311_4556840_4565000.mp4"}, {"claim": "Degrading means to debase oneself, humiliate oneself, or surrender one's dignity.", "quote": "I think degrading means to debase oneself, to humiliate oneself, to kind of surrender one's dignity.", "start": 4583.62, "end": 4588.78, "category": "Other", "section": "Intro", "id": 312, "llm_start": 4583.6, "llm_end": 4588.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Dictionary definitions support the core meaning: degrading/degrade is defined as debasing, humiliating, or lowering dignity/character ([1], [4], [8]), and one source describes it as causing a loss of dignity, respect, or self-worth ([6]). The only imprecision is the reflexive/voluntary phrasing “oneself” and “surrender,” since degradation can be imposed by others rather than self-inflicted. Overall, the statement is broadly accurate.", "sources": [{"title": "DEGRADING Definition & Meaning", "url": "https://www.dictionary.com/browse/degrading"}, {"title": "DEGRADE definition in American English", "url": "https://www.collinsdictionary.com/us/dictionary/english/degrade"}, {"title": "degrading - meaning and examples | GlobalRPh WordCraft", "url": "https://globalrph.com/blogCalcs/wordcraft/word.php?id=degrading&p=17"}, {"title": "DEGRADE Definition & Meaning", "url": "https://www.merriam-webster.com/dictionary/degrade"}], "t": 4583, "clip": "clips/claim_312_4581620_4590780.mp4"}, {"claim": "The Christian sexual ethic holds that sex is reserved for a special commitment.", "quote": "it's actually reserved for this special commitment", "start": 4860.53, "end": 4864.0, "category": "Other", "section": "Intro", "id": 313, "llm_start": 4860.0, "llm_end": 4864.0, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Multiple independent Christian sources describe the traditional Christian sexual ethic as reserving sexual expression for marriage, understood as a covenantal commitment. Source 2 says sexuality is intended within the covenant of marriage, source 5 describes marriage as a lifelong covenant, and source 6 states explicitly that sexual expression is reserved for marriage. Some Christian communities dissent, but the claim accurately states the mainstream/orthodox ethic.", "sources": [{"title": "What are the Bible's teachings on sexual ethics?", "url": "https://biblehub.com/q/bible's_teachings_on_sexual_ethics.htm"}, {"title": "What Is a Christian Sexual Ethic? - Theology in the raw", "url": "https://theologyintheraw.com/what-is-a-christian-sexual-ethic/"}, {"title": "Christian Sexuality", "url": "https://lutheransforlife.org/wp-content/uploads/2026/09/LFL733B_Christian_Sexuality_Bible_Study_2022.pdf"}], "t": 4860, "clip": "clips/claim_313_4858530_4866000.mp4"}, {"claim": "Ben Roethlisberger is larger than Aaron Rodgers, and Aaron Rodgers is skinnier than Ben Roethlisberger.", "quote": "Big Ben is a bigger guy. Aaron Rodgers skinnier than Big Ben.", "start": 4943.8, "end": 4947.0, "category": "Biography", "section": "Intro", "id": 314, "llm_start": 4945.1, "llm_end": 4947.0, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "StatMuse lists Ben Roethlisberger at 6'5\" and 240 lb, compared with Aaron Rodgers at 6'2\" and 223 lb. That supports the claim that Roethlisberger is the larger/bigger man and Rodgers is skinnier/lighter.", "sources": [{"title": "Aaron Rodgers Vs Ben Roethlisberger Career | StatMuse", "url": "https://www.statmuse.com/nfl/ask/aaron-rodgers-vs-ben-roethlisberger-career"}], "t": 4943, "clip": "clips/claim_314_4941800_4949000.mp4"}, {"claim": "The previous speaker's position was that sex is ordered toward procreation.", "quote": "It's ordered towards procreation.", "start": 5019.69, "end": 5021.25, "category": "Other", "section": "Intro", "id": 315, "llm_start": 5019.7, "llm_end": 5021.2, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The relevant sources discuss the Catholic teaching that sex is ordered toward procreation, but they do not contain the Jubilee video transcript or confirm that the previous speaker in that video held this position. Without transcript or video evidence tying the quoted phrase to that speaker, the attribution cannot be verified.", "sources": [{"title": "Sex Is a Procreative Act | Catholic Answers Magazine", "url": "https://www.catholic.com/magazine/online-edition/sex-is-a-procreative-act"}, {"title": "Sex Is a Procreative Act | Catholic Answers Magazine", "url": "https://www.catholic.com/magazine/online-edition/sex-is-a-procreative-act?mc_cid=b5d2ce5b08&mc_eid=9be46f654f"}], "t": 5019, "clip": "clips/claim_315_5017690_5023250.mp4"}, {"claim": "The Christian virtue of sex elevates sex to a bond between a man and a woman, specifically a husband and wife.", "quote": "it raises it to a bond between a man and a woman, a husband and a wife.", "start": 5024.13, "end": 5027.25, "category": "Other", "section": "Intro", "id": 316, "llm_start": 5024.1, "llm_end": 5027.2, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The sources consistently describe mainstream Christian teaching that sex is intended for marriage and functions as a covenantal, one-flesh bond between husband and wife (e.g., [2], [5]). The Vatican catechism likewise states that sexuality is ordered to conjugal love between man and woman and that marriage signifies spiritual communion [9]. The quote accurately summarizes this theological position, though it is a doctrinal claim rather than an empirical fact.", "sources": [{"title": "What Does the Bible Say About Sex in Marriage? (Explained)", "url": "https://thebiblechristian.com/what-does-the-bible-say-about-sex-in-marriage/"}, {"title": "What does the Bible say about sex in marriage?", "url": "https://biblehub.com/q/bible's_view_on_marital_sex.htm"}, {"title": "III. The Love of Husband and Wife - Vatican", "url": "https://www.vatican.va/content/catechism/en/part_three/section_two/chapter_two/article_6/iii_the_love_of_husband_and_wife.html"}], "t": 5024, "clip": "clips/claim_316_5022130_5029250.mp4"}, {"claim": "The Christian sexual ethic has three necessary conditions.", "quote": "there's three necessary conditions", "start": 5077.41, "end": 5078.47, "category": "Other", "section": "Intro", "id": 317, "llm_start": 5078.7, "llm_end": 5080.0, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The sources describe Christian sexual ethics through broad biblical principles such as covenant marriage, exclusivity, permanence, and purity, but none defines a universally agreed set of exactly three “necessary conditions.” The only “three” references in the sources are unrelated—three sins in [7] and three scholarly approaches in [10]. The claim is therefore a stipulative or opinion-based framing rather than an independently established fact.", "sources": [{"title": "What are the Bible's teachings on sexual ethics?", "url": "https://biblehub.com/q/bible's_teachings_on_sexual_ethics.htm"}, {"title": "Christian Sexual Ethics Between the Ages - The Gospel Coalition", "url": "https://www.thegospelcoalition.org/article/sexual-ethics-overlap-ages/"}, {"title": "BIBLICAL PRINCIPLES FOR HUMAN SEXUALITY: SURVEY OF CULTURE ...", "url": "https://downloads.frcaction.org/EF/EF20I40.pdf"}, {"title": "Jason Upchurch - Selected Scriptures - What Is the Christian ...", "url": "https://redeemerdeerpark.com/wp-content/uploads/2026/01/jason-upchurch-selected-scriptures-what-is-the-christian-sexual-ethic.pdf"}, {"title": "CHRISTIAN SEXUAL ETHICS - University of Alberta", "url": "https://sites.ualberta.ca/~pflaman/cse.html"}], "t": 5077, "clip": "clips/claim_317_5075410_5080470.mp4"}, {"claim": "The Christian sexual ethic requires sex to be consensual.", "quote": "It needs to be consensual", "start": 5078.73, "end": 5079.35, "category": "Other", "section": "Intro", "id": 318, "llm_start": 5080.0, "llm_end": 5082.1, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The sources support consent as an ethical norm within Christian sexual ethics: a Catholic theological guide explicitly treats sexual consent as an ethical norm in marriage [7], and a Christian university article discusses teaching consent from a biblical worldview [4]. The claim is broadly accurate for mainstream Christian ethics, but “the Christian sexual ethic” is not monolithic, and consent is generally a necessary condition rather than the whole ethic.", "sources": [{"title": "The Image I Reflect: Considering Consent From a Biblical ...", "url": "https://www.cedarville.edu/insights/post/the-image-i-reflect-consent-from-biblical-worldview"}, {"title": "A Catholic Guide to Practicing Consent in Marriage", "url": "https://churchlifejournal.nd.edu/articles/a-catholic-guide-to-practicing-consent-in-marriage/"}], "t": 5078, "clip": "clips/claim_318_5076730_5081350.mp4"}, {"claim": "The Christian sexual ethic holds that wearing a condom or using birth control is wrong.", "quote": "it's wrong, for instance, to wear a condom or be on birth control.", "start": 5081.03, "end": 5084.25, "category": "Other", "section": "Intro", "id": 319, "llm_start": 5082.1, "llm_end": 5088.7, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The claim treats a contested issue as a single 'Christian sexual ethic.' Sources 1 and 9 show Christian denominations vary widely, from acceptance of contraception to natural family planning only to Quiverfull rejection; source 3 notes the Catholic Church opposes contraception but most Protestant churches leave it to conscience, and source 4 says the Bible cannot be used to argue birth control is wrong. Thus the blanket statement that condoms or birth control are wrong for Christians is false as a general claim.", "sources": [{"title": "Christian views on birth control - Wikipedia", "url": "https://en.wikipedia.org/wiki/Christian_views_on_birth_control"}, {"title": "Is Using Condoms or Birth Control a Sin? The Catholic Church Says Yes ...", "url": "https://christianpure.com/learn/condom-use-sinful-biblical-perspective/"}, {"title": "What does the Bible say about birth control? Should Christians use ...", "url": "https://www.gotquestions.org/birth-control.html"}, {"title": "Religion and birth control - Wikipedia", "url": "https://en.wikipedia.org/wiki/Religion_and_birth_control"}], "t": 5081, "clip": "clips/claim_319_5079030_5086250.mp4"}, {"claim": "Under the Christian sexual ethic, sex by a post-menopausal woman is still permissible.", "quote": "Even if the woman is post menopause, that's still fine.", "start": 5084.25, "end": 5088.73, "category": "Other", "section": "Intro", "id": 320, "llm_start": 5088.7, "llm_end": 5090.0, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Catholic teaching confirms that married couples may continue marital relations after menopause, since the unitive purpose of sex remains even when procreation is no longer possible. A Church of Christ Q&A likewise states that couples may engage in sexual activity when conception is impossible, explicitly including after menopause. The claim is accurate for sex within marriage, which is the relevant Christian ethical context; it would not imply that non-marital sex is permissible.", "sources": [{"title": "Menopause Is No Reason to Stop Marital Relations", "url": "https://www.catholic.com/qa/menopause-is-no-reason-to-stop-marital-relations"}, {"title": "My wife refuses to be intimate with me – La Vista Church of ...", "url": "https://www.lavistachurchofchrist.org/cms/my-wife-refuses-to-be-intimate-with-me/"}], "t": 5084, "clip": "clips/claim_320_5082250_5090730.mp4"}, {"claim": "The Christian sexual ethic requires sex to involve pair bonding.", "quote": "And then it also needs to involve that level of pair bonding.", "start": 5090.01, "end": 5092.09, "category": "Other", "section": "Intro", "id": 321, "llm_start": 5091.1, "llm_end": 5094.3, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The cited sources describe Christian sexual ethics as locating sex within biblical marriage and emphasizing the marital covenant or \"one flesh\" bond (sources 1, 3, and 10). That supports the general idea that sex is expected to be embedded in a committed pair bond. However, \"pair bonding\" is not a standard term in these sources, so the claim is a loose but broadly accurate summary rather than a precise statement of every Christian tradition.", "sources": [{"title": "BIBLICAL SEXUAL ETHICS A Church of God Theological and ...", "url": "https://www.jesusisthesubject.org/wp-content/uploads/2026/09/biblical_sexual_ethics_final2026_formatted.pdf"}, {"title": "What are the principles of Christian sexual ethics? - Bible Chat", "url": "https://crosstalk.ai/knowledgebase/theological-concepts/ethical-theology/what-principles-christian-sexual-ethics/"}, {"title": "Marriage and Sexuality in Terms of Christian Theological ...", "url": "https://www.sciencedirect.com/science/article/pii/S1877042815011969"}], "t": 5090, "clip": "clips/claim_321_5088010_5094090.mp4"}, {"claim": "The Christian sexual ethic holds that IVF is wrong because it is procreation without pair bonding.", "quote": "something like IVF is wrong by the Christian sexual ethic because it's procreation without the pair bonding.", "start": 5092.93, "end": 5097.69, "category": "Other", "section": "Intro", "id": 322, "llm_start": 5094.3, "llm_end": 5098.7, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "Catholic teaching does oppose IVF because it separates procreation from the marital act/union, which is close to the claim’s “procreation without pair bonding” rationale ([8],[10],[12]). But the statement overgeneralizes to “the Christian sexual ethic” as a whole: sources note that Christian opinions vary, and some evangelical/Reformed Christians defend IVF within ethical boundaries ([2],[3]). It is therefore a real rationale in one major tradition, but not a uniformly held Christian position.", "sources": [{"title": "IVF: Moral and Ethical Considerations - Focus on the Family", "url": "https://www.focusonthefamily.com/family-qa/ivf-moral-and-ethical-considerations/"}, {"title": "A Biblical Case for In Vitro Fertilization (IVF) with Strict ...", "url": "https://biblicalspiritualitypress.org/2026/05/11/a-biblical-case-for-in-vitro-fertilization-ivf-with-strict-ethical-boundaries/"}, {"title": "Catholic Teaching on IVF: What the Church Says About In Vitro ...", "url": "https://guidecatholic.com/blog/catholic-teaching-on-ivf/"}, {"title": "What is the Catholic Church's position on IVF?", "url": "https://ewtn.co.uk/article-what-is-the-catholic-churchs-position-on-ivf/"}, {"title": "Catholic Church Teaching on IVF | Catholic Church Times", "url": "https://www.catholicchurchtimes.com/explainers/what-does-the-catholic-church-teach-about-ivf"}], "t": 5092, "clip": "clips/claim_322_5090930_5099690.mp4"}, {"claim": "The Christian sexual ethic holds that sex with a condom is wrong because it is pair bonding without procreation.", "quote": "Sex with a condom is wrong because it's pair bonding without the procreation", "start": 5097.69, "end": 5101.31, "category": "Other", "section": "Intro", "id": 323, "llm_start": 5098.7, "llm_end": 5103.0, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "Catholic teaching does prohibit condoms and artificial contraception, holding that each marital act must remain open to procreation while retaining its unitive meaning (sources 9, 11, 14). But there is no single “Christian sexual ethic” on this point: most Protestant churches leave contraception to conscience, and Anglican/United Methodist bodies allow it (source 2). The quoted formulation is therefore at best a simplified version of the Catholic rationale, not a universal Christian position.", "sources": [{"title": "Is Using Condoms or Birth Control a Sin? The Catholic Church ...", "url": "https://christianpure.com/learn/condom-use-sinful-biblical-perspective/"}, {"title": "Humanae Vitae (July 25, 1968) - Vatican", "url": "https://www.vatican.va/content/paul-vi/en/encyclicals/documents/hf_p-vi_enc_25071968_humanae-vitae.html"}, {"title": "Humanae Vitae — Of Human Life | Catholic Theology", "url": "https://www.catholictheology.info/encyclicals/humanae-vitae/"}, {"title": "Birth Control | Catholic Answers Tract", "url": "https://www.catholic.com/tract/birth-control"}], "t": 5097, "clip": "clips/claim_323_5095690_5103310.mp4"}, {"claim": "The Christian sexual ethic requires sex to be between a husband and a wife.", "quote": "it has to be between a husband and a wife.", "start": 5103.01, "end": 5104.61, "category": "Other", "section": "Intro", "id": 324, "llm_start": 5104.6, "llm_end": 5107.1, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The claim reflects the dominant traditional Christian sexual ethic: the cited sources state that sexual relations are reserved for marriage and are to be between husband and wife, with sex outside that union treated as immoral. Official LDS and Catholic teaching likewise limits sexual intimacy to marriage between a man and a woman. The caveat is that Christianity is not monolithic, since some progressive denominations dissent, so this is best described as mostly true rather than universally absolute.", "sources": [{"title": "What Does the Bible Say About Sex in Marriage? (Explained)", "url": "https://thebiblechrist pecific.", "sources": [{"title": "Half of U.S. Christians say casual sex sometimes or always acceptable ...", "url": "https://www.pewresearch.org/short-reads/2020/08/31/half-of-u-s-christians-say-casual-sex-between-consenting-adults-is-sometimes-or-always-acceptable/"}, {"title": "Half of US Christians say sex is sometimes, always OK in ...", "url": "https://www.christianpost.com/news/half-of-us-christians-say-casual-sex-is-sometimes-always-ok-in-dating-relationship.html"}], "t": 5107, "clip": "clips/claim_325_5105050_5113290.mp4"}, {"claim": "Everyone is effectively secular when it comes to sexual ethics.", "quote": "I think everyone is pretty much a secular when it comes to sexual ethics.", "start": 5111.29, "end": 5114.49, "category": "Statistics", "section": "Intro", "id": 326, "llm_start": 5111.3, "llm_end": 5114.5, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The quote is a broad opinion/generalization rather than a testable factual claim. The sources describe mixed religious and secular discourses and differences in sexual attitudes, but none establishes that everyone is 'effectively secular' in sexual ethics; [5] only suggests a possible decline of religious authority in this realm.", "sources": [{"title": "PDF The Differences in Attitudes towards Sexuality between Religious and ...", "url": "https://www.scirp.org/pdf/psych_2022071416015129.pdf"}, {"title": "Religiosity and Premarital Sexual Behaviors among Adolescents: An ...", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6640872/"}, {"title": "Sexuality and Religious Ethics: Analysis in a Multicultural ... - MDPI", "url": "https://www.mdpi.com/2227-9032/11/2/250"}], "t": 5111, "clip": "clips/claim_326_5109290_5116490.mp4"}, {"claim": "The only condition commonly believed necessary for sex is consent or respect for the woman's dignity/self-actualization.", "quote": "We all believe that the only necessary condition is for it to be consensual or ordered towards self actualization as in responding, respecting that woman's dignity", "start": 5114.49, "end": 5121.06, "category": "Statistics", "section": "Intro", "id": 327, "llm_start": 5114.5, "llm_end": 5121.4, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "Consent is widely treated as a necessary foundation for sex, and one source notes that a “good sex only requires consent” ethic has come to define much modern sexual ethics. But the claim overstates a contested position: other sources stress that consent is necessary but not sufficient and argue for standards beyond consent, such as mutuality. No source establishes that “we all” believe only consent or self-actualization/dignity is required.", "sources": [{"title": "PDF Beyond Consent: Moving to A Full-bodied Sexual Ethics", "url": "https://www.ohchr.org/sites/default/files/documents/cfi-subm/subm-addendum-sr-violence-ind-64-elly-hanson-1.pdf"}, {"title": "PDF Understanding and Raising Awareness on Sexual Consent", "url": "https://www.europarl.europa.eu/RegData/etudes/BRIE/2025/773630/IUST_BRI(2025)773630_EN.pdf"}, {"title": "Mutuality in Sexual Relationships: a Standard of Ethical Sex?", "url": "https://link.springer.com/article/10.1007/s10677-020-10150-8"}], "t": 5114, "clip": "clips/claim_327_5112490_5123060.mp4"}, {"claim": "Wearing a condom means sex is not ordered toward procreation, according to the speaker.", "quote": "they're wearing a condom, so it's not ordered towards procreation", "start": 5127.37, "end": 5130.01, "category": "Other", "section": "Intro", "id": 328, "llm_start": 5127.4, "llm_end": 5130.0, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The quoted statement matches standard Catholic moral theology: source [1] says contraception is condemned because it intentionally thwarts sex’s procreative end, and source [3] explicitly says barrier methods/contraceptives act against procreation. Thus, within the framework the speaker invokes, wearing a condom means the act is not ordered toward procreation. The claim is theological/moral rather than empirical, but it accurately reports the speaker’s stated position as quoted.", "sources": [{"title": "Sex Is a Procreative Act | Catholic Answers Magazine", "url": "https://www.catholic.com/magazine/online-edition/sex-is-a-procreative-act"}, {"title": "Straight Talk on NFP, Man to Man - ccli.org", "url": "https://ccli.org/2017/12/straight-talk-on-nfp-man-to-man/"}], "t": 5127, "clip": "clips/claim_328_5125370_5132010.mp4"}, {"claim": "Not being married means sex is not ordered toward marital pair bonding, according to the speaker.", "quote": "and they're not married, so it's not ordered towards marital pair bonding.", "start": 5130.01, "end": 5132.77, "category": "Other", "section": "Intro", "id": 329, "llm_start": 5130.0, "llm_end": 5132.8, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The quoted line directly supports the attribution: the speaker says that because “they’re not married,” it is “not ordered towards marital pair bonding.” The Catholic-teaching sources [1][2] provide context for the idea that marriage is ordered toward spousal unity and procreation, but the verdict rests on the speaker’s own quoted wording.", "sources": [{"title": "Catholic theology of sexuality - Wikipedia", "url": "https://en.wikipedia.org/wiki/Catholic_theology_of_sexuality"}, {"title": "Catechism of the Catholic Church", "url": "https://www.usccb.org/sites/default/files/flipbooks/catechism/402/"}], "t": 5130, "clip": "clips/claim_329_5128010_5134770.mp4"}, {"claim": "The speaker refers to three necessary conditions in the Christian sexual ethic.", "quote": "if these are all three necessary conditions for you", "start": 5181.45, "end": 5183.53, "category": "Other", "section": "Intro", "id": 330, "llm_start": 5181.4, "llm_end": 5183.5, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "No transcript or reliable source is provi  334, "llm_start": 5250.8, "llm_end": 5254.7, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The classic trolley problem presents a choice between intervening to divert a trolley so that one person dies instead of five, or doing nothing and allowing five to die. Sources [1], [2], [3], [5], and [7] all describe this basic dilemma, including the doing-versus-allowing framing. The quoted statement is an accurate summary of the standard scenario.", "sources": [{"title": "Trolley problem - Wikipedia", "url": "https://en.wikipedia.org/wiki/Trolley_problem"}, {"title": "The Trolley Problem Explained: Navigating Ethical Dilemmas", "url": "https://philosopedia.org/the-trolley-problem-explained-navigating-ethical-dilemmas/"}, {"title": "Trolley Dilemma: Kill One Person to Save Five? - ThoughtCo", "url": "https://www.thoughtco.com/would-you-kill-one-person-to-save-five-4045377"}, {"title": "What is the 'Trolley Problem?' | Merriam-Webster", "url": "https://www.merriam-webster.com/wordplay/trolley-problem-moral-philosophy-ethics"}, {"title": "PDF The Trolley Problem - University of Colorado Boulder", "url": "https://rintintin.colorado.edu/~vancecd/phil3160/trolley.pdf"}], "t": 5249, "clip": "clips/claim_334_5247010_5256730.mp4"}, {"claim": "A lot of people have difficulty deciding the trolley problem.", "quote": "That is a problem that a lot of people have an issue deciding", "start": 5254.73, "end": 5257.77, "category": "Statistics", "section": "Intro", "id": 335, "llm_start": 5254.7, "llm_end": 5257.8, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The sources describe the trolley problem as a classic moral dilemma involving competing ethical principles, which makes it understandable that people find it hard. But none of the provided sources quantify how many people struggle to decide or provide survey data on difficulty; “a lot” is vague. The claim is therefore not independently verifiable from these sources.", fy “many men” or clearly establish that creators themselves are messaging such men, so the claim is broadly supported but somewhat overgeneralized.", "sources": [{"title": "Handling Harassment and Negative Comments as an OnlyFans Creator", "url": "https://silkafterdark.com/handling-harassment-and-negative-comments-as-an-onlyfans-creator/"}, {"title": "OnlyFans: How Models Negotiate Fan Interaction - Springer", "url": "https://link.springer.com/article/10.1007/s12119-024-10230-2"}, {"title": "Content Creator Harassment on OnlyFans - Cybertrace™", "url": "https://www.cybertrace.com.au/content-creator-harassment-on-onlyfans/"}, {"title": "The Men on OnlyFans Aren't Only Who You Think - Psychology Today", "url": "https://www.psychologytoday.com/us/blog/dinner-party-smart/202308/men-subscribing-to-onlyfans-are-not-who-you-might-think"}], "t": 5402, "clip": "clips/claim_347_5400910_5409640.mp4"}, {"claim": "Many people form parasocial relationships and believe they are real.", "quote": "there are a lot of people that are falling into this pit of them and believing that it is something real", "start": 5419.69, "end": 5424.52, "category": "Other", "section": "Intro", "id": 348, "llm_start": 5419.4, "llm_end": 5424.5, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Survey research cited in [2] indicates that a large share of Americans—about 51% by one estimate—have likely formed parasocial relationships, and many report genuine emotional reactions such as bereavement. [6] also examines how people perceive their parasocial relationships, supporting the idea that these bonds are experienced as meaningful. However, the phrase “believe they are real” is broader than what the sources directly measure: parasocial relationships are by definition one-sided, so the evidence more clearly supports their prevalence and emotional force than a precise belief that they are reciprocal relationships.", "sources": [{"title": "New Thriveworks Research on Paras r relationships ended after they disclosed their jobs. Source 2 likewise notes that OnlyFans has led to relationship strain for some creators. This supports the claim that some OnlyFans creators say the platform can strain relationships.", "sources": [{"title": "OnlyFans models have trouble dating, holding down ...", "url": "https://humanevents.com/news/onlyfans-models-have-trouble-dating-holding-down-relationships-report"}, {"title": "While OnlyFans has provided financial independence ... - Medium", "url": "https://medium.com/@vrsworldtrader/while-onlyfans-has-provided-financial-independence-for-many-creators-it-has-also-led-to-c683c67e9b9f"}], "t": 5446, "clip": "clips/claim_351_5444880_5451920.mp4"}, {"claim": "The speaker has read online that OnlyFans can be similar to gambling, with comparable stimulation and reward effects.", "quote": "I've read online that only fans can be simulated. I was like gambling, it can be like kind of the same effect because you're getting that stimulation, you're getting that reward and then you're falling back into this circle.", "start": 5468.08, "end": 5478.9, "category": "Health", "section": "Intro", "id": 352, "llm_start": 5471.5, "llm_end": 5478.9, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The quoted statement is attributed to the speaker, and independent addiction-resource sources support its substance: one says OnlyFans addiction combines elements of pornography, gambling and parasocial relationships, while another explains that OnlyFans addiction can affect dopamine and reward cycles like other behavioral addictions. “Comparable” is a lay comparison rather than a precise clinical equivalence, but the claim that such an online comparison exists is supported.", "sources": [{"title": "OnlyFans Addiction: Signs, Effects, and Treatment", "url": "https://www.addictioncenter.com/behavioral-addictions/porn-addiction/onlyfans-addiction/"}, {"title": "OnlyFans Addiction: The Rise of a New Porn Addiction", "url": "https://www.addictionresource.net/blog/onlyfans-addiction/"}], "t": 5468, "clip": "clips/claim_352_5466080_5480900.mp4"}, {"claim": "In the debate, it was argued that athletes use their bodies as a skill.", "quote": "athletes are able to use their bodies because they are using it as a skill.", "start": 5499.22, "end": 5503.22, "category": "Other", "section": "Intro", "id": 353, "llm_start": 5498.9, "llm_end": 5503.2, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The provided sources discuss athletic skill, expertise, and nature vs. nurture, but none contains a transcript or reliable account of the Jubilee debate or the quoted statement. Without the video transcript or independent reporting on what was said, the claim cannot be verified.", "sources": [], "t": 5499, "clip": "clips/claim_353_5497220_5505220.mp4"}, {"claim": "The speaker asserts that objectification can be benign and does not have to be insidious or malicious.", "quote": "Objectification can oftentimes be a benign. It doesn't have to be insidious or malicious.", "start": 5602.02, "end": 5606.06, "category": "Other", "section": "Intro", "id": 354, "llm_start": 5602.0, "llm_end": 5606.1, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The quoted statement directly matches the claim that the speaker said objectification can be benign and need not be insidious or malicious. Source [1] notes that Martha Nussbaum distinguishes benign from harmful objectification and argues not all objectification is inherently negative, and source [8] summarizes that objectification can take benign or even positive forms in some contexts. Sources [2] and [3] likewise defend the view that objectification is not always harmful.", "sources": [{"title": "Objectification - Wikipedia", "url": "https://en.wikipedia.org/wiki/Objectification"}, {"title": "After objectification: locating harm - eprints.whiterose.ac.uk", "url": "https://eprints.whiterose.ac.uk/id/eprint/204946/1/J+Applied+Philosophy+-+2023+-+Vince+-+After+Objectification++Locating+Harm.pdf"}, {"title": "After Objectification: Locating Harm - Vince - 2024 - Journal ...", "url": "https://onlinelibrary.wiley.com/doi/10.1111/japp.12698?af=R"}, {"title": "Feminist Perspectives on Objectification (Stanford ...", "url": "https://plato.stanford.edu/entries/feminism-objectification/"}], "t": 5602, "clip": "clips/claim_354_5600020_5608060.mp4"}, {"claim": "Objectifying someone means going to them for a particular aspect.", "quote": "You're objectifying someone when you go to them for a particular aspect.", "start": 5606.06, "end": 5608.78, "category": "Other", "section": "Intro", "id": 355, "llm_start": 5606.1, "llm_end": 5608.8, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The statement captures one recognized feature of objectification—instrumentality, or treating someone as a tool for one's purposes—but objectification is broader than simply going to someone for a particular aspect. Philosophical accounts list multiple features such as denial of autonomy, reduction to body, and denial of subjectivity, and they note that instrumental treatment is not always sufficient by itself to establish harmful objectification. So the quote is partly accurate but overstates a partial definition as the meaning.", "sources": [{"title": "Objectification - Wikipedia", "url": "https://en.wikipedia.org/wiki/Objectification"}, {"title": "Feminist Perspectives on Objectification - Stanford Encyclopedia of ...", "url": "https://plato.stanford.edu/entries/feminism-objectification/"}], "t": 5606, "clip": "clips/claim_355_5604060_5610780.mp4"}, {"claim": "The speaker argues that going to a teacher solely to learn technically counts as objectification.", "quote": "So if I go to a teacher simply to learn things, technically that qualifies as objectification, right?", "start": 5608.78, "end": 5612.74, "category": "Other", "section": "Intro", "id": 356, "llm_start": 5608.8, "llm_end": 5612.7, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The provided sources discuss definitions and theories of objectification, but none contains the video transcript or the quoted line. They therefore cannot confirm that this specific speaker made the argument attributed to them. The claim is about what was said in a particular Jubilee video, and the evidence supplied is insufficient to verify it.", "sources": [{"title": "Objectification - Wikipedia", "url": "https://en.wikipedia.org/wiki/Objectification"}, {"title": "Feminist Perspectives on Objectification - Stanford Encyclopedia of ...", "url": "https://plato.stanford.edu/entries/feminism-objectification/"}], "t": 5608, "clip": "clips/claim_356_5606780_5614740.mp4"}, {"claim": "Objectification is not limited to using one's body as an instrument; it can involve any sort of skill.", "quote": "Objectification is not just cash out and whether you're specifically using your body as an instrument. It could be any sort of skill.", "start": 5612.74, "end": 5617.82, "category": "Other", "section": "Intro", "id": 357, "llm_start": 5612.7, "llm_end": 5617.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The sources define objectification broadly as treating a person as an object or tool, and Nussbaum's criterion of instrumentality is not limited to sexual or bodily use; she also discusses objectification in non-sexual contexts such as capitalism and slavery. This supports the idea that objectification can involve a person's capacities or skills being used instrumentally, not just their body. The sources do not literally say 'any sort of skill,' so the claim is broadly supported but somewhat overgeneralized.", "sources": [{"title": "Objectification - Wikipedia", "url": "https://en.wikipedia.org/wiki/Objectification"}, {"title": "Feminist Perspectives on Objectification (Stanford ...", "url": "https://plato.stanford.edu/entries/feminism-objectification/"}, {"title": "(PDF) Objectification and Instrumentalization: The Activation ...Being Treated as an Instrument: Consequences of Instrumental ...Objectification - an overview | ScienceDirect Topics", "url": "https://www.academia.edu/64141469/Objectification_and_Instrumentalization_The_Activation_of_Thanatos_in_Connection_with_Body_Power_or_the_Human_Body_as_a_Critical_Object_of_Power_in_the_Recent_Social_Reality"}], "t": 5612, "clip": "clips/claim_357_5610740_5619820.mp4"}, {"claim": "Commodification is defined as selling a particular thing and making it available for public consumption in a marketplace transaction.", "quote": "Commodification would be selling that particular thing, making it available for public consumption in a marketplace transaction.", "start": 5643.69, "end": 5650.81, "category": "Economics", "section": "Intro", "id": 358, "llm_start": 5643.7, "llm_end": 5650.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The core of the claim matches standard definitions: commodification involves turning things into commodities that can be sold or exchanged in a market. Sources describe it as transforming things into objects for sale and providing them through market transactions. However, the claim is somewhat narrow and imprecise: commodification is generally a process, not merely a single sale, and 'public consumption' is not the key defining feature.", "sources": [{"title": "Commodification - Wikipedia", "url": "https://en.wikipedia.org/wiki/Commodification"}, {"title": "Commodification - neolib.uga.edu", "url": "https://neolib.uga.edu/commodification"}, {"title": "Commodification Definition & Explanation | Sociology Plus", "url": "https://sociology.plus/glossary/commodification/"}], "t": 5643, "clip": "clips/claim_358_5641690_5652810.mp4"}, {"claim": "The median creator on OnlyFans earns about $100.", "quote": "the median creator on Onlyfans makes, 100 bucks", "start": 5683.87, "end": 5688.22, "category": "Statistics", "section": "Intro", "id": 359, "llm_start": 5683.2, "llm_end": 5688.5, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The ~$100 figure is the arithmetic mean obtained by dividing OnlyFans payouts by all registered creator accounts, including inactive ones, not the median ([1], [3]). Source [3] explicitly says the median is far less than the average and that OnlyFans does not publish a median; other estimates vary and generally do not support “about $100 per month” as the median ([1], [2]). The claim conflates average per account with median creator earnings.", "sources": [{"title": "Average OnlyFans Income 2026: What Creators Really Make", "url": "https://spicyranked.com/blog/how-much-do-onlyfans-creators-make"}, {"title": "OnlyFans Creator Income Distribution Report 2026", "url": "https://onlyfansstatistics.com/earnings"}, {"title": "OnlyFans Average Income (2026): What Creators Really Make", "url": "https://onlystack.com/blog/onlyfans-average-income"}], "t": 5683, "clip": "clips/claim_359_5681870_5690220.mp4"}, {"claim": "The top 1% of OnlyFans creators make one third of the entire platform's earnings pool.", "quote": "While the top 1% are making one third of the entire kind of pool.", "start": 5690.45, "end": 5696.97, "category": "Statistics", "section": "Intro", "id": 360, "llm_start": 5690.4, "llm_end": 5697.0, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Multiple sources estimate that the top 1% of OnlyFans creators capture roughly 33% of platform payouts or creator revenue, which supports the claim's core figure. However, source [1] notes this distribution is panel-derived and directional rather than audited, since OnlyFans does not publish the underlying creator income distribution. The claim is therefore broadly supported as an estimate, but not as an exact official statistic.", "sources": [{"title": "OnlyFans Creator Income Distribution Report 2026", "url"
