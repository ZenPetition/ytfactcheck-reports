tml"}], "t": 707, "clip": "clips/claim_011_705990_711760.mp4"}, {"claim": "Pornhub hosted sex-trafficking content featuring porn stars who were abused on camera and scammed.", "quote": "when Pornhub hosted sex trafficking content featuring stars porn that were constantly abused in front of the camera and scammed", "start": 736.27, "end": 742.09, "category": "Technology", "section": "Intro", "id": 12, "llm_start": 735.6, "llm_end": 742.3, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The DOJ and BBC report that Pornhub’s parent company admitted to receiving proceeds from sex trafficking tied to GirlsDoPorn and to profiting from videos of women who had been coerced into sexual acts. Legal reporting also says Aylo acknowledged turning a blind eye to victim reports and that GirlsDoPorn operators were convicted of sex trafficking, supporting the core claim that trafficking-related content was hosted and involved deceived/coerced performers. The phrase “porn stars” is somewhat overstated, since many of the women were recruited amateurs rather than established stars, so the statement is not fully precise.", "sources": [{"title": "Pornhub Parent Company Admits to Receiving Proceeds of Sex Trafficking ...", "url": "https://www.justice.gov/usao-edny/pr/pornhub-parent-company-admits-receiving-proceeds-sex-trafficking-and-agrees-three-year"}, {"title": "Pornhub Lawsuit: Federal Case, Class Actions, and FTC Order", "url": "https://courtdocket.org/pornhub-lawsuit-federal-case-class-actions-and-ftc-order/"}, {"title": "Pornhub owner to pay victims $1.8m in sex trafficking case - BBC", "url": "https://www.bbc.com/news/technology-67804156"}], "t": 736, "clip": "clips/claim_012_734270_744090.mp4"}, {"claim": "The vast majority of OnlyFans subscribers are married.", "quote": "the vast majority of OnlyFan subscribers are married", "start": 863.53, "end": 867.48, "category": "Statistics", "section": "Intro", "id": 13, "llm_start": 862.3, "llm_end": 86  the Lifespan: A Meta-Analysis ...", "url": "https://journals.sagepub.com/doi/10.1002/per.2220"}, {"title": "Loneliness around the world: Age, gender, and cultural differences in ...", "url": "https://www.sciencedirect.com/science/article/pii/S0191886920302555"}], "t": 1156, "clip": "clips/claim_017_1154240_1161210.mp4"}, {"claim": "89% of OnlyFans subscribers are married men.", "quote": "for 89% of Only subscribers Fans who are married men", "start": 1253.57, "end": 1257.87, "category": "Statistics", "section": "Intro", "id": 18, "llm_start": 1253.6, "llm_end": 1258.2, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The 89% figure refers to subscribers who were married in a survey sample, not to “married men”; the same sample was only about 63% male, and another cited survey was about 53% male. Source [3] explicitly notes that the 89.5% married figure covers men and women together and that treating it as a broad fact about OnlyFans users overstates the data. The claim therefore misstates both the gender and marital-status breakdown.", "sources": [{"title": "The Men on OnlyFans Aren't Only Who You Think - Psychology TodayJulius on X: \"There was no “nasty assassination.” Farah, an ...Onlyfans Male Vs Female Statistics | Verified 2026 DataOnlyFans Male vs Female Statistics 2026: Creators & FansOnlyFans Statistics By Users, Revenue And User Growth (2025)Julius on X: \"There was no “nasty assassination.” Farah, an ...Is OnlyFans affecting Gen Z's view of intimacy?", "url": "https://www.psychologytoday.com/us/blog/dinner-party-smart/202308/men-subscribing-to-onlyfans-are-not-who-you-might-think"}, {"title": "OnlyFans Male vs Female Statistics 2026: Creators & Fans", "url": "https://onlyguider.com/blog/onlyfans-male-vs-female-statistics/"}], "t": 1253, "clip": "clips/claim_018_1251570_1259870.mp4"}, {"claim": "50% of wives consider pornography use to be infidelity.", "quote": "50% of wives consider it infidelity", "start": 1285.95, "end": 1287 ion": "Intro", "id": 24, "llm_start": 1670.8, "llm_end": 1676.1, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Source [1] reports that a 1970 Playboy memo written by Hugh Hefner was leaked and that Hefner called the women’s liberation activists “these chicks are our natural enemy,” while demanding a “devastating piece that takes the militant feminists apart.” That strongly supports the “natural enemy” and attack/ruin framing, but the exact phrase “needed to be ruined” is a paraphrase rather than a direct quotation in the provided source.", "sources": [{"title": "Today in Feminist History: Hugh Hefner and the Chicks", "url": "https://lauratanenbaum.org/?p=237"}], "t": 1670, "clip": "clips/claim_024_1668960_1677250.mp4"}, {"claim": "Women protested against Playboy and Penthouse.", "quote": "The women protested against Playboy and Penthouse", "start": 1678.89, "end": 1680.74, "category": "History", "section": "Intro", "id": 25, "llm_start": 1678.9, "llm_end": 1681.9, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Independent reporting on the 1979 Times Square anti-pornography rally says feminist activists urged a boycott of supermarkets and other stores selling magazines such as Penthouse and Playboy. That action was part of the broader Women Against Pornography campaign, which organized protests and marches against pornography. The claim is therefore supported, though the protest was framed as anti-pornography rather than solely against those two magazines.", "sources": [{"title": "Women Against Pornography - Wikipedia", "url": "https://en.wikipedia.org/wiki/Women_Against_Pornography"}, {"title": "5,000 Join Feminist Group's Rally In Times Sq. Against ...", "url": "https://www.nytimes.com/1979/10/21/archives/5000-join-feminist-groups-rally-in-times-sq-against-pornography.html"}, {"title": "Women Against Pornography Newsreport", "url": "https://www.jstor.org/stable/community.28046782"}], "t": 1678, "clip": "clips/claim_025_1676890_1682740.mp4"}, {"claim": "Before OnlyFans, men were much more likely to morally approve of pornography.", "quote": "Before OnlyFans, the Men were much more likely to morally approve of pornography.", "start": 1699.47, "end": 1703.89, "category": "Statistics", "section": "Intro", "id": 26, "llm_start": 1699.1, "llm_end": 1703.9, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "GSS-based research through 2016—before OnlyFans became widespread—finds sex differences in sexual permissiveness, consistent with men being more approving of pornography than women [6]. Gallup trend data confirm pornography attitudes have been tracked over time, but the provided source does not give a precise male-only pre/post-OnlyFans breakdown, so “much more likely” is imprecise [1].", "sources": [{"title": "Where Americans' Views on Sexual Morality Stand in 2023", "url": "https://www.sexandpsychology.com/blog/2023/12/6/americans-views-towards-sex-in-2023/"}, {"title": "Pornography, permissiveness, and sex differences: An evaluation of ...", "url": "https://www.sciencedirect.com/science/article/pii/S019188691930128X"}], "t": 1699, "clip": "clips/claim_026_1697470_1705890.mp4"}, {"claim": "Before OnlyFans, 20% of men bought sex from prostitutes.", "quote": "Before OnlyFans, 20% of Men bought sex from prostitutes.", "start": 1703.89, "end": 1708.08, "category": "Statistics", "section": "Intro", "id": 27, "llm_start": 1703.9, "llm_end": 1708.1, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The 20% figure is not supported as a general statement about “men.” The provided evidence reports much lower or country-specific estimates, such as about 4% of U.S. adult men buying sex in the past three years [3] and 9.5% of Swedish men ever paying for sex [4]. A German survey is also cited [7], but the claim universalizes what may be a country- and time-specific lifetime estimate and gives no population or timeframe.", "sources": [{"title": "Estimating the Sex Buying Behavior of Adult Males in the U.S ...", "url": "https://endsexualexploitation.org/research-spotlight/estimating-the-sex-buying-behavior-of-adult-males-in-the-u-s/"}, {"title": "Are Men Who Buy Sex Different from Men Who Do Not ... - Springer(PDF) Are Men Who Buy Sex Different from Men Who Do Not ...Are Men Who Buy Sex Different from Men Who Do Not ... - SpringerMen Who Pay For Sex: Prevalence and Sexual Health", "url": "https://link.springer.com/article/10.1007/s10508-020-01843-3"}, {"title": "Men Who Pay For Sex: Prevalence and Sexual Health", "url": "https://di.aerzteblatt.de/int/archive/article/224168/Men-who-pay-for-sex-prevalence-and-sexual-health-Results-from-the-German-Health-and-Sexuality-Survey-(GeSiD)"}], "t": 1703, "clip": "clips/claim_027_1701890_1710080.mp4"}, {"claim": "Only 90% of men watched porn.", "quote": "The claim is that only 90% of the Men watched porn.", "start": 1711.63, "end": 1714.21, "category": "Statistics", "section": "Intro", "id": 28, "llm_start": 1711.6, "llm_end": 1714.2, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The 90% figure is broadly consistent with research on lifetime exposure: the American Institute for Boys and Men's landscape scan reports that over 80% of U.S. adult men report lifetime exposure to pornography, with many estimates exceeding 90%, and a peer-reviewed literature review similarly finds that a majority (>80%) of adult men have accessed pornography at some point. However, the 90% figure overstates regular use — Barna's 2024 data put current consumption at about 78% of men, and past-year use estimates range from 40–70%. So \"90% of men watched porn\" is roughly right for ever having viewed it, but not for ongoing use.", "sources": [{"title": "How many men watch porn? - Covenant Eyes", "url": "https://www.covenanteyes.com/research/how-many-men-watch-porn/"}, {"title": "What we know—and don’t know—about pornography and boy e early Christian voices that also perpetuated non-Christian ideals, and source [8] cautions that New Testament ethics is not a timeless system of moral instruction. The absolute wording “everything outside biblical sexual ethics” is therefore historically unsupported.", "sources": [{"title": "Sexuality in Christian Traditions (Chapter 13) - The ...", "url": "https://www.cambridge.org/core/books/cambridge-world-history-of-sexualities/sexuality-in-christian-traditions/07CA33BE8FBD95EFF5510096748C4BB0"}, {"title": "Early Christianity’s Concept of Sexuality - CBE International", "url": "https://www.cbeinternational.org/resource/early-christianitys-concept-sexuality/"}, {"title": "Sex, gender, and early Christianity (Chapter 5) - Sex, Gender ...", "url": "https://www.cambridge.org/core/books/sex-gender-and-christian-ethics/sex-gender-and-early-christianity/C72BF8108508951CF536B9F0311CDD47"}], "t": 1900, "clip": "clips/claim_030_1898570_1908850.mp4"}, {"claim": "In Roman society, slaves were used only for sex, which was considered normal and natural.", "quote": "the Romans, like the Slaves were only used for the sex and that was something normal and natural that the Romans did in their society.", "start": 1910.57, "end": 1918.44, "category": "History", "section": "Intro", "id": 31, "llm_start": 1909.9, "llm_end": 1918.4, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "Roman slaves performed a very wide range of work, including agriculture, households, commerce, mining, manufacturing, administration, and entertainment; there was no single “typical” Roman slave experience. Sources also confirm that slaves could be sexually exploited by owners, but this was one aspect of slavery, not its only purpose. The claim that Roman slaves were used only for sex is therefore false.", "sources": [{"title": "Slavery in ancient Rome - Wikipedia", "url": "https://en.wikipedia.org/wiki/Slavery_in_ancient_Rome"}, {"title": "Sexuality in ancient Rome - Wikipedia", ips/claim_085_5076990_5081820.mp4"}, {"claim": "According to Christian sexual ethics, sex must be oriented toward procreation.", "quote": "oriented towards procreation", "start": 5080.66, "end": 5081.73, "category": "Other", "section": "Intro", "id": 86, "llm_start": 5080.7, "llm_end": 5082.4, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Traditional Catholic teaching, a central stream of Christian sexual ethics, holds that marital sexuality has two inseparable dimensions: unitive and procreative. The Catechism says human sexuality is naturally ordered to the good of spouses and to the generation and education of children, and other Catholic sources say sex must serve both purposes within marriage. The claim is broadly accurate, but it slightly overgeneralizes 'Christian' ethics because it is specifically Catholic teaching and does not deny the unitive purpose.", "sources": [{"title": "Catechism of the Catholic Church - United States Conference ...", "url": "https://www.usccb.org/sites/default/files/flipbooks/catechism/567/"}, {"title": "Theology of the Body and the Sexual Ethic - Catholic Exchange", "url": "https://catholicexchange.com/theology-of-the-body-and-the-sexual-ethic/"}, {"title": "Catholic Teaching on Sexual Sin - Real Clear Catholic", "url": "https://realclearcatholic.com/2023/09/12/catholic-teaching-on-sexual-sin/"}], "t": 5080, "clip": "clips/claim_086_5078660_5083730.mp4"}, {"claim": "According to Christian sexual ethics, using a condom or contraceptive methods is wrong even if the woman has gone through menopause.", "quote": "it's wrong to use a condom or contraceptive methods, even if the woman has gone through menopause", "start": 5082.84, "end": 5087.5, "category": "Other", "section": "Intro", "id": 87, "llm_start": 5082.4, "llm_end": 5087.8, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "Catholic teaching does prohibit artificial contraception, including condoms, as intrinsically wrong and requires each marital act to remain open to life, so the core idea matches a major Christian tradition ([2],[3]). But the statement overgeneralizes to “Christian sexual ethics”—many Christian churches permit contraception—and the cited sources do not specifically establish the menopause scenario.", "sources": [{"title": "Humanae Vitae (July 25, 1968) - Vatican", "url": "https://www.vatican.va/content/paul-vi/en/encyclicals/documents/hf_p-vi_enc_25071968_humanae-vitae.html"}, {"title": "Catholic Teaching on Contraception Explained", "url": "https://www.catholicchurchtimes.com/explainers/what-does-the-catholic-church-teach-about-contraception"}], "t": 5082, "clip": "clips/claim_087_5080840_5089500.mp4"}, {"claim": "According to Christian sexual ethics, IVF is wrong because it is procreation without the couple bond.", "quote": "something like IVF is wrong. according to Christian sexual ethics because it is procreation without the bond couple", "start": 5093.05, "end": 5097.46, "category": "Other", "section": "Intro", "id": 88, "llm_start": 5092.6, "llm_end": 5098.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The claim tracks a major traditional Christian—especially Catholic—sexual ethic: the Catechism and Vatican instruction oppose IVF because it separates procreation from the conjugal/marital act (10, 15), and the USCCB calls IVF immoral (9). But “Christian sexual ethics” is not monolithic; some Protestant/evangelical ethicists permit IVF within marriage under strict limits (7), and others treat it as a live debate (3), so the statement overgeneralizes if taken as all Christian ethics.", "sources": [{"title": "What is the Catholic Church’s position on IVF?", "url": "https://ewtn.co.uk/article-what-is-the-catholic-churchs-position-on-ivf/"}, {"title": "Instruction on respect for human life - Vatican", "url": "https://www.vatican.va/roman_curia/congregations/cfaith/documents/rc_con_cfaith_doc_19870222_respect-for-huma . Source [6] gives Pornhub traffic volume without a comparison, and the other sources do not establish the 'combined' claim or define 'clicks.' The stronger combined claim is therefore not supported by the provided evidence.", "sources": [{"title": "Turns out Pornhub gets more visitors per month than Netflix, and I'm ...", "url": "https://happymag.tv/pornhub-gets-more-visitors-per-month-than-netflix/"}, {"title": "pornhub.com Website Traffic, Ranking, Analytics [September 2026]", "url": "https://www.semrush.com/website/pornhub.com/overview/"}], "t": 6318, "clip": "clips/claim_106_6316970_6323850.mp4"}, {"claim": "According to the speaker, 90% of creators do not have the experience of being a well-paid creator.", "quote": "You are a well-paid creator. This is not the experience of 90% of creators", "start": 6548.83, "end": 6553.59, "category": "Statistics", "section": "Intro", "id": 107, "llm_start": 6548.8, "llm_end": 6553.6, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The quoted statistic is broadly consistent with creator-income data: one source estimates only 5–10% of creators reach sustainable full-time income, leaving 90–95% earning supplemental, token, or no income. Other data show only about 4% earn over $100,000 and the top 10% capture most payments, though “well-paid” and the exact 90% threshold are imprecise.", "sources": [{"title": "Why 90% of Creators Fail (And the Few Who Don't) | Culture", "url": "https://whennotesfly.com/culture/creator-economy-media-culture/why-most-creators-fail"}, {"title": "Content Creator Income Statistics 2026: Earnings by Platform ...", "url": "https://autofaceless.ai/blog/content-creator-income-statistics-2026"}, {"title": "Top 10% of Creators Earned 62% of Payments in 2025 as Creator ...", "url": "https://www.creatoriq.com/press/releases/state-of-creator-compensation-"}], "t": 6548, "clip": "clips/claim_107_6546830_6555590.mp4"}], "colors": {"True": "#22c55e", "Mostly true": "#84cc16", "M <script>
const D=JSON.parse(document.getElementById('data').textContent),M=D.meta,C=D.colors;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const verdicts=Object.keys(C),active=new Set(verdicts);
const cats=[...new Set(D.items.map(i=>i.category))].sort();
const app=document.getElementById('app');
app.innerHTML=`${D.banner?`<div class="banner">${esc(D.banner)}</div>`:''}
<h1>${esc(M.title)}</h1><div class="chan">${esc(M.channel||'')} · <a href="${esc(M.webpage_url||('https://www.youtube.com/watch?v='+M.id))}" target="_blank" rel="noopener">Watch on YouTube</a>${M.duration?' · '+fmt(M.duration):''}</div>
<details class="desc"><summary>Video description</summary><pre>${esc(M.description||'(none)')}</pre></details>
<div class="summary">${verdicts.map(v=>`<div class="stat" data-v="${esc(v)}" style="border-top:4px solid ${C[v]}"><b>${D.items.filter(i=>i.verdict===v).length}</b>${esc(v)}</div>`).join('')}
<div class="stat" style="cursor:default"><b>${D.items.length}</b>Total claims</div></div>
<div class="controls"><input type="search" id="q" placeholder="Search claims, quotes, explanations…">
<select id="cat"><option value="">All categories</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
<select id="grp"><option value="cat">Group: category → section</option><option value="sec">Group: section → category</option><option value="time">Chronological</option></select></div>
<div id="list"></div><div class="foot">Verdicts are machine-generated (LLM + web search) and may be wrong. Check sources yourself.</div>`;
function media(i){
  if(i.clip)return `<video controls preload="metadata" src="${esc(i.clip)}"></video>`;
  const th=M.id?`https://i.ytimg.com/vi/${M.id}/hqdefault.jpg`:'';
  return `<div class="ph" data-t="${i.t}" style="background-image:url('${th}')"><span>▶ Play from ${fmt(i.t)}</span></div>`;
}
function card(i){
  const url=`https://www.youtube.com/watch?v=${M.id}&t=${i.t}s`;
  return `<div class="claim" style="--vc:${C[i.verdict]||'#94a3b8'}"><div>
  <span class="badge">${esc(i.verdict)}</span><a class="ts" href="${url}" target="_blank" rel="noopener">⏱ ${fmt(i.start)}–${fmt(i.end)}</a>
  <span class="ts" style="color:var(--muted)"> · ${esc(i.category)} · ${esc(i.section)}</span>
  <div class="ctext">${esc(i.claim)}</div>${i.quote?`<div class="quote">“${esc(i.quote)}”</div>`:''}
  <div>${esc(i.explanation)}</div>
  ${(i.sources||[]).length?`<ol class="src">${i.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a></li>`).join('')}</ol>`:'<div class="src" style="color:var(--muted)">No sources retrieved.</div>'}
  </div><div class="media">${media(i)}</div></div>`;
}
function group(arr,k){const m=new Map();arr.forEach(i=>{if(!m.has(i[k]))m.set(i[k],[]);m.get(i[k]).push(i)});return m}
const secOrder=t=>{const i=D.sections.findIndex(s=>s.title===t);return i<0?1e9:i};
function draw(){
  const q=document.getElementById('q').value.toLowerCase(),cat=document.getElementById('cat').value,g=document.getElementById('grp').value;
  const f=D.items.filter(i=>active.has(i.verdict)&&(!cat||i.category===cat)&&(!q||[i.claim,i.quote,i.explanation,i.section,i.category].join(' ').toLowerCase().includes(q)));
  const L=document.getElementById('list');
  if(!f.length){L.innerHTML='<div class="empty">No claims match the current filters.</div>';return}
  if(g==='time'){L.innerHTML=f.map(card).join('');return}
  const [k1,k2]=g==='cat'?['category','section']:['section','category'];
  const keys1=[...group(f,k1).entries()].sort((a,b)=>k1==='section'?secOrder(a[0])-secOrder(b[0]):a[0].localeCompare(b[0]));
  L.innerHTML=keys1.map(([a,arr])=>`<h2>${esc(a)} <span style="color:var(--muted);font-size:14px">(${arr.length})</span></h2>`+
    [...group(arr,k2).entries()].sort((x,y)=>k2==='section'?secOrder(x[0])-secOrder(y[0]):x[0].localeCompare(y[0]))
    .map(([b,arr2])=>`<h3>${esc(b)}</h3>`+arr2.map(card).join('')).join('')).join('');
}
document.querySelectorAll('.stat[data-v]').forEach(el=>el.onclick=()=>{const v=el.dataset.v;active.has(v)?active.delete(v):active.add(v);el.classList.toggle('off');draw()});
['q','cat','grp'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
document.getElementById('list').addEventListener('click',e=>{const p=e.target.closest('.ph');if(!p)return;
  p.outerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${M.id}?start=${p.dataset.t}&autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`});
draw();
</script></body></html>
