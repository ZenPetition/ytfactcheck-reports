xploring masculinity: do dating apps fuel incel communities ...", "url": "https://blog.acma-association.com/exploring-masculinity-do-dating-apps-fuel-incel-communities-the-rising-threat-of-lonely-men-in-todays-society/"}], "t": 210, "clip": "clips/claim_015_208240_217020.mp4"}, {"claim": "When people talk about the male loneliness epidemic, they are not talking about 40-year-old married men with kids.", "quote": "When people talk about the male loneliness epidemic, they're not talking about some 40 year old married guy with kids", "start": 265.42, "end": 269.74, "category": "Other", "section": "Intro", "id": 16, "llm_start": 265.4, "llm_end": 270.0, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The sources support the idea that the 'male loneliness epidemic' conversation is primarily framed around unpartnered/younger men and dating-market isolation: [1] describes the discourse as tied to heterosexual romance and male accountability, and [11] finds the largest isolation gaps among never-married men. But the exclusion is not absolute—[2] explicitly discusses the male loneliness epidemic among men in their 40s and beyond, and [10] reports high middle-aged loneliness. So the quote is broadly accurate about the dominant framing but overstated as a blanket 'not talking about' claim.", "sources": [{"title": "A New Era of Dating: What the \"Male Loneliness Epidemic\" Discourse ...", "url": "https://now.org/blog/a-new-era-of-dating-what-the-male-loneliness-epidemic-discourse-signals-about-the-future-of-heterosexual-romance/"}, {"title": "Male loneliness and isolation: What the data shows", "url": "https://aibm.org/research/male-loneliness-and-isolation-what-the-data-shows/"}, {"title": "Male loneliness? You're not the only one | Drinkaware", "url": "https://www.drinkaware.co.uk/news/feeling-lonely-youre-not-the-only-one"}, {"title": "ASU study shows middle-aged Americans are lonelier than ...", "url": "https://news.asu.edu/20240318-health-and-medicine-asu-study-shows-middleaged-americans-are-lonelier-european-peers"}], "t": 265, "clip": "clips/claim_016_263420_271740.mp4"}, {"claim": "The male loneliness epidemic discourse refers to 'invisible men' who sit around gaming all day and have no access to women.", "quote": "They're talking about this idea of these like invisible men who are sitting around all day gaming. They have like no access to women", "start": 270.02, "end": 274.95, "category": "Other", "section": "Intro", "id": 17, "llm_start": 270.0, "llm_end": 275.2, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The male-loneliness discussion is broader than this caricature: it traces to the 2023 Surgeon General advisory on loneliness/isolation and covers social disconnection, community erosion, digital overstimulation, shrinking friendships, and related factors [2][3]. Gaming is discussed as one possible contributor to loneliness and also as a potential source of community, not as the defining image of “invisible men” with “no access to women” [1][7][14]. The quote is therefore an overgeneralized stereotype about part of the discourse, not an accurate description of what the discourse refers to as a whole.", "sources": [{"title": "Male Loneliness Epidemic: Why Are Men So Lonely?", "url": "https://gamequitters.com/male-loneliness-epidemic/"}, {"title": "Male Loneliness Epidemic: What Is It and What Can We Do About ...", "url": "https://www.modernintimacy.com/male-loneliness-epidemic/"}, {"title": "A New Era of Dating: What the “Male Loneliness Epidemic ...", "url": "https://now.org/blog/a-new-era-of-dating-what-the-male-loneliness-epidemic-discourse-signals-about-the-future-of-heterosexual-romance/"}, {"title": "Can Online Games Help Solve The Male Loneliness Epidemic?", "url": "https://today.tamu.edu/news/2025/01/13/can-online-games-help-solve-the-male-loneliness-epidemic/"}, {"title": "Can Online Games Help Solve The Male Loneliness Epidemic?", "url": "https://s d": 414.42, "category": "Technology", "section": "Intro", "id": 26, "llm_start": 410.0, "llm_end": 414.4, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The claim that OnlyFans only requires users to state they are 18 is contradicted by evidence that creators must submit government-issued photo ID and a real-time selfie, and that fans in regulated jurisdictions must also complete age verification. Third-party guides and Ofcom's investigation/closure indicate meaningful age-assurance measures rather than simple self-declaration. A child cannot merely type “18” to gain full access or earning ability.", "sources": [{"title": "OnlyFans Age Verification: What Actually Works? [2024 Data ...", "url": "https://www.pseudoface.com/guides/platforms-account-ops/onlyfans-ops/onlyfans-age-verification-guide"}, {"title": "OnlyFans Age Verification: What Creators & Subscribers Need ...", "url": "https://www.onlyseeka.com/blog/onlyfans-age-verification-guide-v2"}, {"title": "OnlyFans Age Requirement: How Old Do You Have to Be? (2026)", "url": "https://fanchecked.com/blog/onlyfans-age-requirement"}, {"title": "OnlyFans Verification: A Data-Backed Guide for Creators and ...", "url": "https://www.pseudoface.com/guides/platforms-account-ops/onlyfans-ops/onlyfans-verification-faq"}, {"title": "Under Age Access to OnlyFans? Ofcom Says No. - The Village Voice", "url": "https://www.villagevoice.com/under-age-access-to-onlyfans-ofcom-says-no/"}], "t": 409, "clip": "clips/claim_026_407980_416420.mp4"}, {"claim": "All kids lie about their age online.", "quote": "All kids lie, all kids lie about that.", "start": 414.42, "end": 416.3, "category": "Statistics", "section": "Intro", "id": 27, "llm_start": 414.4, "llm_end": 416.3, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The claim is an absolute statement that all kids lie about their age online. Sources show only about a third of children with social media profiles used a false adult age in Ofcom research [1][4], and a later BBC-reported survey found 22% of 8–17-year-olds said they lie about being 18 or over [7]. These findings indicate many children do so, but not all.", "sources": [{"title": "A third of children have false social media age of 18+", "url": "https://www.ofcom.org.uk/online-safety/protecting-children/a-third-of-children-have-false-social-media-age-of-18"}, {"title": "A third of children have adult social media accounts - Ofcom", "url": "https://www.bbc.com/news/technology-63204605"}, {"title": "'It's so easy to lie': A fifth of children use fake age on ...", "url": "https://www.bbc.com/news/articles/cn4v52ezx17o"}], "t": 414, "clip": "clips/claim_027_412420_418300.mp4"}, {"claim": "OnlyFans does not require a credit card, and a prepaid gift card bought at Walmart can be used.", "quote": "And they don't even require a credit card. You can buy a prepaid gift card on Walmart.", "start": 416.3, "end": 422.22, "category": "Technology", "section": "Intro", "id": 28, "llm_start": 416.3, "llm_end": 422.2, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "OnlyFans requires a payment card on file, but it does not have to be a credit card; debit and some reloadable prepaid cards can work if they support 3D Secure [1][2]. However, a retail prepaid gift card bought at Walmart is generally not usable because such cards usually lack 3D Secure enrollment, and source 1 also excludes non-reloadable gift cards [1][2][3]. The first clause is broadly accurate, but the specific gift-card assertion is misleading.", "sources": [{"title": "\"Do Prepaid Cards Work On OnlyFans?\" (2026) - CardRates.com", "url": "https://www.cardrates.com/advice/do-prepaid-cards-work-on-onlyfans/"}, {"title": "OnlyFans Payment Methods (2026): What Works, What Doesn't, and Why ...", "url": "https://www.solcard.cc/blog/onlyfans-payment-methods"}, {"title": "OnlyFans Payment Methods - AVPS Accept Credit Cards Online", "url": "https://avpsolutions.com/blog/onlyfans-payment-methods/"}], "t": 416, "clip": "clips/claim_028_414300_424220.mp4"}, {"claim": "Minors are accessing these sites when they should not be.", "quote": "And so kids are accessing these sites when they shouldn't be.", "start": 422.22, "end": 425.18, "category": "Statistics", "section": "Intro", "id": 29, "llm_start": 422.2, "llm_end": 425.2, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Independent research supports the claim: Ofcom data reported by The Guardian found that 8% of UK children aged 8–14 had visited an online pornography site or app in a one-month period. BBC reporting on Ofcom research also found that many children lie about their age to access adult content, and a UK government report documents children circumventing age assurance. The evidence is UK-specific and does not quantify every site, but it confirms that some minors access age-restricted sites they should not be on.", "sources": [{"title": "UK study shows 8% of children aged eight to 14 have viewed ...", "url": "https://www.theguardian.com/society/2025/jun/26/uk-ofcom-study-children-viewing-online-pornography-age-checks"}, {"title": "A third of children have adult social media accounts - Ofcom", "url": "https://www.bbc.co.uk/news/technology-63204605"}, {"title": "hildren’s circumvention behaviours online - GOV.UK", "url": "https://assets.publishing.service.gov.uk/media/6a54e6e92467584757371e1e/DSIT_Childrens_Circumvention_Behaviours_Online_Report_Final.pdf"}], "t": 422, "clip": "clips/claim_029_420220_427180.mp4"}, {"claim": "OnlyFans has stringent identification requirements for creators.", "quote": "All I know is on the creator side is they have very stringent expectations on identification", "start": 430.74, "end": 437.34, "category": "Technology", "section": "Intro", "id": 30, "llm_start": 430.7, "llm_end": 438.5, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "OnlyFans’ official transparency page states that Creator accounts undergo identity verification and rolling secondary selfie checks, with extra cross-checks in high-risk cases [2]. Multiple independent guides also describe government-issued photo ID, selfie/liveness verification, and strict review requirements before creators can receive payouts [1][3][7]. “Stringent” is qualitative, but the underlying identification and verification regime is well supported.", "sources": [{"title": "Age & Identity Verification — OnlyFans", "url": "https://onlyfans.com/transparency-center/verification"}, {"title": "OnlyFans Creator Requirements: Eligibility, Verification, and Rules ...", "url": "https://www.enforcity.com/onlyfans-success/onlyfans-creator-requirements"}, {"title": "OnlyFans Age Verification: What Creators & Subscribers Need (2026 ...", "url": "https://www.onlyseeka.com/blog/onlyfans-age-verification-guide-v2"}, {"title": "OnlyFans Rules and Compliance | Creator Growth Lab", "url": "https://creatorgrowlabs.com/guides/platforms/onlyfans-rules-and-compliance-for-creators/"}], "t": 430, "clip": "clips/claim_030_428740_439340.mp4"}, {"claim": "Stringent identification requirements help stave off trafficking.", "quote": "which I think is good for like staving off things like trafficking and stuff.", "start": 437.34, "end": 440.86, "category": "Politics", "section": "Intro", "id": 31, "llm_start": 436.9, "llm_end": 440.9, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The statement is an empirical causal claim, but the provided sources discuss trafficking victim identification, consent, and safe-harbor practices rather than showing that stringent identification requirements actually reduce trafficking. Sources [1], [2], [5], and [7] do not provide direct evidence for this specific deterrent effect, so the claim remains unsupported rather than established as true or false.", "sources": [{"title": "\"Human Trafficking Victim Identification: Should Consent ...", "url": "https://repository.law.uic.edu/facpubs/6/"}, {"title": "Rigorous Scrutiny of Victim Identification Decisions in ...", "url": "https://www.casemine.com/commentary/uk/rigorous-scrutiny-of-victim-identification-decisions-in-trafficking-cases:-new-precedent-in-sf-v-secretary-of-state-for-the-home-department/view"}, {"title": "Identifying best practices for \"Safe Harbor\" legislation to ...", "url": "https://www.researchgate.net/publication/283445775_Identifying_best_practices_for_Safe_Harbor_legislation_to_protect_child_sex_trafficking_victims_Decriminalization_alone_is_not_sufficient"}, {"title": "Digital Identity's Role in Combating Human Trafficking", "url": "https://washingtoncentre.org/digital-identity-as-a-game-changer-in-the-fight-against-human-trafficking/"}], "t": 437, "clip": "clips/claim_031_435340_442860.mp4"}, {"claim": "The male loneliness epidemic is a subset of a larger loneliness epidemic.", "quote": "I was more so saying it's a subset of a larger loneliness epidemic.", "start": 478.24, "end": 481.32, "category": "Health", "section": "Intro", "id": 32, "llm_start": 478.2, "llm_end": 481.3, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "National and global data document widespread loneliness, and public-health authorities treat it as a broad problem affecting many groups, including men, so men’s loneliness can reasonably be described as part of a larger loneliness epidemic. However, “male loneliness epidemic” is a framing rather than a formally measured subset, and Pew found that men do not report feeling lonely more often than women, so the exact “subset” characterization is interpretive rather than directly established.", "sources": [{"title": "Loneliness Statistics 2026: Prevalence and Health", "url": "https://psychology.com/loneliness-statistics/"}, {"title": "PDF Men, Women and Social Connections - Pew Research Center", "url": "https://www.pewresearch.org/wp-content/uploads/sites/20/2025/01/ST_2024.1.16_social-connections_REPORT.pdf"}, {"title": "Loneliness, Lack of Social and Emotional Support, ...", "url": "https://www.cdc.gov/mmwr/volumes/73/wr/mm7324a1.htm"}, {"title": "Prevalence of Loneliness States Among the U.S. Adult Population ...", "url": "https://www.ajpmonline.org/article/S0749-3797(25)00426-X/fulltext"}], "t": 478, "clip": "clips/claim_032_476240_483320.mp4"}, {"claim": "The male loneliness epidemic exists to the same extent as a female loneliness epidemic.", "quote": "And I think it exists as much as a female loneliness epidemic.", "start": 481.32, "end": 484.04, "category": "Health", "section": "Intro", "id": 33, "llm_start": 481.3, "llm_end": 484.0, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Survey evidence generally shows loneliness prevalence is similar for men and women: Pew found 16% of men and 15% of women felt lonely “all” or “most” of the time. Other large studies complicate an exact equivalence—BBC data found men somewhat lonelier, while some pandemic-era surveys found women lonelier—so “same extent” is broadly but not precisely supported. The word “epidemic” is also rhetorical rather than a strictly defined measure.", "sources": [{"title": "Pew Study Finds Women and Men Experience Loneliness at ...", "url": "https://goodfaithmedia.org/pew-study-finds-women-and-men-experience-loneliness-at-similar-rates/"}, {"title": "Loneliness around the world: Age, gender, and cultural ...", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC7768187/"}, {"title": "Female and male loneliness epidemics. - bridge dissemination", "url": "https://bridgepsych.info/female-and-male-loneliness-epidemic/"}, {"title": "Loneliness Statistics: By Country, Demographics & More", "url": "https://www.rootsofloneliness.com/loneliness-statistics"}], "t": 481, "clip": "clips/claim_033_479320_486040.mp4"}, {"claim": "Society tends to attribute female shortcomings to biology or hardwiring.", "quote": "they tend to code any sort of female shortcoming as being biological or hardwired.", "start": 487.87, "end": 492.8, "category": "Other", "section": "Intro", "id": 34, "llm_start": 487.6, "llm_end": 492.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Source [2] documents a longstanding pattern of biological determinism that cast women as “naturally” nurturing, emotional, or passive and framed gender roles as natural rather than constructed, supporting the core claim. Sources [1] and [3] show that biology and culture interact and that universal “feminine nature” claims are dubious, but they do not measure how often society attributes female shortcomings to biology. The general tendency is therefore supported, though the absolute wording “any sort” is an overstatement.", "sources": [{"title": "Is Gender Really a Social Construct? Biology vs Society", "url": "https://scienceinsights.org/is-gender-really-a-social-construct-biology-vs-society/"}, {"title": "The Role of Biology in Gender Identity and Social Constructs", "url": "https://sociology.institute/sociology-of-gender/role-biology-gender-identity-social-constructs/"}, {"title": "What Is the Feminine? Biology, Evolution, and Society", "url": "https://scienceinsights.org/what-is-the-feminine-biology-evolution-and-society/"}], "t": 487, "clip": "clips/claim_034_485870_494800.mp4"}, {"claim": "People in the manosphere say women have no hobbies.", "quote": "the man a sphere or people will say, oh, it's just because women have no hobbies", "start": 496.91, "end": 499.87, "category": "Other", "section": "Intro", "id": 35, "llm_start": 496.6, "llm_end": 500.1, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Source 1 directly lists “Women have no hobbies” among manosphere-style claims, and source 2 shows an online comment echoing the same idea. The broader manosphere is documented as promoting misogynistic and anti-feminist rhetoric, so this is fair as a recurring trope, though the sources do not show that every manosphere participant says it.", "sources": [{"title": "Kingston School of Art - Kingston University", "url": "https://ksashow2023.kingston.ac.uk/students/maisie-lesbirel/"}, {"title": "/snow/ - Trad Thots #13- Unacomplished and raging", "url": "https://lolcow.farm/snow/res/1870608.html"}, {"title": "Manosphere - Wikipedia", "url": "https://en.wikipedia.org/wiki/Manosphere"}], "t": 496, "clip": "clips/claim_035_494910_501870.mp4"}, {"claim": "People attribute men's excessive porn use to societal disorder, disenfranchisement, and a misandrous culture.", "quote": "this is because society's disorder, this man's being disenfranchised, he's disillusioned. He's been the victim, again, of a very misandrous culture", "start": 504.52, "end": 511.36, "category": "Other", "section": "Intro", "id": 36, "llm_start": 504.5, "llm_end": 511.4, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The provided sources discuss excessive pornography use mainly in relation to stress, anxiety, depression, and compulsive behavior, not societal disorder, disenfranchisement, or a “misandrous culture” [1][2]. The quoted line may show one participant’s rhetorical characterization, but the sources do not establish that people generally attribute men’s excessive porn use to those causes. The claim is therefore insufficiently supported as a general factual assertion.", "sources": [{"title": "Pornography Consumption and Cognitive-Affective Distress - PMC", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10399954/"}, {"title": "Pornography Consumption and Cognitive-Affective Distress", "url": "https://www.ovid.com/jnls/jonmd/fulltext/10.1097/nmd.0000000000001669~pornography-consumption-and-cognitive-affective-distress"}], "t": 504, "clip": "clips/claim_036_502520_513360.mp4"}, {"claim": "When women are underrepresented in STEM, people say it is because women are not interested in hard sciences.", "quote": "when women, for instance, don't fulfill STEM positions or they fall behind in particular verticals, we say this is because women are just not interested in hard sciences", "start": 515.55, "end": 523.0, "category": "Other", "section": "Intro", "id": 37, "llm_start": 514.8, "llm_end": 523.0, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The provided sources document women’s underrepresentation in STEM and discuss possible structural and cultural factors, but none reports data on what explanation “people” commonly give for the gap. The statement is a broad characterization of public discourse rather than a specific finding confirmed by the cited evidence, so it cannot be verified here.", "sources": [{"title": "STEM Workforce Statistics 2026 | National Girls Collaborative ...", "url": "https://ngcproject.org/resources/stem-statistics-workforce"}, {"title": "Global patterns of gender disparities in STEM and ... - NatureThe Gender Gap in STEM | MIT Professional EducationLessons learned from the underrepresentation of women in STEM ...The lost potential in STEM: Why women are still left behind", "url": "https://www.nature.com/articles/s44159-024-00380-3"}], "t": 515, "clip": "clips/claim_037_513549_525000.mp4"}, {"claim": "Men dropping out of college is attributed to a misandrous culture rather than laziness.", "quote": "if men, for instance, drop out of college and they're not doing it, we don't attribute it to laziness, we again attribute it to some sort of misandrous culture", "start": 523.19, "end": 528.96, "category": "Other", "section": "Intro", "id": 38, "llm_start": 523.0, "llm_end": 529.0, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The claim is a broad assertion about how society explains men dropping out of college, but the provided sources do not document any general attribution to a “misandrous culture.” They instead describe multiple factors such as economic pressures, digital culture, disengagement, mental health, and structural issues, while source [1] notes that dropout can superficially look like laziness. The specific “misandrous culture rather than laziness” framing is therefore an opinion/unsupported generalization, not verifiable from these sources.", "sources": [{"title": "Why so many men suddenly seem emotionally, socially, and ...", "url": "https://www.fodmapeveryday.com/why-so-many-men-suddenly-seem-emotionally-socially-and-economically-checked-out/"}, {"title": "Why Young Men Are Struggling in the Modern World", "url": "https://johnmurphymedia.substack.com/p/why-young-men-are-struggling-in-the"}, {"title": "Why American Men Think It’s Not Worth Going to College ...", "url": "https://www.bloomberg.com/news/features/2025-04-21/why-american-men-think-it-s-not-worth-going-to-college-anymore"}, {"title": "COE - Status Dropout Rates - National Center for Education Statistics ...", "url": "https://nces.ed.gov/programs/coe/indicator/coj/status-dropout-rates"}], "t": 523, "clip": "clips/claim_038_521190_530960.mp4"}, {"claim": "There are two different standards that the genders are expected to reach in society.", "quote": "there's like two different standards that the genders are expected to reach in society", "start": 534.45, "end": 538.0, "category": "Other", "section": "Intro", "id": 39, "llm_start": 533.6, "llm_end": 538.0, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Multiple independent sources document distinct behavioral, emotional, professional, and sexual expectations applied to men and women, commonly described as gender-based double standards. A 62-country study and a meta-analysis provide cross-national and empirical support for gendered double standards, while sociological work defines gender norms as different acceptable actions for women and men. The claim is broad, and standards vary by domain, but the core assertion is well supported.", "sources": [{"title": "Double Standards For Men And Women Why Do They Exist", "url": "https://progradelist.com/more/double-standards-for-men-and-women-why-do-they-exist"}, {"title": "Gender norms and social norms: differences, similarities and ...", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC7028109/"}, {"title": "How Rigid Gender Roles Create Stress - Psychology Today", "url": "https://www.psychologytoday.com/us/blog/pop-culture-mental-health/202502/the-double-standard-in-heteronormative-relationships"}, {"title": "Data from 62 countries provides evidence for a double ...", "url": "https://www.psypost.org/data-from-62-countries-provides-evidence-for-a-double-standard-in-gender-rules/"}, {"title": "He is a Stud, She is a Slut! A Meta-Analysis on the Continued ...", "url": "https://journals.sagepub.com/doi/full/10.1177/1088868319891310"}], "t": 534, "clip": "clips/claim_039_532450_540000.mp4"}, {"claim": "Men's suicide rate is 3.5 to 5% higher than women's.", "quote": "the men's suicide rate is 3.5 to 5% higher than women", "start": 551.61, "end": 556.4, "category": "Statistics", "section": "Intro", "id": 40, "llm_start": 549.4, "llm_end": 556.4, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The sources consistently show that men's suicide rate is roughly 3 to 4 times (or 3.5 times in the US) that of women — i.e., several hundred percent higher, not 3.5–5% higher. Source [1] notes men die by suicide about 1.7–1.8 times more globally and 3–4 times more in the Western world; [4] and [5] put the US ratio at about 3.5 times. The statement appears to conflate \"times\" with \"percent,\" understating the gap by roughly two orders of magnitude.", "sources": [{"title": "Gender differences in suicide - Wikipedia", "url": "https://en.wikipedia.org/wiki/Gender_differences_in_suicide"}, {"title": "Suicide rates are higher in men than women - Our World in Data", "url": "https://ourworldindata.org/data-insights/suicide-rates-are-higher-in-men-than-women"}, {"title": "Suicide death rates by gender U.S. 1950-2024 | Statista", "url": "https://www.statista.com/statistics/187478/death-rate-from-suicide-in-the-us-by-gender-since-1950/"}, {"title": "Why more men than women die by suicide - BBC", "url": "https://www.bbc.com/future/article/20190313-why-more-men-kill-themselves-than-women"}], "t": 551, "clip": "clips/claim_040_549610_558400.mp4"}, {"claim": "Men make up 80% of suicides in the U.S. each year.", "quote": "they make up for 80% of suicides in the U.S. alone per year", "start": 556.62, "end": 560.36, "category": "Statistics", "section": "Intro", "id": 41, "llm_start": 556.4, "llm_end": 560.4, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Independent fact-checking and suicide-prevention sources indicate that men have accounted for about 80% of U.S. suicide deaths, with the male rate roughly four times the female rate. The precise percentage is rounded and varies slightly year to year, so the claim is broadly accurate but not exact.", "sources": [{"title": "Fact check: Men accounted for about 80% of US suicides in 2021", "url": "https://www.usatoday.com/story/news/factcheck/2022/12/06/fact-check-men-accounted-80-us-suicides-2021/10838683002/"}, {"title": "Suicide statistics in the United States - SAVE: Suicide ...", "url": "https://www.save.org/learn/suicide-statistics/"}], "t": 556, "clip": "clips/claim_041_554620_562360.mp4"}, {"claim": "There is a men's mental health crisis.", "quote": "There is a men's mental health crisis", "start": 560.36, "end": 563.24, "category": "Health", "section": "Intro", "id": 42, "llm_start": 560.4, "llm_end": 563.2, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The claim is a broad characterization, but independent sources support a serious men's mental health problem: NIMH notes men are more likely to die by suicide and less likely to receive treatment, and Psychology Today explicitly describes a 'silent crisis' involving elevated suicide and substance abuse plus low service use. CDC-derived statistics also show the male suicide rate at roughly four times the female rate. 'Crisis' is partly evaluative, but the underlying disparities substantiate the statement.", "sources": [{"title": "Men and Mental Health - National Institute of Mental Health (NIMH)", "url": "https://www.nimh.nih.gov/health/topics/men-and-mental-health"}, {"title": "Men's Mental Health: A Silent Crisis - Psychology Today", "url": "https://www.psychologytoday.com/us/blog/talking-about-men/201702/mens-mental-health-silent-crisis"}, {"title": "Male Suicide Statistics: Why Men Are at Higher Risk", "url": "https://mhstats.org/blog/male-suicide-statistics/"}], "t": 560, "clip": "clips/claim_042_558360_565240.mp4"}, {"claim": "Pride Month took over men's mental health months.", "quote": "Pride Month took over men's mental health months", "start": 568.02, "end": 571.48, "category": "Other", "section": "Intro", "id": 43, "llm_start": 566.2, "llm_end": 571.5, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "June is simultaneously Pride Month and Men’s Mental Health Month, so Pride did not formally replace or “take over” the men’s observance. Several commentaries do note that Pride receives much more visibility and that men’s mental health is often overlooked, so the claim reflects a real attention imbalance but overstates it as a takeover.", "sources": [{"title": "Men's Mental Health Month vs. Pride: June’s Conflict", "url": "https://www.trillmag.com/culture/mens-mental-health-month-vs-pride-junes-unnecessary-conflict/"}, {"title": "Men’s Mental Health Month and Pride Month: Overlapping ...", "url": "https://thelhwriting.wordpress.com/2024/06/22/mens-mental-health-month-and-pride-month-overlapping-importance/"}, {"title": "June Is Not Just Pride Month — It’s Also Men’s Mental Health ...", "url": "https://medium.com/change-your-mind/june-is-not-just-pride-month-its-also-men-s-mental-health-awareness-month-dbb9cad3a08b"}, {"title": "Men's Health Month - Celebrated Each June", "url": "https://mensheal rue", "explanation": "Multiple independent sources describe purity culture as a prominent, widespread movement that began in the 1990s within Christianity and extended beyond religious communities. Source 1 calls it a youth-focused movement prominent in American Christian communities, while sources 3 and 4 describe it as widespread and culturally influential. The colloquial claim that it was “a huge thing” is broadly supported.", "sources": [{"title": "Purity culture - Wikipedia", "url": "https://en.wikipedia.org/wiki/Purity_culture"}, {"title": "Purity Culture and Its Effect on Mental Health - Verywell Mind", "url": "https://www.verywellmind.com/purity-culture-impacts-mental-health-7564315"}, {"title": "(053) Being Pure and Being Ashamed: the Role of Purity Culture in ...", "url": "https://academic.oup.com/jsm/article/22/Supplement_1/qdaf068.049/8119612"}], "t": 1882, "clip": "clips/claim_136_1880950_1886550.mp4"}, {"claim": "Christians have opposed anything outside a biblical sex ethic since Christianity began.", "quote": "Ever since Christianity started, they have been against anything outside of biblical sex ethic.", "start": 1900.95, "end": 1906.79, "category": "History", "section": "Intro", "id": 137, "llm_start": 1902.9, "llm_end": 1905.5, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The claim is an overbroad historical generalization. Source [5] notes that the Bible itself contains diverse views on sexuality, marriage, celibacy, and the body, while [13] describes at least two opposing early Christian currents—one upholding marriage and family, another rejecting all sexuality including within marriage. Source [2] further argues that early Christian sexual morality was substantially shaped by Greco-Roman pagan ethics rather than a single fixed “biblical” ethic, so the absolute “anything outside” framing is not supported.", "sources": [{"title": "Regulating Sex in the Roman Empire: Ideology, the Bible, and the early ...", "url": "https://bmcr.brynmawr.edu/2018/2018.05.48"}, {"title": "13 - Sexuality in Christian Traditions - Cambridge University Press ...", "url": "https://www.cambridge.org/core/books/cambridge-world-history-of-sexualities/sexuality-in-christian-traditions/07CA33BE8FBD95EFF5510096748C4BB0"}, {"title": "Sexual Defilement in Early Christian Texts | Purity ...", "url": "https://academic.oup.com/book/12585/chapter/162419755"}], "t": 1900, "clip": "clips/claim_137_1898950_1908790.mp4"}, {"claim": "In Roman times, slaves were used for sex.", "quote": "I mean, you can even go back to Roman times where Romans, like slaves were just used for sex.", "start": 1906.79, "end": 1913.63, "category": "History", "section": "Intro", "id": 138, "llm_start": 1906.8, "llm_end": 1913.6, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The sources confirm that enslaved people in ancient Rome were subject to sexual exploitation and could be used for sex by their owners. Source 2 notes that a Roman could exploit his own slaves sexually, while source 1 lists sexual exploitation among the abuses slaves could legally face. Historical scholarship in sources 3 and 6 also discusses enslaved women and boys as sexual objects in Roman society.", "sources": [{"title": "Slavery in ancient Rome - Wikipedia", "url": "https://en.wikipedia.org/wiki/Slavery_in_ancient_Rome"}, {"title": "Sexuality in ancient Rome - Wikipedia", "url": "https://en.wikipedia.org/wiki/Sexuality_in_ancient_Rome"}, {"title": "Slavery and sexuality in classical antiquity – Bryn Mawr ...", "url": "https://bmcr.brynmawr.edu/2022/2022.03.42/"}, {"title": "Witnesses and Participants in the Shadows: The Sexual Lives ...", "url": "https://www.researchgate.net/publication/282409274_Witnesses_and_Participants_in_the_Shadows_The_Sexual_Lives_of_Enslaved_Women_and_Boys"}], "t": 1906, "clip": "clips/claim_138_1904790_1915630.mp4"}, {"claim": "Sex with slaves was considered a normal/natural practice in Roman society.", "quote": "And that was just a normal natural thing that the Romans did in their society.", "start": 1913.63, "end": 1918.23, "category": "History", "section": "Intro", "id": 139, "llm_start": 1913.6, "llm_end": 1918.2, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Independent sources broadly confirm that free Roman men could have sex with slaves and that this was legally permitted and socially tolerated; one source calls it “entirely permitted” and “generally considered completely acceptable,” and another notes an expectation that slaves would be sexually active. The phrase “normal/natural” is somewhat too absolute, since Roman norms still prized moderation and could stigmatize excess, and tolerance was not the same as unqualified moral approval.", "sources": [{"title": "Sexuality in ancient Rome - Wikipedia", "url": "https://en.wikipedia.org/wiki/Sexuality_in_ancient_Rome"}, {"title": "Roman Household Intimacy - History Cooperative", "url": "https://historycooperative.org/roman-household-intimacy/"}, {"title": "Roman love - Works in Progress Magazine", "url": "https://worksinprogress.co/issue/were-the-romans-tolerant-about-sex/"}, {"title": "Sexual Damage to Slaves in Roman Law (2015) | Matthew J. Perry | 7 ...", "url": "https://scispace.com/papers/sexual-damage-to-slaves-in-roman-law-2h0blpk3j4"}], "t": 1913, "clip": "clips/claim_139_1911630_1920230.mp4"}, {"claim": "Christians opposed the Roman practice of using slaves for sex and got it made illegal/banned.", "quote": "Christians opposed that and actually got that to be made illegal. They banned that.", "start": 1918.23, "end": 1923.27, "category": "History", "section": "Intro", "id": 140, "llm_start": 1918.2, "llm_end": 1923.3, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The cited scholarship indicates early Christians were often complicit in slaveholding and the sexual exploitation of slaves, not that they successfully banned the Roman practice. Source [2] frames early Christian silence as possibly complicity, and [3] describes early Christian complicity in sexual exploitation. Source [7] shows an individual Christian preacher, Chrysostom, condemning sex with slaves, but none of the sources shows Christians getting such sexual use made illegal.", "sources": [{"title": "Slavery and Sexual Availability | The Oxford Handbook of New ...", "url": "https://academic.oup.com/edited-volume/34457/chapter/292372926"}, {"title": "Early Christianity, Slavery, and Women’s Bodies - SpringerSlavery and Roman law (Chapter 19) - The Cambridge World ...Sex, status, and social reproduction (Chapter 7) - Slavery in ...“The Natural Savagery of Slaves”? Slaves as Sexual Aggressors ...Slavery and Sexuality in Classical Antiquity - JSTOR", "url": "https://link.springer.com/content/pdf/10.1057/9780230113893_9.pdf"}, {"title": "Sex, status, and social reproduction (Chapter 7) - Slavery in ...", "url": "https://www.cambridge.org/core/books/slavery-in-the-late-roman-world-ad-275425/sex-status-and-social-reproduction/29912A0431C5693109F08BAA3BDEE894"}], "t": 1918, "clip": "clips/claim_140_1916230_1925270.mp4"}, {"claim": "Christians have always been opposed to sex work.", "quote": "Christians have always been against it", "start": 1923.27, "end": 1924.99, "category": "History", "section": "Intro", "id": 141, "llm_start": 1923.3, "llm_end": 1925.0, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The sources support that biblical texts and Catholic social teaching have strongly condemned prostitution ([12], [13]), and many Christians oppose normalizing sex work ([4]). But the absolute claim that Christians have “always” been opposed is too sweeping: early Christian texts obscure the presence of prostitutes in Christ-believing communities ([5]), and Christian reformers such as Josephine Butler engaged with prostitutes out of compassion rather than simple blanket opposition ([8]). No source establishes uniform ts and figures: Ending violence against women | UN Women ...", "url": "https://www.unwomen.org/en/articles/facts-and-figures/facts-and-figures-ending-violence-against-women"}], "t": 2042, "clip": "clips/claim_151_2040070_2047630.mp4"}, {"claim": "Purity culture globally is a huge source of homicide against women.", "quote": "Purity culture globally is a huge source of homicide against women.", "start": 2049.59, "end": 2053.31, "category": "Other", "section": "Intro", "id": 152, "llm_start": 2049.6, "llm_end": 2053.3, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The sources support arguments that purity culture contributes to sexual violence and rape culture, and UN reports identify honour killings and dowry-related killings among gender-related homicides. However, no source quantifies purity culture as a “huge source” of homicide against women globally, so the broad causal claim is not established by the evidence provided.", "sources": [{"title": "Purity Culture is a Vehicle for Sexual Violence", "url": "https://vajournalia.org/opeds-1/2025/9/30/purity-culture-is-a-vehicle-for-sexual-violence"}, {"title": "Purity cultures and the ideology of ‘bodies as property’ as ...", "url": "https://www.tandfonline.com/doi/full/10.1080/13558358.2025.2525613"}, {"title": "PDF Gender-related killings of women and girls (femicide/feminicide)", "url": "https://www.unodc.org/documents/data-and-analysis/briefs/Femicide_brief_Nov2022.pdf"}, {"title": "Gender-related killings of women and girls (femicide/feminicide ...", "url": "https://www.unwomen.org/en/digital-library/publications/2023/11/gender-related-killings-of-women-and-girls-femicide-feminicide-global-estimates-2022"}, {"title": "Press release: More women and girls killed in 2022 even as overall ...", "url": "https://www.unwomen.org/en/news-stories/press-release/2023/11/press-release-more-women-and-girls-killed-in-2022-even-as-overall-homicide-numbers-fall-says-new-research-from-unodc-and-un-women"}], "t": 2049, "clip": "clips/claim_152_2047590_2055310.mp4"}, {"claim": "There was a specific purity culture movement in America.", "quote": "there was a specific movement in America, purity culture", "start": 2059.76, "end": 2062.71, "category": "History", "section": "Intro", "id": 153, "llm_start": 2059.4, "llm_end": 2064.8, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The sources describe purity culture as a specific Christian youth movement that began in the 1990s and was especially prominent in American evangelical communities. It promoted abstinence before marriage, purity pledges/rings/balls, modest dress, and traditional gender roles. Academic and reference sources confirm this was a recognizable movement in the United States.", "sources": [{"title": "Purity culture - Wikipedia", "url": "https://en.wikipedia.org/wiki/Purity_culture"}, {"title": "What Is Purity Culture? Its History, Critics and Defenders", "url": "https://christianpure.com/learn/purity-culture-guide/"}, {"title": "PDF Perceptions of Purity Messaging on Women and Secular Society", "url": "https://digital.library.unt.edu/ark:/67531/metadc1808407/m2/1/high_res_d/HURD-THESIS-2021.pdf"}], "t": 2059, "clip": "clips/claim_153_2057760_2064710.mp4"}, {"claim": "In the American purity culture movement, people signed a pledge saying they would not have sex before marriage.", "quote": "you would sign a thing saying that you wouldn't have sex before marriage", "start": 2063.0, "end": 2067.11, "category": "History", "section": "Intro", "id": 154, "llm_start": 2062.1, "llm_end": 2067.1, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The claim accurately describes documented American purity-movement pledges: participants, especially teenagers, signed cards pledging sexual abstinence until marriage. Reporting on True Love Waits notes hundreds of thousands of signed purity pledge cards, and academic descriptions confirm the pledge language committed signers to abstinence until marriage.", "sources": [{"title": "True Love Waits Pledges Shown Highly Effective, Other Studies", "url": "https://www.physiciansforlife.org/true-love-waits-pledges-shown-highly-effective/"}, {"title": "SBC’s True Love Waits emphasis impacted millions of teenagers ...", "url": "https://baptistreport.substack.com/p/sbcs-true-love-waits-emphasis-impacted"}, {"title": "TRUE LOVE WAITS: ABSTINENCE EDUCATION IN THE USA", "url": "https://rd.springer.com/content/pdf/10.1007/978-1-4020-6613-9_14.pdf"}, {"title": "30 years later, the evangelical purity movement still impacts ...", "url": "https://wpln.org/post/30-years-later-the-evangelical-purity-movement-still-impacts-sex-education/"}], "t": 2063, "clip": "clips/claim_154_2061000_2069110.mp4"}, {"claim": "Youth pastors taught the purity culture pledge.", "quote": "and a youth pastor taught it.", "start": 2067.11, "end": 2068.51, "category": "History", "section": "Intro", "id": 155, "llm_start": 2067.1, "llm_end": 2068.5, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "The sources substantiate that purity/abstinence pledges were promoted through youth ministries: the True Love Waits campaign was launched by youth pastor Richard Ross in 1993, and former youth ministers describe having preached purity culture themselves. An academic source also says evangelical leaders developed youth ministries around encouraging adolescents to pledge sexual purity. The claim is therefore broadly accurate, though it should not be read as saying every youth pastor did this.", "sources": [{"title": "Critique Purity Culture, but Teach Sexual Ethics to TeensPurity Culture: Untangling the Thread of Shame and Rape ...Why Gen Z Is Rethinking Purity Culture and FaithPurity culture - WikipediaThey grew up in purity culture, then taught it and now want ...A New Purity Culture - First Things", "url": "https://www.thegospelcoalition.org/article/purity-culture-sexual-ethics-teens/"}, {"title": sed' sex worker | Podcast", "url": "https://www.christianpost.com/news/candace-owens-debates-demon-possessed-sex-worker.html"}, {"title": "How porn is destroying society with Candace Owens | Watch - MSN", "url": "https://www.msn.com/en-us/news/other/how-porn-is-destroying-society-with-candace-owens/vi-AA22nzXh"}], "t": 2125, "clip": "clips/claim_158_2123310_2128310.mp4"}, {"claim": "Candace Owens has defended people like Andrew Tate and said they are being unfairly targeted.", "quote": "always defending them and saying like, oh, they're being unfairly targeted", "start": 2130.89, "end": 2133.71, "category": "Biography", "section": "Intro", "id": 159, "llm_start": 2129.9, "llm_end": 2133.7, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Independent reporting confirms that Candace Owens publicly defended Andrew Tate, said she did not believe the rape allegations against him, and suggested such accusations are used to “take them down.” Source 2 explicitly describes her as arguing that Tate was “being unfairly targeted,” and other outlets reported her claiming the charges were made up. The broader plural “people like Andrew Tate” is less specific, but the Tate example is well supported.", "sources": [{"title": "Candace Owens defends Andrew Tate as fresh allegations emerge", "url": "https://www.newsweek.com/candace-owens-defends-andrew-tate-fresh-allegations-emerge-1773209"}, {"title": "Candace Owens' Andrew Tate Defense Doesn't Add Up", "url": "https://m.youtube.com/watch?v=i4MpFO_Iib8"}, {"title": "Candace Owens Defends Andrew Tate After Arrest, Likens Him to Hugh ...", "url": "https://middleeasy.com/entertainment/owens-defends-andrew-tate-arrest-hefner/"}, {"title": "Candace Owens: \"I do not believe that Andrew Tate is a rapist. I don't ...", "url": "https://www.mediamatters.org/candace-owens/candace-owens-i-do-not-believe-andrew-tate-rapist-i-dont-i-think-what-people-accuse"}, {"title": "Candace Owens Declares 'I Don't Think Andrew Tate Is a ... - Mediaite", "url": "https://www.mediaite.com/media/news/candace-owens-declares-i-dont-think-andrew-tate-is-a-rapist-the-same-day-alleged-text-reveals-he-said-he-loves-raping/"}], "t": 2130, "clip": "clips/claim_159_2128890_2135710.mp4"}, {"claim": "The loudest critics of sex work and OnlyFans blame only women, not male contributors to the industry.", "quote": "the loudest critics of things like sex work and only fans, they never put any of the blame on people who are actually male contributors of the industry. It's only to the girls.", "start": 2136.9, "end": 2144.59, "category": "Other", "section": "Intro", "id": 160, "llm_start": 2135.9, "llm_end": 2144.6, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The claim is a broad generalization about how the \"loudest critics\" of sex work and OnlyFans allocate blame, but the provided sources are academic studies on OnlyFans, stigma, labor, and male participation rather than analyses of anti-sex-work advocates' rhetoric. Source [7] addresses male OnlyFans participation, and sources [9] and [10] focus on women, but none establish that critics blame only women or never blame male contributors. The evidence is therefore insufficient to verify the statement.", "sources": [{"title": "Migrant men on OnlyFans: masculinity, precarity, and erotic ...", "url": "https://www.tandfonline.com/doi/full/10.1080/23268743.2026.2692430"}, {"title": "(PDF) The Illusion of Empowerment: OnlyFans and the ...", "url": "https://www.researchgate.net/publication/385289877_The_Illusion_of_Empowerment_OnlyFans_and_the_Subjugation_of_Women"}, {"title": "(PDF) Online Sex Work of Women on OnlyFans: Oppression or ...", "url": "https://www.researchgate.net/publication/385031576_Online_Sex_Work_of_Women_on_OnlyFans_Oppression_or_Empowerment"}], "t": 2136, "clip": "clips/claim_160_2134900_2146590.mp4"}, {"claim": "Michael Knowles said there was a Christian movement that opposed Hugh Hefner, Playboy, and Hustler. e", "explanation": "Sources 5–7 document the historical interaction and collaboration between anti-pornography feminists and conservatives in the 1980s, while source 3 describes ideological links between anti-pornography feminism and religious conservatism. Source 4 also confirms radical anti-pornography advocates were central in feminist sex wars. The claim is broadly supported, though source 1 shows religious and moral opposition was broader than just “tradcons,” and source 10 notes antipornography feminism’s relationship with liberalism, so the wording is somewhat overbroad.", "sources": [{"title": "Opposition to pornography - Wikipedia", "url": "https://en.wikipedia.org/wiki/Opposition_to_pornography"}, {"title": "Ideological Contours of the Contemporary Pornography Debate ...", "url": "https://www.jstor.org/stable/3346819"}, {"title": "Opposition to pornography — Grokipedia", "url": "https://grokipedia.com/page/Opposition_to_pornography"}, {"title": "Rethinking Coalitions: Anti-Pornography Feminists ...", "url": "https://academic.oup.com/socpro/article-abstract/61/2/175/1672018"}, {"title": "SP6102_02_Whittier 175. - JSTOR", "url": "https://www.jstor.org/stable/10.1525/sp.2014.12151"}, {"title": "Home: Smith College | Smith College", "url": "https://www.smith.edu/sites/default/files/media/Faculty/Rethinking+Coalitions+Social+Problems+postprint.pdf"}, {"title": "Beyond Barnard: Liberalism, Antipornography Feminism, and the ...", "url": "https://www.journals.uchicago.edu/doi/full/10.1086/686752"}], "t": 2160, "clip": "clips/claim_162_2158490_2169550.mp4"}, {"claim": "Before OnlyFans, sex work was practically ubiquitous.", "quote": "because it was practically ubiquitous", "start": 2213.83, "end": 2215.27, "category": "Statistics", "section": "Intro", "id": 163, "llm_start": 2213.8, "llm_end": 2215.3, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Historical sources describe commercial sex as a long-running, cross-cultural phenomenon: source 2 frames it as an industry managed through physical geography for roughly five thousand years, and source 6 treats prostitution as a subject of global history. That supports the core point that sex work existed widely long before OnlyFans. However, \"practically ubiquitous\" is a rhetorical overstatement rather than a measured fact, since prevalence and legality varied greatly by time and place.", "sources": [{"title": "A History of Sex as a Business 09 | The Digital Turn: Platforms ...", "url": "https://englishpluspodcast.com/a-history-of-sex-as-a-business-09-the-digital-turn-platforms-algorithms-and-onlyfans/"}, {"title": "PDF ASH 3931: Global History of Prostitution", "url": "https://history.ufl.edu/wp-content/uploads/sites/113/2024/08/ASH3931-Global-History-of-Prostitution-S.-Chang.pdf"}], "t": 2213, "clip": "clips/claim_163_2211830_2217270.mp4"}, {"claim": "About 90% of men watch porn.", "quote": "90% of men are watching it.", "start": 2215.27, "end": 2216.59, "category": "Statistics", "section": "Intro", "id": 164, "llm_start": 2215.3, "llm_end": 2216.6, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The claim is not supported as a present-tense statement about all men. The Barna 2024 data cited in [1] found 78% of men consume pornography to some extent, while [3] notes lifetime exposure is over 80% with some estimates above 90%, but past-year use is roughly 40–70% and weekly use is about half. Figures near 90% fit young adult men or lifetime/adolescent exposure [5][6], not the general male population currently watching porn.", "sources": [{"title": "How many men watch porn? - Covenant Eyes", "url": "https://www.covenanteyes.com/research/how-many-men-watch-porn/"}, {"title": "What Percent of Men Are Addicted to Porn? - ScienceInsights", "url": "https://scienceinsights.org/what-percent-of-men-are-addicted-to-porn/"}, {"title": "Why Do Men Watch Porn [+Viewer Statistics] - Bedbible.com", "url": "https://bedbible.com/why-do-men-watch-porn-statistics/"}, {"title": "The Percentage of Guys Who Watch Porn: What the Data Actually ...", "url": "https://thefrenchblacktype.com/the-percentage-of-guys-who-watch-porn-what-the-data-actually-says-vs-what-we-assume-ajo"}], "t": 2215, "clip": "clips/claim_164_2213270_2218590.mp4"}, {"claim": "Most men go to a strip club for their bachelor party.", "quote": "Most men are going to the strip club for their bachelor party", "start": 2216.59, "end": 2218.85, "category": "Statistics", "section": "Intro", "id": 165, "llm_start": 2216.6, "llm_end": 2219.8, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The claim is partly supported by a survey stating about 69% of bachelor parties involve strippers [3], but that does not establish that most men go to a strip club specifically. Other sources indicate only about 10–20% of American men have visited strip clubs [7][13], and bachelor-party trends include dinner/drinks and non-strip-club activities [1][4]. So the statement overstates and conflates “bachelor parties involving strippers” with “most men going to a strip club.”", "sources": [{"title": "2023's Best Bachelor Party Destinations - Lawn Love", "url": "https://lawnlove.com/blog/best-bachelor-party-destinations/"}, {"title": "What percentage of American men go to stripe clubs?", "url": "https://www.answers.com/sociology/What_percentage_of_American_men_go_to_stripe_clubs"}, {"title": "In Da Club: An Econometric Analysis of Strip Club Patrons", "url": "https://www.academia.edu/4599720/In_Da_Club_An_Econometric_Analysis_of_Strip_Club_Patrons"}, {"title": "'Cancel the Wedding': Internet Divided on Strippers at Bachelor Parties", "url": "https://www.newsweek.com/internet-divided-strippers-bachelor-parties-viral-reddit-1693819"}, {"title": "Why Millennials Aren't into Strippers at Their Bachelor Parties", "url": "https://www.vice.com/en/article/why-millennials-arent-into-strippers-at-their-bachelor-parties/"}], "t": 2216, "clip": "clips/claim_165_2214590_2220850.mp4"}, {"claim": "Christians consume disproportionately more porn.", "quote": "they consume more porn inordinately", "start": 2222.27, "end": 2224.11, "category": "Statistics", "section": "Intro", "id": 166, "llm_start": 2220.8, "llm_end": 2224.1, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The claim is contradicted by the Barna/Beyond the Porn Phenomenon data reported in sources [2], [5], [6], and [8]: 54% of practicing Christians reported consuming pornography at least occasionally, compared with 68% of non-Christians. Although pornography use among Christians is high, the data indicate lower reported use than among non-Christians, not disproportionate overconsumption. Source [1] frames Christian porn use as a crisis, but it does not establish that Christians consume more porn than other groups.", "sources": [{"title": "Christians consuming porn nearly as much as non-Christians - study ...", "url": "https://www.christiantoday.com/news/christians-consuming-porn-nearly-as-much-as-non-christians-study"}, {"title": "Over Half of Practicing Christians Admit They Use Pornography", "url": "https://www.barna.com/trends/over-half-of-practicing-christians-admit-they-use-pornography/"}, {"title": "Majority of practicing Christians admit to viewing porn, many ...", "url": "https://www.christianpost.com/news/majority-of-practicing-christians-admit-to-viewing-porn-study.html"}, {"title": "Majority of Christians feel 'comfortable' watching porn - Premier ...", "url": "https://premierchristian.news/en/news/article/majority-christians-comfortable-watching-porn"}], "t": 2222, "clip": "clips/claim_166_2220270_2226110.mp4"}, {"claim": "Christians go to strip clubs and purchase prostitutes at rates comparable to the general population.", "quote": "they're going to a lot of strip clubs and purchasing prostitutes as well at a pretty high rate, comparable to the rest of the population", "start": 2231.06, "end": 2236.51, "category": "Statistics", "section": "Intro", "id": 167, "llm_start": 2230.3, "llm_end": 2236.5, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The supplied sources examine strip-club attendance and sex buying, but none report religious affiliation or compare Christians with the general population on these behaviors. The claim may be true or false, but the provided evidence does not establish the comparative rates.", "sources": [{"title": "Young Adult Nightclub Participants Who Attend Adult Entertainment Clubs ...", "url": "https://link.springer.com/article/10.1007/s10461-022-03822-2"}, {"title": "In Da Club: An Econometric Analysis of Strip Club Patrons", "url": "https://www.academia.edu/4599720/In_Da_Club_An_Econometric_Analysis_of_Strip_Club_Patrons"}, {"title": "Facts About Men Who Buy Sex - Demand Abolition", "url": "https://www.demandabolition.org/research/facts-men-buy-sex/"}, {"title": "Demographic, Biometric, and Geographic Comparison of Clients of ...", "url": "https://www.researchgate.net/publication/242297883_Demographic_Biometric_and_Geographic_Comparison_of_Clients_of_Prostitutes_and_Men_in_the_US_General_Population"}], "t": 2231, "clip": "clips/claim_167_2229060_2238510.mp4"}, {"claim": "OnlyFans shifted power dynamics and gave female sex workers more control.", "quote": "it shifted was it subverted the power dynamics and gave these women, the female sex workers, more control", "start": 2244.71, "end": 2249.19, "category": "Economics", "section": "Intro", "id": 168, "llm_start": 2244.0, "llm_end": 2249.2, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "The evidence is mixed rather than a clear confirmation. Research finds OnlyFans experiences cannot be explained purely as empowerment or oppression; the two can coexist and vary by workers' motivations (1, 3). Other work notes autonomy and empowerment but also reinforcement of gendered power imbalances (7), and some scholarship critiques the “empowerment” framing as illusory (2). The blanket claim that OnlyFans shifted power dynamics and gave female sex workers more control is therefore oversimplified.", "sources": [{"title": "Online Sex Work of Women on OnlyFans: Oppression or Empowerment?", "url": "https://www.researchgate.net/publication/385031576_Online_Sex_Work_of_Women_on_OnlyFans_Oppression_or_Empowerment"}, {"title": "The Illusion of Empowerment: OnlyFans and the Subjugation of Women", "url": "https://www.researchgate.net/publication/385289877_The_Illusion_of_Empowerment_OnlyFans_and_the_Subjugation_of_Women"}, {"title": "Online Sex Work of Women on OnlyFans: Oppression or Empowerment?", "url": "https://dergipark.org.tr/en/pub/jws/issue/87632/1430686"}, {"title": "\"Then you are forced, although you are not forced\" : A ... - DiVA", "url": "https://www.diva-portal.org/smash/record.jsf?pid=diva2:1892840"}], "t": 2244, "clip": "clips/claim_168_2242710_2251190.mp4"}, {"claim": "OnlyFans made sex work more popular.", "quote": "Onlyfans clearly made it more popular", "start": 2250.35, "end": 2252.06, "category": "Technology", "section": "Intro", "id": 169, "llm_start": 2250.3, "llm_end": 2252.3, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The sources support that OnlyFans greatly expanded the visibility and scale of online sex work: source 1 describes massive user growth and “purchasable intimacy” scaling, Reuters (4) says it fused sex work with the creator economy, and sources 5 and 7 say platforms like OnlyFans made sex work more visible and normalized. However, “more popular” is broad and the causal evidence is indirect, so the claim is best rated mostly true rather than fully true.", "sources": [{"title": "Sex Work Is Scaling - Public DiscourseEpisode 252: OnlyFans and the Rise of Digital Sex WorkRevolutionising digital sex work: an analysis of the impact ...How OnlyFans turned into an empire bent on redefining pornThe platformisation of sex work: 257.27, "end": 2261.31, "category": "Statistics", "section": "Intro", "id": 171, "llm_start": 2256.7, "llm_end": 2261.3, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The data supports a dramatic long-term rise in OnlyFans creator accounts: from 348,000 in 2019 to about 5.06 million by fiscal 2025, roughly a 14-fold increase [2]. The FY2024 figure of 4.63 million was up about 13% year over year, though growth then slowed to about 9% [1][2][9]. “Explosion” is rhetorical, and many accounts may be inactive, but the underlying claim of very large creator growth is broadly accurate.", "sources": [{"title": "OnlyFans Statistics 2026: Creators, Revenue & Top Earners", "url": "https://branditscan.com/onlyfans-statistics"}, {"title": "OnlyFans Creator Statistics: Counts + Economics", "url": "https://onlyfansstatistics.com/creators"}, {"title": "How Many OnlyFans Creators Are There? 5.06M (2026)", "url": "https://onlyguider.com/blog/how-many-onlyfans-creators-are-there/"}, {"title": "OnlyFans Statistics 2024: Full Fiscal Year Breakdown", "url": "https://onlyfansstatistics.com/2024"}], "t": 2257, "clip": "clips/claim_171_2255270_2263310.mp4"}, {"claim": "The speaker identifies as non-trinary and does not fit a spectrum of male, female, and non-binary.", "quote": "I don't fit into like the trinary spectrum of like male, female and non-binary.", "start": 2303.58, "end": 2306.94, "category": "Other", "section": "Intro", "id": 172, "llm_start": 2303.6, "llm_end": 2306.9, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The claim is a self-identification statement based on the quoted line, and the provided sources do not contain that transcript or independently confirm the speaker’s gender identity. Sources like [1] and [5] only provide general context about non-binary identities, so this remains self-reported only and cannot be verified as True or Mostly true here.", "sources": [{"title": "Non-binary - Wikipedia", "url": "https://en.wikipedia.org/wiki/Non-binary"}, {"title": "List of nonbinary identities - Nonbinary Wiki", "url": "https://nonbinary.wiki/wiki/List_of_nonbinary_identities"}], "t": 2303, "clip": "clips/claim_172_2301580_2308940.mp4"}, {"claim": "OnlyFans creators can choose when they clock in and when they clock off.", "quote": "I as an Onlyfans creator can choose when I clock in, when I clock off.", "start": 2321.91, "end": 2325.7, "category": "Technology", "section": "Intro", "id": 173, "llm_start": 2320.7, "llm_end": 2325.7, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "OnlyFans creators are independent workers without fixed shifts, and guides describe them setting their own schedules and routines rather than clocking in for an employer [3][8]. However, the work often bleeds past normal hours, especially because direct messaging and fan engagement can continue after content is posted [1][2], so the freedom to clock off is real but constrained by audience and income pressures.", "sources": [{"title": "How many hours do OnlyFans creators work? (2026) - FanClaw", "url": "https://fanclaw.ai/blog/how-many-hours-do-onlyfans-creators-work"}, {"title": "How Top Earning OnlyFans Creators Actually Spend Their Day", "url": "https://www.fivevagency.com/guides/how-top-earning-onlyfans-creators-spend-their-day/"}, {"title": "A Day in the Life of an OnlyFans Creator: Tips for Success", "url": "https://www.supercreator.app/guides/a-day-in-the-life-of-an-onlyfans-creator"}, {"title": "Analyzing OnlyFans: Transforming Gig Work & Flexible Working ...", "url": "https://www.coursehero.com/file/242043934/Work-org-case-reportpdf/"}], "t": 2321, "clip": "clips/claim_173_2319910_2327700.mp4"}, {"claim": "OnlyFans prohibits configuring meetups off the OnlyFans site, and violators get in trouble.", "quote": "You're actually not even allowed to configure any type of meetup off the Onlyfans site. You'll get in trouble", "start": 2326.9, "end": 2331.39, "category": "Technology", "section": "Intro", "id": 174, "llm_start": 2326.9, "llm_end": 2331.6, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Source 1 states that OnlyFans prohibits arranging offline or in-person meetings through its platform, and that paid sexual services are commonly prohibited. Source 3 adds that terms like “meet” and “meetup” are restricted and can trigger blocks, account reviews, shadowbans, payout freezes, or termination, supporting the claim that violators face consequences.", "sources": [{"title": "Escorts vs OnlyFans Meetups - What's the Difference in 2026?", "url": "https://www.escortsaffair.com/blog/escorts-vs-onlyfans-meetups-whats-the-difference-in-2026"}, {"title": "OnlyFans Banned Words: 2026 Restricted List & Swaps", "url": "https://www.luvi.fans/blog/onlyfans-banned-words/"}], "t": 2326, "clip": "clips/claim_174_2324900_2333390.mp4"}, {"claim": "OnlyFans creators control who they speak to, what they charge, and what they make.", "quote": "I have control again over who I speak to, what I charge, what I make.", "start": 2339.1, "end": 2342.62, "category": "Technology", "section": "Intro", "id": 175, "llm_start": 2338.9, "llm_end": 2342.6, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "Platform mechanics support the core claim: creators set their own subscription and pay-per-view prices, choose how they interact, and keep 80% of earnings after the platform’s 20% cut. But the control is not absolute—earnings depend on fan demand and platform or agency cuts, and some creators use agencies or paid chatters, so they may not personally control every conversation or final income.", "sources": [{"title": "How OnlyFans Works: Subs, Payouts, Revenue Streams", "url": "https://onlyfansstatistics.com/how-it-works"}, {"title": "OnlyFans Review (2026): how it works, fees and is it safe?", "url": "https://fanchecked.com/blog/onlyfans-review"}, {"title": "OnlyFans Agencies in 2026: What They Do, How Much They Take ...", "url": "https://fanchecked.com/blog/onlyfans-agency-guide"}], "t": 2339, "clip": "clips/claim_175_2337100_2344620.mp4"}, {"claim": "OnlyFans creators do not necessarily have to make porn, do nude content, or physically touch a man.", "quote": "I don't necessarily even have to make porn or even necessarily have to do nude content if I want to. I don't have to even touch a man.", "start": 2342.62, "end": 2347.1, "category": "Technology", "section": "Intro", "id": 176, "llm_start": 2342.6, "llm_end": 2347.1, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "OnlyFans' own terms and platform descriptions say it is open to creators of all genres and lets creators monetize content on their own terms. Nothing in the cited policies requires creators to produce porn, appear nude, or have physical sexual contact. The claim is therefore accurate as a general statement about OnlyFans creators.", "sources": [{"title": "Terms of Service — OnlyFans", "url": "https://onlyfans.com/terms"}, {"title": "Start OnlyFans | Join and Earn Today", "url": "https://start.onlyfans.com/"}, {"title": "OnlyFans", "url": "https://onlyfans.com/transparency-center/policy"}], "t": 2342, "clip": "clips/claim_176_2340620_2349100.mp4"}, {"claim": "Sophie Rain is the highest-earning OnlyFans creator in the world.", "quote": "she's the highest creator in the world and Onlyfans", "start": 2350.94, "end": 2352.98, "category": "Biography", "section": "Intro", "id": 177, "llm_start": 2350.9, "llm_end": 2354.0, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "Sources show Sophie Rain has the largest publicly disclosed OnlyFans earnings total, but these figures are self-reported and unaudited. OnlyFans does not publish creator earnings or a ranking, and sources note that many top earners never disclose their numbers, so it cannot be confirmed that she is the highest-earning creator in the world.", "sources": [{"title": "Top OnlyFans Earners 2026: Highest Paid Creators Ranked", "url": "https://whopaysinfluencers.com/rankings/top-onlyfans-earners/"}, {"title": "OnlyFans Top Earners 2026: Reported Figures, Not Rumors", "url": "https://spicyranked.com/blog/onlyfans-top-earners"}], "t": 2350, "clip": "clips/claim_177_2348940_2354980.mp4"}, {"claim": "Sophie Rain has never done nudity.", "quote": "she's never done nudity", "start": 2352.98, "end": 2354.02, "category": "Biography", "section": "Intro", "id": 178, "llm_start": 2352.5, "llm_end": 2354.0, "match_score": 1.0, "low_match": false, "verdict": "Misleading", "explanation": "Sources indicate Sophie Rain has said she has never been fully naked or done full-frontal nudity, and one analysis found no verified explicit content. But she has also acknowledged occasional 'nip slips' and bikini stripteases, so the absolute phrase 'never done nudity' is overbroad and largely rests on her own public statements rather than independent verification.", "sources": [{"title": "Sophie Rain Reveals The OF Boundary She Refuses To Cross", "url": "https://theblast.com/847246/sophie-rain-of-boundary-refuses-to-cross/"}, {"title": "Does Sophie Rain Actually Have Naked Content or Is It All Marketing ...", "url": "https://explore.oreateai.com/explore/does-sophie-rain-actually-have-naked-content-or-is-it-all-marketing-strategy"}, {"title": "Sophie Rain Says Fans Have Never Fully Seen Her Uncovered on OnlyFans", "url": "https://www.hypefresh.com/sophie-rain-says-fans-have-never-fully-seen-her-uncovered-on-onlyfans/"}], "t": 2352, "clip": "clips/claim_178_2350980_2356020.mp4"}, {"claim": "The purpose of OnlyFans is to commodify sexual gratification.", "quote": "And it's to commodify sexual gratification", "start": 2362.06, "end": 2364.46, "category": "Technology", "section": "Intro", "id": 179, "llm_start": 2362.1, "llm_end": 2364.5, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The claim is an interpretive assertion about OnlyFans’s \"purpose,\" not a directly verifiable fact. Sources describe OnlyFans as a platform primarily for sexually explicit content and criticize it for commodifying sexuality and intimacy [2][15], but they do not establish that commodifying sexual gratification is the platform’s defining purpose.", "sources": [{"title": "What OnlyFans Reveals About the Trajectory of Human Behavior", "url": "https://www.psychologytoday.com/us/blog/pop-culture-mental-health/202604/what-onlyfans-reveals-about-the-trajectory-of-human-behavior"}, {"title": "OnlyFans use and satisfactions with oneself and others: The role of ...", "url": "https://journals.sagepub.com/doi/10.1177/14614448251342235"}], "t": 2362, "clip": "clips/claim_179_2360060_2366460.mp4"}, {"claim": "89% of the OnlyFans creator's consumers are married men.", "quote": "89% of your consumers are married men", "start": 2370.02, "end": 2374.34, "category": "Statistics", "section": "Intro", "id": 180, "llm_start": 2370.0, "llm_end": 2374.3, "match_score": 1.0, "low_match": false, "verdict": "False", "explanation": "The available statistic says 89.5% of typical OnlyFans users are married and 63.1% are male, not that 89% of consumers are married men; combining those figures would produce a much lower share. Another source only supports that a majority of subscribers are married, not that 89% are married men, and no source establishes this for the specific creator’s consumers.", "sources": [{"title": "OnlyFans Statistics By Revenues And Facts (2026) - Sci-Tech Today", "url": "https://www.sci-tech-today.com/stats/onlyfans-statistics-updated/"}, {"title": "The Men on OnlyFans Aren't Only Who You Think - Psychology Today", "url": "https://www.psychologytoday.com/us/blog/dinner-party-smart/202308/men-subscribing-to-onlyfans-are-not-who-you-might-think"}], "t": 2370, "clip": "clips/claim_180_2368020_2376340.mp4"}, {"claim": "The speaker is not Christian.", "quote": "I'm not Christian", "start": 2420.78, "end": 2421.28, "category": "Biography", "section": "Intro", "id": 181, "llm_start": 2420.8, "llm_end": 2421.8, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The supplied sources all discuss the religious concept of a Jubilee year or unrelated entities named Jubilee (Jubilee Life, Jubilee Ministries, a Christian music site); none addresses the personal religious beliefs of anyone in the Jubilee video, and none contains the quoted line \"I'm not Christian.\" A statement about the speaker's own religion could only be self-reported, and no transcript or independent confirmation is provided here. The claim therefore cannot be verified from the available evidence.", "sources": [{"title": "Jubilee - YouTube", "url": "https://www.youtube.com/c/jubileemedia/videos"}], "t": 2420, "clip": "clips/claim_181_2418780_2423280.mp4"}, {"claim": "The speaker is Jewish.", "quote": "I'm Jewish", "start": 2421.62, "end": 2422.12, "category": "Biography", "section": "Intro", "id": 182, "llm_start": 2421.6, "llm_end": 2423.3, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The statement is a self-identification made in the video, and the provided sources do not independently confirm the speaker's religious identity. The sources concern Jubilee and its founder, not the quoted claim. Without independent corroboration, the claim cannot be verified.", "sources": [], "t": 2421, "clip": "clips/claim_182_2419620_2424120.mp4"}, {"claim": "Martha Nussbaum is a philosopher.", "quote": "So for instance, like Martha Nisbaum, who's a philosopher", "start": 2466.72, "end": 2468.8, "category": "Biography", "section": "Intro", "id": 183, "llm_start": 2466.7, "llm_end": 2470.2, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Martha Nussbaum is widely documented as an American philosopher; her University of Chicago philosophy department profile and Britannica both describe her as such, and she holds the Ernst Freund Distinguished Service Professor of Law and Ethics appointment in Chicago's philosophy department. The claim is straightforwardly accurate.", "sources": [{"title": "Martha Nussbaum - Wikipedia", "url": "https://en.wikipedia.org/wiki/Martha_Nussbaum"}, {"title": "Martha C. Nussbaum | Department of Philosophy", "url": "https://philosophy.uchicago.edu/faculty/nussbaum"}, {"title": "Martha Nussbaum | Biography, Philosophy, Aristotle, & Works - Britannica", "url": "https://www.britannica.com/biography/Martha-Nussbaum"}, {"title": "Martha C. Nussbaum | National Endowment for the Humanities", "url": "https://www.neh.gov/about/awards/jefferson-lecture/martha-nussbaum-biography"}, {"title": "Martha C. Nussbaum | The University of Chicago Divinity School", "url": "https://divinity.uchicago.edu/directory/martha-c-nussbaum"}], "t": 2466, "clip": "clips/claim_183_2464720_2470800.mp4"}, {"claim": "Martha Nussbaum has talked extensively about objectification.", "quote": "who's a philosopher who's talked a lot about objectification", "start": 2468.08, "end": 2470.24, "category": "Other", "section": "Intro", "id": 184, "llm_start": 2468.1, "llm_end": 2470.2, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Martha Nussbaum authored the influential 1995 essay “Objectification” and has extensively analyzed the concept in philosophical work. The Stanford Encyclopedia of Philosophy notes that she challenged the idea that objectification is necessarily negative, and other sources describe her as enhancing and reshaping the concept. This supports the claim that she has discussed objectification extensively.", "sources": [{"title": "Objectification - NUSSBAUM - 1995 - Philosophy & Public ...", "url": "https://onlinelibrary.wiley.com/doi/abs/10.1111/j.1088-4963.1995.tb00032.x"}, {"title": "Feminist Perspectives on Objectification (Stanford ...", "url": "https://plato.stanford.edu/entries/feminism-objectification/"}, {"title": "Objectification - ResearchGate", "url": "https://www.researchgate.net/publication/228046410_Objectification"}, {"title": "Martha Nussbaum (University of Chicago): Publications ...", "url": "https://philpeople.org/profiles/martha-craven-nussbaum/publications?order=viewings"}], "t": 2468, "clip": "clips/claim_184_2466080_2472240.mp4"}, {"claim": "Martha Nussbaum discusses objectification in the context of sex between husbands and wives.", "quote": "she talks about how like when husbands and wives have sex in theory,", "start": 2470.24, "end": 2472.76, "category": "Other", "section": "Intro", "id": 185, "llm_start": 2470.2, "llm_end": 2472.8, "match_score": 1.0, "low_match": false, "verdict": "Mostly true", "explanation": "The Stanford Encyclopedia entry confirms that Nussbaum discusses objectification in the sexual realm and argues that some objectification can be benign or positive, using objectification between lovers in D. H. Lawrence’s novels as an example. This supports the substance of the claim that she discusses objectification in intimate sexual relationships, though the cited sources do not use the exact “husbands and wives” framing.", "sources": [{"title": "Feminist Perspectives on Objectification (Stanford ...", "url": "https://plato.stanford.edu/entries/feminism-objectification/"}, {"title": "Sexual Objectification: A Review of Nussbaum's Account - Arcadia", "url": "https://www.byarcadia.org/post/sexual-objectification-a-review-of-nussbaum-s-account"}], "t": 2470, "clip": "clips/claim_185_2468240_2474760.mp4"}, {"claim": "Martha Nussbaum discusses the idea that using a partner's torso as a pillow can be an instance of objectifying them.", "quote": "you're objectifying your partner in a sense when you use their torso as a pillow, right?", "start": 2477.12, "end": 2480.2, "category": "Other", "section": "Intro", "id": 186, "llm_start": 2477.1, "llm_end": 2480.2, "match_score": 1.0, "low_match": false, "verdict": "True", "explanation": "Nussbaum’s essay on objectification analyzes examples of using another person’s body in ways that can count as objectification, and the scholarly article titled “Martha’s Pillow: Nussbaum on Sex and Justice” directly discusses the pillow example in her work. The claim is therefore supported: Nussbaum does discuss using a partner’s torso as a pillow as a possible instance of objectification.", "sources": [{"title": "Objectification - MIT - Massachusetts Institute of Technology", "url": "https://www.mit.edu/~shaslang/mprg/nussbaumO.pdf"}, {"title": "Martha's Pillow: Nussbaum on Sex and Justice - AcademiaObjectification - ResearchGateNussbaum, Martha. Objectification | PDF | Copyright | Civil ...Feminist Perspectives on Objectification (Stanford ...", "url": "https://www.academia.edu/14633389/Marthas_Pillow_Nussbaum_on_Sex_and_Justice"}], "t": 2477, "clip": "clips/claim_186_2475120_2482200.mp4"}, {"claim": "The speaker has ADHD.", "quote": "I got ADHD", "start": 2529.17, "end": 2530.08, "category": "Health", "section": "Intro", "id": 187, "llm_start": 2526.8, "llm_end": 2530.1, "match_score": 1.0, "low_match": false, "verdict": "Unverifiable", "explanation": "The claim rests on the speaker’s own statement in the video (“I got ADHD”), which is a self-reported medical claim. No independent source among the numbered results confirms an ADHD diagnosis for this speaker; the ADHD-related Jubilee material [6][8] does not verify this individual. It is therefore self-reported only.", "sources": [{"title": "Do All People with ADHD Think the Same? | SPECTRUM", "url": "https://www.youtube.com/watch?v=qd6k8PZDicw"}, {"title": "ADHD IN ME | @jubilee - YouTube", "url": "https://www.youtube.com/watch?v=VQ2Z4PKwbxk"}], "t": 2529, "clip": "clips/claim_187_2527170_2532080.mp4"}, {"claim": "People usually do not classify benign sexual objectification as objectification because they think objectification necessarily means degradation.", "quote": "We just don't classify it that way usually because we think objectification has to necessarily mean degrading", "star
