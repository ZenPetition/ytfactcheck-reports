ion. It is not among states constitutionally or politically classified as socialist, despite the historical influence of its Socialist Party and past nationalizations.", "sources": [{"title": "Politics of France - Wikipedia", "url": "https://en.wikipedia.org/wiki/Politics_of_France"}, {"title": "Is France Socialist or Capitalist? (With Examples) (2026)", "url": "https://helpfulprofessor.com/is-france-socialist-or-capitalist/"}, {"title": "Socialist Countries (2026): Definitive List & Explained", "url": "https://geographypin.com/socialist-countries/"}, {"title": "Socialist Countries 2026 - World Population Review", "url": "https://worldpopulationreview.com/country-rankings/socialist-countries"}], "t": 597, "clip": "clips/claim_014.mp4"}, {"claim": "China is run by the Chinese Communist Party.", "quote": "They're run by the Chinese Communist Party", "start": 604.4, "end": 607.0, "category": "Politics", "section": "10. Capitalism vs Communism (Tense)", "id": 15, "verdict": "True", "explanation": "The People's Republic of China is a one-party Leninist state in which the Chinese Communist Party (CCP) has held sole governing power since 1949. Multiple independent sources state that the CCP dominates politics, controls the government, military, and police, and exercises overall leadership under the constitution. This matches the quoted claim that China is run by the Chinese Communist Party.", "sources": [{"title": "Politics of China - Wikipedia", "url": "https://en.wikipedia.org/wiki/Politics_of_China"}, {"title": "China anniversary: How the Communist Party runs the country - BBC", "url": "https://www.bbc.com/news/world-asia-china-49631120"}, {"title": "Chinese Communist Party (CCP) | History & Party Structure | Britannica", "url": "https://www.britannica.com/topic/Chinese-Communist-Party"}, {"title": "What type of government does China have? - BBC", "url": "https://www.bbc.co.uk/bitesize/guides/z9yfrdm/revision/2"}, {"title": "PDF China Primer: China's Political System - "}, {"claim": "Most people who use Florida medical marijuana cards are 65 or older.", "quote": "Florida have a card and guess who uses it mostly? people 65 and older.", "start": 958.9, "end": 963.6, "category": "Statistics", "section": "15. Marijuana legislation", "id": 18, "verdict": "False", "explanation": "No provided source shows that a majority of Florida medical-marijuana cardholders are 65 or older. Source [1] states that recent age-distribution figures are limited and describes a diverse patient base in which younger and middle-aged adults form significant shares while seniors are only an increasing segment. Other sources give total patient counts or note Florida’s overall elderly population, not cardholder ages.", "sources": [{"title": "Marijuana Consumption in Florida: A Demographic Analysis ...", "url": "https://ftlauderdaleweeddelivery.com/marijuana-consumption-in-florida-a-demographic-analysis-2022-2024/"}], "t": 958, "clip": "clips/claim_018.mp4"}, {"claim": "John Morgan takes a gummy every night.", "quote": "I I take a gummy every night.", "start": 985.8, "end": 987.8, "category": "Biography", "section": "16. Marijuana legislation", "id": 19, "verdict": "True", "explanation": "Multiple independent news reports quote John Morgan stating that he takes a marijuana gummy every night before bed, matching the video claim. Forbes, Tallahassee.com, The Floridian, WUSF, and Florida Politics all attribute this habit directly to him.", "sources": [{"title": "Meet John Morgan, The Billionaire Lawyer Behind $350 Million ...", "url": "https://www.forbes.com/sites/brandonkochkodin/2024/12/05/john-morgan-personal-injury-lawyers-billionaire/"}, {"title": "Florida attorney John Morgan to endorse legal marijuana in ad ...", "url": "https://www.tallahassee.com/story/news/politics/elections/2024/05/29/john-morgan-endorses-florida-recreational-weed-might-run-for-governor-marijuana/73878941007/"}, {"title": "For the People? TV Attorney John Morgan Launching New ...", "url": "https://floridianpress.com/2025/02/for-the-people-tv-attorney-john-morgan-launching-new-political-party/"}, {"title": "The return of ‘Pot Daddy’: Morgan endorses recreational ...", "url": "https://www.wusf.org/health-news-florida/2024-06-03/the-return-of-pot-daddy-morgan-endorses-recreational-marijuana-measure"}, {"title": "John Morgan lights up Florida fight for medical marijuana ...", "url": "https://floridapolitics.com/archives/676810-john-morgan-lights-up-florida-fight-for-medical-marijuana-endorses-amendment-3/"}], "t": 985, "clip": "clips/claim_019.mp4"}, {"claim": "A Tylenol pill can cost $20 at one hospital and $1 at another.", "quote": "You can get a Tylenol pill over here for 20 bucks. It could be a dollar at the other hospital.", "start": 1063.5, "end": 1071.4, "category": "Economics", "section": "17. Healthcare industry", "id": 20, "verdict": "Mostly true", "explanation": "Reports document hospitals charging patients $15 or even around $200 for a single Tylenol/acetaminophen pill due to inflated chargemaster prices. Hospital prices for identical items vary widely and arbitrarily, as reflected in CMS price-transparency rules, so a roughly $20 charge at one facility versus a much lower charge at another is plausible even if a precise $1 hospital price is not shown.", "sources": [{"title": "10 Wildly Overinflated Hospital Costs | The Healthy", "url": "https://www.thehealthy.com/healthcare/health-insurance/wildly-overinflated-hospital-costs/"}, {"title": "Why Hospitals Charge $200 for a Tylenol: The Chargemaster ...", "url": "https://coveredusa.org/en/blog/why-hospitals-charge-so-much-for-tylenol"}, {"title": "Hospital Price Transparency | CMS", "url": "https://www.cms.gov/priorities/key-initiatives/hospital-price-transparency"}], "t": 1063, "clip": "clips/claim_020.mp4"}, {"claim": "Pharmaceuticals in the United States cost more than pharmaceuticals in China.", "quote": "Our pharmaceuticals in this country are way more money than pharmaceuticals in his favorite country, China.", "start": 1073.9, "end": 1083.4, "category": "Economics", "section": "17. Healthcare industry", "id": 21, "verdict": "Mostly true", "explanation": "A direct comparison of matched generic drugs found a median China-to-US price ratio of about 38% after exchange-rate adjustment, so US prices were generally higher, though roughly 27% of those drugs were costlier in China. The comparison covers only volume-procured generics versus US public-sector prices, not all pharmaceuticals or retail/brand prices. Broader studies show US drug prices exceed those in other countries but do not include China, so the sweeping claim is directionally supported rather than universally proven.", "sources": [{"title": "Comparison of generic drug prices between China and the ...", "url": "https://www.ispor.org/docs/default-source/euro2024/isporeurope24lihpr154poster147084-pdf.pdf?sfvrsn=8e11c998_0"}, {"title": "HPR154 Comparison of Generic Drug Prices Between China and ...", "url": "https://www.valueinhealthjournal.com/article/S1098-3015(24)04443-7/fulltext"}, {"title": "Comparison of Generic Drug Prices Between China and ... - ISPOR", "url": "https://www.ispor.org/heor-resources/presentations-database/presentation/euro2024-4015/147084"}], "t": 1073, "clip": "clips/claim_021.mp4"}, {"claim": "Every other major country has a socialized form of healthcare.", "quote": "every other country, every other major country has a socialized form of healthcare.", "start": 1119.4, "end": 1122.4, "category": "Health", "section": "18. Socialized healthcare?", "id": 22, "verdict": "Misleading", "explanation": "Most other high-income countries have universal health coverage with substantial government financing or regulation, but systems vary widely and are not all “socialized” (government-owned and operated care). Many use social-insurance or mixed public-private models rather than a fully socialized system, so the absolute claim overstates and mislabels the evidence.", "sources": [{"title": "Universal health care by country - Wikipedia", "url": "https://en.wikipedia.org/wiki/Universal_health_care_by_country"}, {"title": "Health care systems by country - Wikipedia", "url": "https://en.wikipedia.org/wiki/Health_care_systems_by_country"}, {"title": "What Countries Have Social Health Insurance?", "url": "https://insuranceinformant.com/what-countries-have-social-health-insurance.html"}, {"title": "Countries Without Universal Healthcare - WorldAtlas", "url": "https://www.worldatlas.com/society/countries-without-universal-healthcare-55525.html"}], "t": 1119, "clip": "clips/claim_022.mp4"}, {"claim": "Barack Obama visited John Morgan's house while Obama was president.", "quote": "When Obama was president, he came to my house as president.", "start": 1122.4, "end": 1126.8, "category": "Biography", "section": "18. Socialized healthcare?", "id": 23, "verdict": "True", "explanation": "Contemporary reporting confirms that President Barack Obama visited the Lake Mary home of John and Ultima Morgan on October 11, 2011, for a campaign fundraiser while he was president. Later profiles also state that Morgan hosted Obama at his mansion.", "sources": [{"title": "The Morgans Host President Obama - Orlando Magazine", "url": "https://www.orlandomagazine.com/the-morgans-host-president-obama/"}, {"title": "Obama to visit Orlando Sheraton, home of John Morgan on Oct. 11", "url": "https://www.orlandosentinel.com/2011/10/04/obama-to-visit-orlando-sheraton-home-of-john-morgan-on-oct-11/"}, {"title": "From Rags To Riches To Politics: John Morgan Playing Key Role in Election", "url": "https://www.theledger.com/story/news/2013/11/30/from-rags-to-riches-to/8157371007/"}], "t": 1122, "clip": "clips/claim_023.mp4"}, {"claim": "John Morgan served on the national finance committee for Obama.", "quote": "I'm on the national finance committee for Obama.", "start": 1126.8, "end": 1130.8, "category": "Politics", "section": "18. Socialized healthcare?", "id": 24, "verdict": "Unverifiable", "explanation": "Sources confirm John Morgan was a major Democratic fundraiser and bundler who raised millions for Obama's campaigns, but none explicitly state that he served on Obama's national finance committee. Source 4 references that committee without listing members, so the specific claim cannot be verified from the evidence.", "sources": [{"title": "Obama for America National Finance Committee", "url": "https://p2008.org/obama/obamafinancecomm.html"}, {"title": "Whistle-Blowers' Lawyers Donate to Obama Campaign - The New York Times", "url": "https://www.nytimes.com/2012/10/02/us/politics/whistle-blower-lawyers-donate-to-obama-campaign.html"}, {"title": "John Morgan - Influence Watch", "url": "https://www.influencewatch.org/person/john-morgan/"}, {"title": "Wealthy supporters fuel Obama nonprofit - Center for Public Integrity", "url": "https://publicintegrity.org/politics/wealthy-supporters-fuel-obama-nonprofit/"}], "t": 1126, "clip": "clips/claim_024.mp4"}, {"claim": "A lot of people lost their House seats for voting for Obamacare.", "quote": "A lot of people lost their House seats for voting for Obamacare.", "start": 1134.1, "end": 1143.7, "category": "Politics", "section": "18. Socialized healthcare?", "id": 25, "verdict": "Mostly true", "explanation": "Democrats suffered a net loss of 63 House seats in the 2010 midterms, widely attributed in part to passage of the Affordable Care Act along with the weak economy. Many of the roughly 219 House Democrats who voted for the bill lost reelection, though causation was not solely the vote—some analyses isolate only about 13 losses specifically to it, and many Democrats who voted against the bill also lost.", "sources": [{"title": "2010 United States elections - Wikipedia", "url": "https://en.wikipedia.org/wiki/2010_United_States_elections"}, {"title": "Healthcare Vote Doomed 13 Democrats in 2010 Elections", "url": "https://www.usnews.com/news/blogs/washington-whispers/2011/04/12/healthcare-vote-doomed-13-democ  "John Morgan has cases against the tobacco industry.", "quote": "I have cases against the tobacca industry.", "start": 1444.6, "end": 1447.0, "category": "Other", "section": "22. What happens after a case it won?", "id": 33, "verdict": "True", "explanation": "John Morgan founded Morgan & Morgan, and multiple sources document that the firm has brought and won major lawsuits against tobacco companies such as R.J. Reynolds and other Big Tobacco defendants, including multi-million-dollar verdicts. His statement that he has cases against the tobacco industry is therefore supported by the firm’s documented litigation record.", "sources": [{"title": "John Morgan (lawyer) - Wikipedia", "url": "https://en.wikipedia.org/wiki/John_Morgan_(lawyer)"}, {"title": "$91M Verdict Won Against Big Tobacco - Morgan & Morgan Law Firm", "url": "https://www.forthepeople.com/blog/morgan-morgan-smokes-big-tobacco-91m-verdict/"}, {"title": "5 Landmark Victories Taking Down Big Tobacco - Morgan & Morgan Law Firm", "url": "https://www.forthepeople.com/blog/5-major-victories-against-big-tobacco/"}, {"title": "Widower Recovers $1.65M Verdict, Scores Victory Against Big Tobacco", "url": "https://thenationaltriallawyers.org/article/widower-of-smoker-recovers-1-65m-verdict-scores-major-victory-against-big-tobacco/"}, {"title": "Morgan & Morgan Wins $13.5 Million Verdict Against R.J. Reynolds ...", "url": "https://members.memphischamber.com/news/details/morgan-morgan-wins-13-5-million-verdict-against-r-j-reynolds-tobacco-company-04-26-2018"}, {"title": "Tobacco Litigation | Morgan & Morgan$91M Verdict Won Against Big Tobacco - Morgan & Morgan Law FirmTobacco Litigation: History & Recent Developments - Morgan ...Find a Case | PACER: Federal Court RecordsCourt Records - United States CourtsWidower Recovers $1.65M Verdict, Scores Victory Against Big ...Civil Division | Litigation Against Tobacco Companies Home ...", "url": "https://www.forthepeople.com/faq/tobacco-litigation/"}], "t": 1444, "clip": "clips/claim_033.mp4"}, {"claim": "There has been repeated tort reform legislation across the United States.", "quote": "There's been tort reform after tort reform all across America.", "start": 1475.1, "end": 1481.0, "category": "Politics", "section": "23. Lawyers vs Insurance Industry", "id": 34, "verdict": "True", "explanation": "Sources document decades of tort reform legislation across U.S. states, including damage caps, liability limits, and related statutes enacted or revised in all fifty states and D.C. since at least the 1970s–1980s. Databases and state-by-state records specifically track repeated reforms, and more than half of states have enacted limits such as noneconomic damages caps.", "sources": [{"title": "History of Tort Reform - Institute for Legal Reform", "url": "https://instituteforlegalreform.com/history-of-tort-reform/"}, {"title": "Database of State Tort Law Reforms (7.1) - SSRN", "url": "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=902711"}, {"title": "Tort Reform Record - American Tort Reform Association - atra.org", "url": "https://atra.org/tort-reform/tort-reform-record/"}, {"title": "PDF Tort Reform Record - atra.org", "url": "https://atra.org/wp-content/uploads/2025/05/Record-11-20-24.pdf"}, {"title": "Database of State Tort Law Reforms (3rd), 1980-2008", "url": "https://www.icpsr.umich.edu/web/ICPSR/studies/30409"}], "t": 1475, "clip": "clips/claim_034.mp4"}, {"claim": "Tort reform bills have never been tied to a mandatory decrease in insurance premiums.", "quote": "They've never tied one of those bills to a mandatory decrease of insurance premiums.", "start": 1492.7, "end": 1500.2, "category": "Economics", "section": "23. Lawyers vs Insurance Industry", "id": 35, "verdict": "Unverifiable", "explanation": "The sources debate whether tort reforms are followed by lower premiums, citing insurer rate filings and reductions in places such as Florida and Georgia as well as studies finding no consistent premium effect, but they never examine bill text for a required rollback. Available evidence therefore does not establish the universal claim that no tort-reform bill has ever mandated an insurance-premium decrease.", "sources": [{"title": "Legal Reforms Begin to Ease Insurance Costs for Consumers", "url": "https://www.iamagazine.com/news/legal-reforms-begin-to-ease-insurance-costs-for-consumers/"}, {"title": "As insurance rates fall, tort reform takes much-deserved victory lap", "url": "https://www.rstreet.org/commentary/as-insurance-rates-fall-tort-reform-takes-much-deserved-victory-lap/"}, {"title": "PDF Limiting Lawsuits (\"Tort Reform\") Will Not Lower Insurance Premiums", "url": "https://centerjd.org/system/files/InsuranceBackgrounder2024F.pdf"}, {"title": "Does Tort Reform Lower Insurance Premiums?", "url": "https://thehartmanlawfirm.com/does-tort-reform-lower-insurance-premiums/"}], "t": 1492, "clip": "clips/claim_035.mp4"}, {"claim": "John Morgan owns a private jet, which he describes as an excess.", "quote": "except you know my jet and that is excess", "start": 1608.9, "end": 1616.6, "category": "Biography", "section": "25. Faith vs Wealth", "id": 36, "verdict": "Unverifiable", "explanation": "No sources were provided to confirm the quote or John Morgan’s description of a private jet as excess. While he is a public figure known for substantial wealth, the specific ownership claim and wording cannot be verified from the given information.", "sources": [], "t": 1608, "clip": "clips/claim_036.mp4"}, {"claim": "John Morgan says he normally tips customer-service workers $100.", "quote": "100 bucks.", "start": 1651.4, "end": 1654.6, "category": "Biography", "section": "26. How much do you tip?", "id": 37, "verdict": "True", "explanation": "Source [1] states that when asked how much he tips servers, John Morgan answers without hesitation that he tips a hundred bucks, matching both the claim and the quoted phrase.", "sources": [{"title": "John Morgan's $100 Tip Won Him a Case 5 Years Later | Morgan", "url": "https://m.youtube.com/watch?v=0mil4LgL1xM"}], "t": 1651, "clip": "clips/claim_037.mp4"}, {"claim": "John Morgan says he and his wife are members of three different churches.", "quote": "We're a member of three different churches", "start": 1654.6, "end": 1656.2, "category": "Biography", "section": "26. How much do you tip?", "id": 38, "verdict": "Unverifiable", "explanation": "The sources cover John Morgan’s biography, marriage, and career and note that he met his wife at a church, but none quote or confirm the statement that he and his wife belong to three different churches. A Jubilee interview is mentioned, yet no transcript or supporting text of the claimed quote appears. The evidence is therefore insufficient to verify the claim.", "sources": [{"title": "Who are John Morgan's children? Billionaire says kids will only receive ...", "url": "https://www.soapcentral.com/entertainment/who-john-morgan-s-children-billionaire-says-kids-will-receive-1m-year-without-prenup"}, {"title": "Meet the Morgans: How they grew their firm by taking cases no one else ...", "url": "https://www.bizjournals.com/orlando/print-edition/2014/01/10/meet-the-morgans-how-they-grew-their.html"}, {"title": "John Morgan sits for “Ask Me Anything” Interview with Jubilee ...", "url": "https://www.wdbo.com/news/local/john-morgan-sits-ask-me-anything-interview-with-jubilee-youtube-channel/24ZCOHLVFBHK7PEB432OG6MHPM/"}], "t": 1654, "clip": "clips/claim_038.mp4"}, {"claim": "John Morgan handled a case in which a little boy was killed by a bus in Jacksonville.", "quote": "a little boy was killed by a bus in Jacksonville.", "start": 1675.5, "end": 1679.9, "category": "History", "section": "26. How much do you tip?", "id": 39, "verdict": "Unverifiable", "explanation": "None of the provided sources mention John Morgan or any case he handled involving a child killed by a bus in Jacksonville. Nearby reports describe school-bus crashes in the area in which children were injured, not killed, and were handled by other firms. The claim therefore cannot be confirmed from the given evidence.", "sources": [{"title": "Family of child injured in school bus crash on Zoo Parkway ...", "url": "https://www.news4jax.com/news/local/2026/04/03/family-of-child-injured-in-school-bus-crash-on-zoo-parkway-plans-to-pursue-legal-action/"}, {"title": "'Demands immediate scrutiny': Families of kindergartners ...", "url": "https://www.firstcoastnews.com/article/news/local/school-bus-crash-zoo-parkway-kindergartners-campione-law-farah-and-farah-hired/77-f8e750de-8b33-4179-8b3a-f96e9118ecfa"}], "t": 1675, "clip": "clips/claim_039.mp4"}, {"claim": "John Morgan says he met a woman at a Bob Evans on Christmas Eve and left a $100 tip, which later led her to call him about a case.", "quote": "It was Christmas Eve at uh Bob Evans", "start": 1687.8, "end": 1699.0, "category": "Biography", "section": "26. How much do you tip?", "id": 40, "verdict": "True", "explanation": "In a podcast interview, John Morgan recounts that an investigator told him a case involving a child killed by a bus came from a waitress at a Bob Evans in Lake Mary. The investigator said Morgan had eaten breakfast there one Christmas Eve and left her a $100 tip, which is how the firm got the case. This matches the substance of the claim and quote.", "sources": [{"title": "Episode 305 — John Morgan — Luck, Hustle, and the Art of Disruption ...", "url": "https://crisp.co/podcast/episode-305-john-morgan/"}], "t": 1687, "clip": "clips/claim_040.mp4"}, {"claim": "The Morgan & Morgan Hunger Relief Center serves people who are not homeless, including people dressed in work clothes who bring their children for free food.", "quote": "When you go out to the Morgan Morgan Hunger Relief Center, the people that are walking in there are not the homeless. They're walking in there dressed in workc clothes with their children to get free food", "start": 1734.2, "end": 1748.5, "category": "Other", "section": "27. Is it ethical to be a billionaire?", "id": 41, "verdict": "Unverifiable", "explanation": "Sources confirm that Morgan & Morgan funded the Hunger Relief Center, a Second Harvest Food Bank of Central Florida facility that supports broad hunger-relief distribution to partner agencies and neighbors. They do not describe client walk-ins, confirm that individuals (working or otherwise) obtain free food on site, or document the clothing or family status of any visitors. The specific observational claim therefore cannot be verified from the evidence.", "sources": [{"title": "Morgan & Morgan - Wikipedia", "url": "https://en.wikipedia.org/wiki/Morgan_&_Morgan"}, {"title": "Dedication of the Morgan & Morgan Hunger Relief Center", "url": "https://analogartistdigitalworld.com/dedication-of-morgan-morgan-hunger/"}, {"title": "Second Harvest takes big bite out of hunger today", "url": "https://www.wesh.com/article/second-harvest-takes-big-bite-out-of-hunger-today-1/4422600"}, {"title": "An incredible journey with humble beginnings - LinkedIn", "url": "https://www.linkedin.com/pulse/incredible-journey-humble-beginnings-feedhopenow"}, {"title": "Central Florida food banks, leaders mobilize as SNAP benefits at risk ...", "url": "https://www.bizjournals.com/orlando/news/2025/10/30/snap-funding-cut-florida-orange-county-orlando.html"}], "t": 1734, "clip": "clips/claim_041.mp4"}, {"claim": "The University of Florida hired Ben Sasse as president; Morgan says he was a friend of the governor, received a large amount of money, and remained on the payroll.", "quote": "the University of Florida, they hired this president who was just a buddy of the governors and he came up there and the University of Florida and took so much money and he's still on the payroll. Ben Sass.", "start": 1764.6, "end": 1775.4, "category": "Politics", "section": "27. Is it ethical to be a billionaire?", "id": 42, "verdict": "Mostly true", "explanation": "UF hired Ben Sasse as president under a 2023 contract, and he received roughly $1 million  given evidence.", "sources": [], "t": 1800, "clip": "clips/claim_043.mp4"}, {"claim": "John Morgan says he lives in Maui for half the year.", "quote": "really enjoys living in Maui half the year.", "start": 1809.0, "end": 1816.7, "category": "Geography", "section": "28. Political future?", "id": 44, "verdict": "Unverifiable", "explanation": "None of the sources contain a direct statement or the quoted phrasing from John Morgan about living in Maui half the year. Third-party comments only paraphrase a separate announcement as living in Hawaii half the year, while other posts merely note visits to Maui, which is insufficient to confirm the claim.", "sources": [{"title": "John Morgan on X: \"Today I have an announcement to make...\"", "url": "https://x.com/JohnMorganESQ/status/2043675586661359890"}, {"title": "@JohnMorganESQ His announcement: \"He lives in Hawaii for half the year ...", "url": "https://x.com/florida_grand/status/2043691179900866729"}, {"title": "John Morgan - Dan tied the knot here in Maui….4 down ... - Facebook", "url": "https://www.facebook.com/john.morgan.54922169/posts/dan-tied-the-knot-here-in-maui4-down-none-to-gothats-a-wrap/10162264522342503/"}, {"title": "John Morgan - We went to Maui | Facebook", "url": "https://www.facebook.com/JohnMorganESQ/posts/we-went-to-maui/1361948368632510/"}], "t": 1809, "clip": "clips/claim_044.mp4"}, {"claim": "John Morgan says opponents fought him hard over minimum wage and medical marijuana measures.", "quote": "they were fighting me hard on the minimum wage. They were fighting me hard on medical marijuana", "start": 1819.4, "end": 1828.8, "category": "Politics", "section": "28. Political future?", "id": 45, "verdict": "Unverifiable", "explanation": "The provided sources confirm John Morgan bankrolled and led successful Florida ballot efforts on medical marijuana (2016) and a $15 minimum wage (2020), which faced political opposition. However, none of the sources contain or corroborate the specific quote attributing those words to him.", "sources": [{"title": "John Morgan, who pushed medical marijuana in FL, announces ...", "url": "https://floridaphoenix.com/2024/05/29/john-morgan-who-pushed-medical-marijuana-announces-support-for-adult-recreational-cannabis-in-fl/"}, {"title": "Fair Minimum Wage in Florida | Morgan & Morgan", "url": "https://www.forthepeople.com/blog/john-morgans-next-mission-fair-minimum-wage-florida/"}, {"title": "Attorney John Morgan announces name of new political party | WUSF", "url": "https://www.wusf.org/politics-issues/2026-06-25/common-ground-john-morgan-announces-name-new-political-party"}], "t": 1819, "clip": "clips/claim_045.mp4"}, {"claim": "During the confrontation, John Morgan handed the speaker $100.", "quote": "He handed me $100", "start": 1980.6, "end": 1982.8, "category": "Other", "section": "29. Will John help the cast?", "id": 46, "verdict": "True", "explanation": "Contemporary reporting on the Jubilee confrontation describes John Morgan taking a $100 bill from his pocket and handing it to a participant during the session. A separate account of the same video likewise says a participant extracted a $100 bill from Morgan. That directly supports the claim that he handed the speaker $100.", "sources": [{"title": "The Billionaire in the Room: When Good Intentions Meet ...", "url": "https://jepstar.substack.com/p/the-billionaire-in-the-room-when"}, {"title": "How Florida’s political disruptor spent his summer - POLITICO", "url": "https://www.politico.com/newsletters/florida-playbook/2025/08/11/how-floridas-political-disruptor-spent-his-summer-00502624"}], "t": 1980, "clip": "clips/claim_046.mp4"}, {"claim": "John Morgan helps injured people obtain settlements they feel they deserve and profits from advocating for those injury cases.", "quote": "he is helping injured people get the uh settlement that they feel they deserve, he is still profiting off of advocating for that inj injury.", "start": 2024.6, "end": 2033.5, "category": "Biography", "section": "29. Will John help the cast?", "id": 47, "verdict": "True", "explanation": "John Morgan founded Morgan & Morgan, which describes itself as America’s largest personal-injury firm and says it has recovered tens of billions for clients. The firm works on contingency, typically taking about one-third of a pre-suit settlement and up to 40% if suit is filed, so it profits when clients recover. Public profiles also identify Morgan as a billionaire whose wealth comes from that practice.", "sources": [{"title": "John Morgan (lawyer) - Wikipedia", "url": "https://en.wikipedia.org/wiki/John_Morgan_(lawyer)"}, {"title": "Attorney John Morgan | Morgan & MorganJohn Morgan (lawyer) - WikipediaOur Results | Verdicts & Settlements | Morgan & MorganJohn Morgan - ForbesJohn Morgan - Personal Injury Lawyer | Lexinter Law DirectoryMeet John Morgan, The Billionaire Lawyer Behind $350 Million ...The Big Data/AI ‘Revolution’ Is Driving Up Verdicts ...", "url": "https://www.forthepeople.com/attorneys/john-morgan/"}, {"title": "Meet John Morgan, The Billionaire Lawyer Behind $350 Million ...", "url": "https://www.forbes.com/sites/brandonkochkodin/2024/12/05/john-morgan-personal-injury-lawyers-billionaire/"}, {"title": "Morgan and Morgan Settlement Fee: 2026 Breakdown", "url": "https://lawclaimcorner.com/how-much-does-morgan-and-morgan-take-from-a-settlement/"}, {"title": "How Much Does Morgan & Morgan Take From a Settlement?", "url": "https://mylegalhelper.us/2026/07/03/how-much-does-morgan-morgan-take-from-a-settlement/"}], "t": 2024, "clip": "clips/claim_047.mp4"}], "colors": {"True": "#22c55e", "Mostly true": "#84cc16", "Misleading": "#f59e0b", "False": "#ef4444", "Unverifiable": "#94a3b8"}, "banner": null}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),M=D.meta,C=D.colors;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const verdicts=Object.keys(C),active=new Set(verdicts);
const cats=[...new Set(D.items.map(i=>i.category))].sort();
const app=document.getElementById('app');
app.innerHTML=`${D.banner?`<div class="banner">${esc(D.banner)}</div>`:''}
<h1>${esc(M.title)}</h1><div class="chan">${esc(M.channel||'')} · <a href="${esc(M.webpage_url||('https://www.youtube.com/watch?v='+M.id))}" target="_blank" rel="noopener">Watch on YouTube</a>${M.duration?' · '+fmt(M.duration):''}</div>
<details class="desc"><summary>Video description</summary><pre>${esc(M.description||'(none)')}</pre></details>
<div class="summary">${verdicts.map(v=>`<div class="stat" data-v="${esc(v)}" style="border-top:4px solid ${C[v]}"><b>${D.items.filter(i=>i.verdict===v).length}</b>${esc(v)}</div>`).join('')}
<div class="stat" style="cursor:default"><b>${D.items.length}</b>Total claims</div></div>
<div class="controls"><input type="search" id="q" placeholder="Search claims, quotes, explanations…">
<select id="cat"><option value="">All categories</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
<select id="grp"><option value="cat">Group: category → section</option><option value="sec">Group: section → category</option><option value="time">Chronological</option></select></div>
<div id="list"></div><div class="foot">Verdicts are machine-generated (LLM + web search) and may be wrong. Check sources yourself.</div>`;
function media(i){
  if(i.clip)return `<video controls preload="metadata" src="${esc(i.clip)}"></video>`;
  const th=M.id?`https://i.ytimg.com/vi/${M.id}/hqdefault.jpg`:'';
  return `<div class="ph" data-t="${i.t}" style="background-image:url('${th}')"><span>▶ Play from ${fmt(i.t)}</span></div>`;
}
function card(i){
  const url=`https://www.youtube.com/watch?v=${M.id}&t=${i.t}s`;
  return `<div class="claim" style="--vc:${C[i.verdict]||'#94a3b8'}"><div>
  <span class="badge">${esc(i.verdict)}</span><a class="ts" href="${url}" target="_blank" rel="noopener">⏱ ${fmt(i.start)}–${fmt(i.end)}</a>
  <span class="ts" style="color:var(--muted)"> · ${esc(i.category)} · ${esc(i.section)}</span>
  <div class="ctext">${esc(i.claim)}</div>${i.quote?`<div class="quote">“${esc(i.quote)}”</div>`:''}
  <div>${esc(i.explanation)}</div>
  ${(i.sources||[]).length?`<ol class="src">${i.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a></li>`).join('')}</ol>`:'<div class="src" style="color:var(--muted)">No sources retrieved.</div>'}
  </div><div class="media">${media(i)}</div></div>`;
}
function group(arr,k){const m=new Map();arr.forEach(i=>{if(!m.has(i[k]))m.set(i[k],[]);m.get(i[k]).push(i)});return m}
const secOrder=t=>{const i=D.sections.findIndex(s=>s.title===t);return i<0?1e9:i};
function draw(){
  const q=document.getElementById('q').value.toLowerCase(),cat=document.getElementById('cat').value,g=document.getElementById('grp').value;
  const f=D.items.filter(i=>active.has(i.verdict)&&(!cat||i.category===cat)&&(!q||[i.claim,i.quote,i.explanation,i.section,i.category].join(' ').toLowerCase().includes(q)));
  const L=document.getElementById('list');
  if(!f.length){L.innerHTML='<div class="empty">No claims match the current filters.</div>';return}
  if(g==='time'){L.innerHTML=f.map(card).join('');return}
  const [k1,k2]=g==='cat'?['category','section']:['section','category'];
  const keys1=[...group(f,k1).entries()].sort((a,b)=>k1==='section'?secOrder(a[0])-secOrder(b[0]):a[0].localeCompare(b[0]));
  L.innerHTML=keys1.map(([a,arr])=>`<h2>${esc(a)} <span style="color:var(--muted);font-size:14px">(${arr.length})</span></h2>`+
    [...group(arr,k2).entries()].sort((x,y)=>k2==='section'?secOrder(x[0])-secOrder(y[0]):x[0].localeCompare(y[0]))
    .map(([b,arr2])=>`<h3>${esc(b)}</h3>`+arr2.map(card).join('')).join('')).join('');
}
document.querySelectorAll('.stat[data-v]').forEach(el=>el.onclick=()=>{const v=el.dataset.v;active.has(v)?active.delete(v):active.add(v);el.classList.toggle('off');draw()});
['q','cat','grp'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
document.getElementById('list').addEventListener('click',e=>{const p=e.target.closest('.ph');if(!p)return;
